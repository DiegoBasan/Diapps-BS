<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rutinas</title>
<meta name="description" content="Hábitos diarios y semanales, con un toque">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rutinas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDEDEF">
<script>
/* Tema compartido entre las apps de Diapps: empieza en claro; el modo oscuro se elige en el menú */
(function(){var t="light";try{t=localStorage.getItem("diapps-theme")||"light"}catch(e){}document.documentElement.dataset.theme=t})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<script src="../shared/ia.js"></script>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../shared/desk.css">
<script src="../shared/desk.js"></script>
<script src="../shared/nube.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap">
<style>
/* Rutinas: reloj de 24 h como pieza central + hábitos como cápsulas de segmentos.
   Movimiento con física de resorte (curvas linear() generadas en JS, técnica de Kinetics / spring-easing). */
:root{
  --bg:#EDEDEF; --card:#FFFFFF; --card2:#F4F4F5; --line:#E4E4E7; --line2:#D3D3D8;
  --ink:#111113; --ink2:#85858C; --ink3:#B4B4BA; --lime:#C6EE3A; --down:#E5484D;
  --glass:rgba(255,255,255,.62); --glassBorder:rgba(255,255,255,.8); --glassShadow:rgba(30,32,40,.14);
  --scrim:rgba(0,0,0,.32);
  --spring:cubic-bezier(.2,1.3,.4,1); --spring-soft:cubic-bezier(.2,.9,.25,1); --dur:.55s;
  --font:"Urbanist",-apple-system,"SF Pro Text",system-ui,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121214; --card:#1E1E21; --card2:#27272B; --line:#2E2E33; --line2:#3B3B42;
  --ink:#F3F3F4; --ink2:#8E8E96; --ink3:#56565D; --down:#FF6166;
  --glass:rgba(40,40,46,.6); --glassBorder:rgba(255,255,255,.1); --glassShadow:rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button,.nav,h1,h2,.lbl,.hab{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{font:inherit;color:inherit;font-size:16px}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:440px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 18px calc(118px + env(safe-area-inset-bottom,0px))}
.press{transition:transform .5s var(--spring)}
.press:active{transform:scale(.94);transition-duration:.12s}
/* entrada escalonada */
.rise{animation:rise .7s var(--spring-soft) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}}
::view-transition-old(root){animation:vtOut .22s ease-in both}
::view-transition-new(root){animation:vtIn .42s cubic-bezier(.2,.9,.25,1) both}
@keyframes vtOut{to{opacity:0;transform:translateY(-6px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(10px)}}

/* encabezado */
.bar{display:flex;align-items:center;gap:8px;padding:6px 0 4px}
.bar .sp{flex:1}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;text-align:left}
.brand img{width:36px;height:36px;border-radius:10px;display:block}
.brand small{display:block;font-size:12px;font-weight:500;color:var(--ink2);line-height:1.1}
.rb{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}
.rb svg{width:20px;height:20px}
h1{font-size:40px;font-weight:600;letter-spacing:-.035em;line-height:1.05;margin:16px 0 0}
.subttl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 4px;color:var(--ink2);font-size:14px;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--card);color:var(--ink);font-weight:600;font-size:13.5px}
.chip.ok{background:color-mix(in srgb,var(--lime) 50%,transparent);color:#26300a}
:root[data-theme="dark"] .chip.ok{color:var(--lime)}

/* días de la semana (cinta superior) */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 10px;border-radius:18px;font-size:12px;font-weight:600;color:var(--ink2)}
.day b{font-size:15px;color:var(--ink)}
.day svg{width:30px;height:30px;transform:rotate(-90deg)}
.day[aria-current="date"]{background:var(--card)}
.day circle{transition:stroke-dashoffset 1s var(--spring-soft)}

/* reloj del día */
.dial{position:relative;margin:14px auto 0;width:min(330px,88vw);aspect-ratio:1}
.dial svg{width:100%;height:100%;display:block;overflow:visible}
.dial .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.dial .ctr b{display:block;font-size:50px;font-weight:700;letter-spacing:-.05em;line-height:1}
.dial .ctr b small{font-size:22px;letter-spacing:0;margin-left:2px}
.dial .ctr>div>span{display:block;font-size:13.5px;color:var(--ink2);font-weight:500;margin-top:4px}
.dial .dot{transform-box:fill-box;transform-origin:center;animation:dotIn .7s var(--spring) both}
@keyframes dotIn{from{transform:scale(0)}}
.dial .hand{transition:transform 1s var(--spring-soft)}
.dial .prog{transition:stroke-dashoffset 1.2s var(--spring-soft)}
.legendH{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--ink2);margin-top:4px}
.legendH i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

/* hábitos: lista agrupada estilo iOS (ícono tipo Ajustes, separadores finos, anillo de check a la derecha) */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:24px 16px 7px}
.sec h2{font-size:13px;font-weight:600;margin:0;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.sec span{font-size:13px;color:var(--ink2);font-weight:500}
.group{background:var(--card);border-radius:22px;overflow:hidden}
.hab{--c:var(--lime);position:relative;display:flex;align-items:center;gap:13px;width:100%;min-height:62px;padding:9px 14px 9px 14px;text-align:left;background:transparent;transition:background-color .35s}
.hab:active,.hab.holding{background:var(--card2);transition-duration:.05s}
.hab+.hab::before{content:"";position:absolute;top:0;left:59px;right:0;height:.5px;background:var(--line2)}
.hab .ico{width:32px;height:32px;border-radius:9px;background:var(--c);color:#16171A;display:grid;place-items:center;flex:none}
.hab .ico svg{width:18px;height:18px}
.hab .t{flex:1;min-width:0;padding:2px 0}
.hab b{display:block;font-size:17px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.hab small{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);font-weight:500;margin-top:1px;white-space:nowrap}
.wk{display:inline-flex;gap:3px}
.wk i{width:6px;height:6px;border-radius:50%;background:var(--line2)}
.wk i.on{background:var(--c)}
.wk i.today{box-shadow:0 0 0 1.5px var(--ink2)}
/* anillo de check */
.chk{position:relative;width:30px;height:30px;flex:none;display:grid;place-items:center;transition:transform .55s var(--spring)}
.chk svg.r{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.chk .bg{fill:none;stroke:var(--line2);stroke-width:2.2}
.chk .fg{fill:none;stroke:var(--c);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .7s var(--spring-soft)}
.chk .cnt{font-size:10.5px;font-weight:700;color:var(--ink2);position:relative}
.chk .ok{position:absolute;inset:0;border-radius:50%;background:var(--c);display:grid;place-items:center;transform:scale(0);transition:transform .55s var(--spring)}
.chk .ok svg{width:17px;height:17px;color:#16171A}
.chk .ok path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .45s .12s ease-out}
.hab.done .chk .ok{transform:scale(1)}
.hab.done .chk .ok path{stroke-dashoffset:0}
.hab.done b{color:var(--ink2)}
.chk.pop{animation:chkPop .6s var(--spring)}
@keyframes chkPop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:none}}
.hold{position:absolute;left:0;top:0;bottom:0;width:100%;background:color-mix(in srgb,var(--ink) 6%,transparent);transform-origin:left;transform:scaleX(0);pointer-events:none}
.hab.holding .hold{transform:scaleX(1);transition:transform .55s linear}
.hint{font-size:12.5px;color:var(--ink2);text-align:center;margin:12px 0 0;font-weight:500}
.empty{text-align:center;color:var(--ink2);padding:30px 10px;font-size:14px}

/* semana (cuadrícula) */
.card{background:var(--card);border-radius:26px;padding:18px;margin-top:14px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.ch h2{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
.ey{font-size:12px;color:var(--ink2);font-weight:500}
.pill{height:32px;padding:0 13px;border-radius:99px;background:var(--card2);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill svg{width:14px;height:14px}
.wgrid{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:6px 5px;align-items:center}
.wgrid .hd{font-size:11.5px;font-weight:600;color:var(--ink2);text-align:center}
.wgrid .hd.today{color:var(--ink)}
.wgrid .nm{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;min-width:0}
.wgrid .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wgrid .nm i{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;color:#16171A}
.wgrid .nm i svg{width:16px;height:16px}
.cell{width:100%;aspect-ratio:1;border-radius:12px;background:var(--card2);position:relative;overflow:hidden;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink);transition:transform .5s var(--spring)}
.cell:active{transform:scale(.88);transition-duration:.1s}
.cell .lv{position:absolute;inset:auto 0 0 0;background:var(--c);transition:height .7s var(--spring)}
.cell em{position:relative;font-style:normal}
.cell.fut{opacity:.35;pointer-events:none}
.wnav{display:flex;align-items:center;gap:8px}

/* progreso */
.rings{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11.5px;font-weight:600;color:var(--ink2)}
.rings svg{width:100%;max-width:40px;display:block;margin:0 auto 4px;transform:rotate(-90deg)}
.str{display:flex;flex-direction:column;gap:12px}
.str .r{display:grid;grid-template-columns:28px minmax(0,1fr) 44px;gap:10px;align-items:center}
.str .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#16171A}
.str .ic svg{width:15px;height:15px}
.str .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.str .bar2{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:5px}
.str .bar2 i{display:block;height:100%;border-radius:99px;width:0;transition:width 1.2s var(--spring-soft)}
.str .v{font-size:15px;font-weight:700;text-align:right}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.kpis>div{background:var(--card);border-radius:22px;padding:14px}
.kpis b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.lbl{font-size:12.5px;color:var(--ink2);font-weight:500}
.chart{display:block;width:100%;height:auto}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 12px;padding:0 18px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:34px;padding:0 12px;border-radius:99px;background:var(--card2);font-size:13px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;transition:background-color .25s,color .25s}
.chips button i{width:8px;height:8px;border-radius:50%}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;animation:pop .45s var(--spring) both;animation-delay:calc(var(--k) * 4ms)}
@keyframes pop{from{opacity:0;transform:scale(.2)}}

/* gestión: misma lista agrupada */
.mh{position:relative;display:flex;align-items:center;gap:13px;width:100%;min-height:58px;padding:9px 14px;text-align:left;transition:background-color .35s}
.mh:active{background:var(--card2);transition-duration:.05s}
.mh+.mh::before{content:"";position:absolute;top:0;left:59px;right:0;height:.5px;background:var(--line2)}
.mh .ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#16171A;flex:none}
.mh .ico svg{width:18px;height:18px}
.mh .t{flex:1;min-width:0}
.mh b{display:block;font-size:17px;font-weight:500}
.mh small{display:block;font-size:13px;color:var(--ink2);font-weight:500}
.mh .chev{width:8px;height:13px;color:var(--ink3)}
.coach{font-size:14.5px;line-height:1.5}
.coach ul{margin:6px 0 0;padding-left:18px}
.coach li{margin:5px 0}
.coach .wait{color:var(--ink2);animation:blink 1s ease-in-out infinite alternate}
@keyframes blink{from{opacity:.35}}

/* navegación (igual que las otras apps) */
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glassBorder);box-shadow:inset 0 1px 0 var(--glassBorder),0 12px 30px var(--glassShadow)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,calc(env(safe-area-inset-bottom,0px) - 8px));z-index:8;display:flex;align-items:center;padding:5px;border-radius:99px;width:min(404px,calc(100% - 24px))}
.nav button{flex:1;min-width:0;height:54px;border-radius:99px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:color-mix(in srgb,var(--ink) 72%,transparent);font-size:10px;font-weight:600;transition:color .2s,background-color .25s,transform .5s var(--spring)}
.nav button:active{transform:scale(.9);transition-duration:.1s}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--ink);background:color-mix(in srgb,var(--ink) 9%,transparent)}
.nav .add{flex:none;width:54px;border-radius:50%;background:var(--ink);color:var(--bg);margin:0 4px}

/* hoja inferior */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:9;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-width:440px;margin:0 auto;background:var(--card);border-radius:30px 30px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:calc(100dvh - env(safe-area-inset-top,0px) - 16px);overflow:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform var(--dur) var(--spring-soft)}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 12px;position:relative}
.grab::before{content:"";position:absolute;inset:-14px -60px}
.sheet h3{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:6px 0 14px}
.field{margin-top:16px}
.field>.lbl{display:block;margin-bottom:8px}
.field input[type=text]{width:100%;height:50px;border:0;border-radius:16px;background:var(--card2);padding:0 14px;outline:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card2);border-radius:99px;padding:4px}
.seg.s4{grid-template-columns:repeat(4,1fr)}
.seg button{height:38px;border-radius:99px;font-size:13.5px;font-weight:600;color:var(--ink2);transition:background-color .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:20px;padding:8px}
.stepper button{width:44px;height:44px;border-radius:14px;background:var(--card);font-size:22px;font-weight:600}
.stepper b{font-size:26px;font-weight:700;letter-spacing:-.02em}
.stepper b small{font-size:14px;color:var(--ink2);font-weight:500;margin-left:6px}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.icons button{aspect-ratio:1;border-radius:12px;background:var(--card2);display:grid;place-items:center;transition:transform .5s var(--spring)}
.icons button svg{width:20px;height:20px}
.icons button[aria-pressed="true"]{background:var(--ink);color:var(--bg);transform:scale(1.06)}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:32px;height:32px;border-radius:50%;transition:transform .5s var(--spring)}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ink);transform:scale(1.08)}
.btns{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;height:52px;border-radius:99px;border:1.5px solid var(--line2);font-weight:600;font-size:15.5px;display:grid;place-items:center;text-decoration:none;color:inherit}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.red{color:var(--down)}
.mlist{display:flex;flex-direction:column;background:var(--card2);border-radius:22px;overflow:hidden;margin-top:12px}
.mlist button,.mlist a{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;text-align:left;text-decoration:none;color:inherit;font-size:16px;font-weight:500}
.mlist>*+*{border-top:1px solid var(--line)}
.mlist svg{width:21px;height:21px;color:var(--ink2);flex:none}
.mlist .chev{margin-left:auto;width:9px;height:14px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px) scale(.96);background:var(--ink);color:var(--bg);padding:6px 6px 6px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s,transform .5s var(--spring);z-index:20;pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:12px;min-height:44px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{height:32px;padding:0 14px;border-radius:99px;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:700;font-size:13px}
.toast:not(.act){padding-right:18px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100vw;height:100vh}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.ntest{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;height:46px;border-radius:14px;background:var(--card);font-weight:700;font-size:14px}.ntest svg{width:18px;height:18px}
.todayc{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:24px;padding:14px 16px;margin-top:14px}
.tcr{position:relative;width:68px;height:68px;flex:none}.tcr svg{width:68px;height:68px}
.tcr>b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1px;font-size:18px;font-weight:700}.tcr small{font-size:11px;margin-top:4px}
.tci{flex:1;min-width:0}.tci>b{display:block;font-size:16px}.tci small{display:block;font-size:13px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tci small b{color:var(--ink)}
.tcb{display:flex;gap:4px;margin-top:9px}.tcb i{flex:1;height:7px;border-radius:9px}
.dial.sm{max-width:300px;margin:0 auto}
</style>
</head>
<body>
<main class="app" id="app"></main>
<nav class="nav glass" id="nav" aria-label="Secciones">

<script>
/* ======================= Movimiento: resortes reales en CSS ======================= */
/* Simula un resorte amortiguado y lo convierte en una curva linear() (misma idea que spring-easing / Kinetics). */
function springCurve(stiffness,damping,mass=1){
  let x=0,v=0;const dt=1/240,pts=[0];let t=0,still=0;
  while(t<3){const a=(-stiffness*(x-1)-damping*v)/mass;v+=a*dt;x+=v*dt;t+=dt;
    if(Math.round(t*240)%4===0)pts.push(+x.toFixed(4));
    if(Math.abs(x-1)<.001&&Math.abs(v)<.01){if(++still>20)break}else still=0}
  pts.push(1);return {css:`linear(${pts.join(",")})`,ms:Math.round(t*1000)};
}
(()=>{try{if(!CSS.supports("transition-timing-function","linear(0,1)"))return;
  const b=springCurve(260,17),s=springCurve(170,26),r=document.documentElement.style;
  r.setProperty("--spring",b.css);r.setProperty("--spring-soft",s.css);r.setProperty("--dur",s.ms+"ms")}catch(e){}})();
const reduced=matchMedia("(prefers-reduced-motion:reduce)").matches;

/* Partículas suaves al completar (sin librerías, funciona sin internet) */
const fx=document.getElementById("fx"),fctx=fx.getContext("2d");let parts=[],fxRaf=null;
function sizeFx(){const d=devicePixelRatio||1;fx.width=innerWidth*d;fx.height=innerHeight*d;fctx.setTransform(d,0,0,d,0,0)}sizeFx();addEventListener("resize",sizeFx);
function burst(x,y,color,n=22){if(reduced)return;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=2+Math.random()*4.5;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2.5,r:2+Math.random()*3.5,life:1,c:Math.random()<.35?getComputedStyle(document.documentElement).getPropertyValue("--ink").trim():color,sq:Math.random()<.5,rot:Math.random()*6})}
  if(!fxRaf)fxRaf=requestAnimationFrame(tick)}
function tick(){fctx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.vy+=.18;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.life-=.018;p.rot+=.12;fctx.globalAlpha=Math.max(0,p.life);fctx.fillStyle=p.c;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.rot);
    if(p.sq)fctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);else{fctx.beginPath();fctx.arc(0,0,p.r,0,7);fctx.fill()}fctx.restore()}
  fctx.globalAlpha=1;fxRaf=parts.length?requestAnimationFrame(tick):null}
/* Números que cuentan hacia su valor */
function countUp(el,to,ms=700){if(reduced){el.textContent=to;return}const from=+el.dataset.v||0,t0=performance.now();el.dataset.v=to;
  (function f(n){const k=Math.min(1,(n-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=Math.round(from+(to-from)*e);if(k<1)requestAnimationFrame(f)})(t0)}

/* ======================= Datos ======================= */
const IC={
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',

 phone:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M4 4l16 16"/>',

 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
 leaf:'<path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15M5 19l7-7"/>',

};
const COLORS=["#C6EE3A","#57E39A","#6CB8FF","#A78BFA","#FF8A65","#FFC24B","#FF7EB6","#9FA4AE"];
const SLOTS={any:"Cualquier hora",morning:"Mañana",afternoon:"Tarde",night:"Noche"};
/* Tus rutinas (days: días de la semana en que toca, 0=domingo; time: hora del recordatorio) */
const MY_HABITS=[
 {id:"r1",n:"Creatina",ic:"pill",c:"#FF8A65",kind:"day",target:1,slot:"morning",time:"07:00"},
 {id:"r2",n:"Lavar dientes",ic:"tooth",c:"#57E39A",kind:"day",target:3,slot:"any"},
 {id:"r3",n:"Minoxidil",ic:"leaf",c:"#A78BFA",kind:"day",target:1,slot:"night",time:"23:00"},
 {id:"r4",n:"Sacar la basura",ic:"trash",c:"#9FA4AE",kind:"day",target:1,slot:"night",time:"22:00",days:[2,4,0]},
 {id:"r5",n:"Duolingo",ic:"lang",c:"#58CC02",kind:"day",target:1,slot:"any"},
 {id:"r6",n:"Curso PLC",ic:"code",c:"#6CB8FF",kind:"week",target:4,slot:"any"},
 {id:"r7",n:"Crema",ic:"cream",c:"#FF7EB6",kind:"day",target:1,slot:"night",time:"23:00"}
];
const DIAS1=["D","L","M","M","J","V","S"];
/* ¿Le toca hoy? (los hábitos con días específicos solo cuentan esos días) */
const due=(h,d)=>!h.days||!h.days.length||h.days.includes(parse(d).getDay());
const hhmm=t=>{if(!t)return "";const [H,M]=t.split(":").map(Number);return `${H%12||12}:${String(M).padStart(2,"0")} ${H<12?"a. m.":"p. m."}`};
function migrateH(){if((S.hv||0)>=2)return;S.habits=JSON.parse(JSON.stringify(MY_HABITS));S.log={};S.sample=false;S.nid=8;S.hv=2}
const KEY="ritmo1";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today=()=>iso(new Date());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const monday=s=>addDays(s,-((parse(s).getDay()+6)%7));
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const DEFAULT_HABITS=[
 {id:"h1",n:"Lavar dientes",ic:"tooth",c:"#57E39A",kind:"day",target:3,slot:"any"},
 {id:"h2",n:"Tomar agua",ic:"water",c:"#6CB8FF",kind:"day",target:8,slot:"any"},
 {id:"h3",n:"Vitaminas",ic:"pill",c:"#FF8A65",kind:"day",target:1,slot:"morning"},
 {id:"h4",n:"Ejercicio",ic:"gym",c:"#C6EE3A",kind:"week",target:4,slot:"morning"},
 {id:"h5",n:"Leer 20 min",ic:"book",c:"#FFC24B",kind:"week",target:5,slot:"night"},
 {id:"h6",n:"Meditar",ic:"lotus",c:"#A78BFA",kind:"week",target:3,slot:"morning"},
 {id:"h7",n:"Dormir antes de las 12",ic:"moon",c:"#FF7EB6",kind:"day",target:1,slot:"night"}
];
/* Historial de ejemplo (8 semanas), reproducible */
function sample(){
  let seed=7;const R=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const log={},t=today(),nm=nowMin();
  for(let k=112;k>=0;k--){const d=addDays(t,-k),dow=(parse(d).getDay()+6)%7,L=log[d]={};const add=(id,m)=>{if(k===0&&m>nm)return;(L[id]=L[id]||[]).push(Math.max(0,Math.min(1439,Math.round(m))))};
    [460,870,1350].forEach(m=>R()<.86&&add("h1",m+R()*30-15));
    const w=4+Math.floor(R()*5);for(let i=0;i<w;i++)add("h2",500+i*(720/w)+R()*40);
    R()<.8&&add("h3",545+R()*40);
    [0,1,3,5].includes(dow)&&R()<.72&&add("h4",R()<.6?425+R()*30:1140+R()*40);
    R()<.62&&add("h5",1310+R()*40);
    [0,2,4].includes(dow)&&R()<.55&&add("h6",440+R()*20);
    R()<.6&&add("h7",1395+R()*35);
  }
  return {habits:JSON.parse(JSON.stringify(DEFAULT_HABITS)),log,sample:true,nid:8};
}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.habits))S=sample();
migrateH();
const save=()=>{if(window.SYNC)SYNC.touch();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ======================= Lógica de hábitos ======================= */
const $=s=>document.querySelector(s);
const svg=(p,w=1.9)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const DOW=["L","M","M","J","V","S","D"],DOWL=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"],MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const H=id=>S.habits.find(h=>h.id===id);
const cnt=(h,d)=>((S.log[d]||{})[h.id]||[]).length;
const weekDays=(h,d)=>{const m=monday(d);let n=0;for(let i=0;i<7;i++){const x=addDays(m,i);if(x>d)break;if(cnt(h,x))n++}return n};
const rule=h=>h.kind==="day"?(h.target===1?"1 vez al día":`${h.target} veces al día`):`${h.target} días por semana`;
function status(h,d=today()){
  if(h.kind==="day"){const c=cnt(h,d);if(!due(h,d))return {p:c?1:0,done:true,off:!c,c,txt:`Toca ${h.days.slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(x=>DIAS1[x]).join(" ")}`};
    return {p:Math.min(1,c/h.target),done:c>=h.target,c,txt:h.target===1?(c?"Hecho hoy":h.time?`A las ${hhmm(h.time)}`:SLOTS[h.slot]):`${c} de ${h.target} hoy`}}
  const wd=weekDays(h,d),todayDone=cnt(h,d)>0;
  return {p:Math.min(1,wd/h.target),done:todayDone||wd>=h.target,c:wd,todayDone,met:wd>=h.target,txt:wd>=h.target?`Meta semanal lista · ${wd} de ${h.target}`:`${wd} de ${h.target} esta semana`};
}
/* Progreso del día: los semanales cuentan solo si aún falta cumplir la meta de la semana o ya se hicieron hoy */
function dayScore(d){let s=0,n=0;for(const h of S.habits){if(h.kind==="day"&&!due(h,d))continue;if(h.kind==="day"){s+=Math.min(1,cnt(h,d)/h.target);n++}else{const wdBefore=weekDays(h,addDays(d,-1))*(monday(d)===monday(addDays(d,-1))?1:0),done=cnt(h,d)>0;if(done){s++;n++}else if(wdBefore<h.target){n++}}}return n?s/n:0}
/* Fuerza del hábito (fórmula de Loop Habit Tracker): sube con constancia y baja lento si fallas un día */
function strength(h,days=120){const freq=h.kind==="day"?1:h.target/7,m=Math.pow(.5,Math.sqrt(freq)/13);let sc=0;const t=today();
  for(let k=days;k>=0;k--){const d=addDays(t,-k);if(h.kind==="day"&&!due(h,d))continue;let v;if(h.kind==="day")v=Math.min(1,cnt(h,d)/h.target);else{let n=0;for(let j=0;j<7;j++)if(cnt(h,addDays(d,-j)))n++;v=Math.min(1,n/h.target)}sc=sc*m+v*(1-m)}return sc}
function streak(h){const t=today();if(h.kind==="day"){let k=status(h).done?0:1,n=0;while(k<400){const d=addDays(t,-k);if(!due(h,d)){k++;continue}if(cnt(h,d)<h.target)break;n++;k++}return {n,u:n===1?"día":"días"}}
  let w=monday(t),n=0;if(weekDays(h,t)>=h.target)n++;w=addDays(w,-1);while(weekDays(h,w)>=h.target){n++;w=addDays(monday(w),-1)}return {n,u:n===1?"semana":"semanas"}}
function best(h){let b=0,run=0;const t=today();if(h.kind==="day"){for(let k=120;k>=0;k--){if(cnt(h,addDays(t,-k))>=h.target){run++;b=Math.max(b,run)}else run=0}return b}
  for(let k=17;k>=0;k--){const d=addDays(monday(t),-7*k+6);if(weekDays(h,d>t?t:d)>=h.target){run++;b=Math.max(b,run)}else run=0}return b}

/* ======================= Pantallas ======================= */
let screen="today",wOff=0,statH=null;
function header(title,sub){const h=new Date().getHours();
  return `<div class="bar"><button class="brand press" data-menu><img src="icons/icon.svg" alt=""><span>Rutinas<small>${h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches"}, Diego</small></span></button><span class="sp"></span>

function ring(p,size=30,sw=4,col="var(--ink)"){const r=(size-sw)/2,C=2*Math.PI*r;return `<svg viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg>`}

/* --- Reloj de 24 h: cada marca queda a la hora en que la hiciste --- */
function dialSVG(){
  const t=today(),S2=300,c=150,R=128,nm=nowMin(),ang=m=>m/1440*Math.PI*2-Math.PI/2,P=(m,r)=>[c+r*Math.cos(ang(m)),c+r*Math.sin(ang(m))];
  // anillo exterior = las 24 h del día (gris claro = lo que ya pasó); anillo interior = avance de tus hábitos
  const Ce=2*Math.PI*R,Ri=R-44,Ci=2*Math.PI*Ri,dp=dayScore(t);
  let g=`<circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="var(--card)" stroke-width="16"/>`;
  g+=`<circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="var(--line)" stroke-width="16" stroke-dasharray="${Ce*nm/1440} ${Ce}" transform="rotate(-90 ${c} ${c})"/>`;
  for(let hh=0;hh<24;hh++){const [x1,y1]=P(hh*60,R-15),[x2,y2]=P(hh*60,R-(hh%6?19:23));g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${hh%6?"var(--line2)":"var(--ink2)"}" stroke-width="${hh%6?1.4:2}" stroke-linecap="round"/>`}
  [[0,"0"],[360,"6"],[720,"12"],[1080,"18"]].forEach(([m,l])=>{const [x,y]=P(m,R-31);g+=`<text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink2)" font-family="Urbanist,sans-serif">${l}</text>`});
  g+=`<circle cx="${c}" cy="${c}" r="${Ri}" fill="none" stroke="var(--line)" stroke-width="10"/><circle class="prog" cx="${c}" cy="${c}" r="${Ri}" fill="none" stroke="var(--ink)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${Ci}" stroke-dashoffset="${Ci}" data-off="${Ci*(1-dp)}" transform="rotate(-90 ${c} ${c})"/>`;
  // marcas del día, apiladas hacia fuera si coinciden
  const marks=[];for(const h of S.habits)for(const m of ((S.log[t]||{})[h.id]||[]))marks.push({m,h});marks.sort((a,b)=>a.m-b.m);
  const placed=[];let dots="";marks.forEach((k,i)=>{let lane=0;while(placed.some(p=>p.lane===lane&&Math.abs(p.m-k.m)<22))lane++;placed.push({m:k.m,lane});const [x,y]=P(k.m,R+(lane?18+lane*9:0));
    dots+=`<circle class="dot" style="animation-delay:${200+i*35}ms" cx="${x}" cy="${y}" r="${lane?4:6.5}" fill="${k.h.c}" stroke="var(--card)" stroke-width="2"/>`});
  const [hx,hy]=P(nm,R+14),[ix,iy]=P(nm,R-14);
  return `<svg viewBox="-12 -12 ${S2+24} ${S2+24}" aria-label="Reloj del día">${g}${dots}<line x1="${ix}" y1="${iy}" x2="${hx}" y2="${hy}" stroke="var(--down)" stroke-width="3" stroke-linecap="round"/><circle cx="${hx}" cy="${hy}" r="4" fill="var(--down)"/></svg>`;
}
function habCard(h,i){const st=status(h),t=today();
  const target=h.kind==="day"?h.target:h.target,val=h.kind==="day"?st.c:st.c,p=Math.min(1,val/target),C=2*Math.PI*13;
  let sub;
  if(h.kind==="week"){const m=monday(t);sub=`<span class="wk">${Array.from({length:7},(_,k)=>{const d=addDays(m,k);return `<i class="${cnt(h,d)?"on":""} ${d===t?"today":""}"></i>`}).join("")}</span>${st.txt}`}
  else sub=st.txt;
  return `<button class="hab ${st.done?"done":""}" style="--c:${h.c};--i:${i}" data-h="${h.id}" aria-label="${h.n}: ${st.txt}. Toca para marcar.">

function closeSheet(){const s=$("#sheet"),c=$("#scrim");if(s.hidden)return;document.body.classList.remove("lock");s.style.transform="";s.classList.remove("on","drag");c.classList.remove("on");setTimeout(()=>{s.hidden=c.hidden=true},350)}
$("#scrim").onclick=closeSheet;
function detail(h){const st=status(h),sk=streak(h),t=today();let cells="";const start=addDays(monday(t),-7*7);
  for(let k=0;k<8*7;k++){const d=addDays(start,k),c=cnt(h,d),p=d>t?-1:h.kind==="day"?Math.min(1,c/h.target):(c?1:0);cells+=`<i style="--k:${k};background:${p<0?"transparent":p===0?"var(--card2)":`color-mix(in srgb,${h.c} ${Math.round(30+p*70)}%,var(--card2))`}"></i>`}
  const times=(S.log[t]||{})[h.id]||[];
  openSheet(`<div style="display:flex;align-items:center;gap:14px;margin:6px 0 4px"><span class="ico" style="width:56px;height:56px;border-radius:18px;background:${h.c};color:#16171A;display:grid;place-items:center">${svg(IC[h.ic],2)}</span><div><h3 style="margin:0">${h.n}</h3><span class="lbl">${rule(h)} · ${st.txt}</span></div></div>
  <div class="kpis" style="margin-top:16px"><div style="background:var(--card2)"><span class="lbl">Racha</span><b>${sk.n}</b><span class="lbl">${sk.u}</span></div><div style="background:var(--card2)"><span class="lbl">Mejor</span><b>${best(h)}</b><span class="lbl">${h.kind==="day"?"días":"semanas"}</span></div><div style="background:var(--card2)"><span class="lbl">Fuerza</span><b>${Math.round(strength(h)*100)}%</b><span class="lbl">constancia</span></div></div>
  <div class="field"><span class="lbl">Últimas 8 semanas</span><div class="heat">${cells}</div></div>
  ${times.length?`<div class="field"><span class="lbl">Hoy a las</span><div style="display:flex;gap:6px;flex-wrap:wrap">${times.map(m=>`<span class="pill">${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}</span>`).join("")}</div></div>`:""}
  <div class="btns">${times.length?`<button class="btn" data-undo="${h.id}">Quitar la última</button>`:""}<button class="btn dark" data-edit="${h.id}">Editar</button></div>`)}
let draft;
function editor(h){draft=h?{...h}:{id:null,n:"",ic:"leaf",c:COLORS[S.habits.length%COLORS.length],kind:"day",target:1,slot:"any"};
  openSheet(`<h3>${draft.id?"Editar hábito":"Nuevo hábito"}</h3>
  <div class="field"><input type="text" id="hn" placeholder="Ej. Lavar dientes, caminar, leer…" value="${(draft.n||"").replace(/"/g,"&quot;")}" maxlength="32" autocomplete="off"></div>
  <div class="field"><span class="lbl">¿Con qué frecuencia?</span><div class="seg" id="kind"><button data-k="day" aria-pressed="${draft.kind==="day"}">Varias veces al día</button><button data-k="week" aria-pressed="${draft.kind==="week"}">Días por semana</button></div></div>
  <div class="field"><div class="stepper"><button data-st="-1" aria-label="Menos">−</button><b id="tg">${draft.target}<small>${draft.kind==="day"?"al día":"por semana"}</small></b><button data-st="1" aria-label="Más">+</button></div></div>
  <div class="field"><span class="lbl">Recordatorio (opcional)</span><input type="time" id="htime" value="${draft.time||""}" style="width:100%;height:46px;border:0;border-radius:14px;background:var(--card2);padding:0 14px;font:inherit;font-size:16px;color:var(--ink)"></div>
  <div class="field" id="hdaysF" ${draft.kind==="day"?"":"hidden"}><span class="lbl">¿Qué días? (ninguno = todos)</span><div class="seg" style="grid-template-columns:repeat(7,1fr)">${[1,2,3,4,5,6,0].map(d=>`<button data-hd="${d}" aria-pressed="${!!(draft.days||[]).includes(d)}">${DIAS1[d]}</button>`).join("")}</div></div>
  <div class="field"><span class="lbl">Momento</span><div class="seg s4">${Object.entries(SLOTS).map(([k,v])=>`<button data-sl="${k}" aria-pressed="${draft.slot===k}">${k==="any"?"Libre":v}</button>`).join("")}</div></div>
  <div class="field"><span class="lbl">Ícono</span><div class="icons">${Object.keys(IC).map(k=>`<button data-ic="${k}" aria-pressed="${draft.ic===k}" aria-label="${k}">${svg(IC[k])}</button>`).join("")}</div></div>
  <div class="field"><span class="lbl">Color</span><div class="colors">${COLORS.map(c=>`<button data-col="${c}" aria-pressed="${draft.c===c}" style="background:${c}" aria-label="Color"></button>`).join("")}</div></div>
  <div class="btns">${draft.id?`<button class="btn red" data-del>Eliminar</button>`:`<button class="btn" data-close>Cancelar</button>`}<button class="btn dark" data-savehab>Guardar</button></div>`);
  if(!draft.id)setTimeout(()=>$("#hn")&&$("#hn").focus(),400)}
const isDark=()=>document.documentElement.dataset.theme==="dark";
function syncThemeColor(){document.querySelector('meta[name="theme-color"]').content=getComputedStyle(document.documentElement).getPropertyValue("--bg").trim()}
function toggleTheme(){const t=isDark()?"light":"dark";const f=()=>{document.documentElement.dataset.theme=t;syncThemeColor()};document.startViewTransition&&!reduced?document.startViewTransition(f):f();try{localStorage.setItem("diapps-theme",t)}catch(e){}}
addEventListener("storage",e=>{if(e.key==="diapps-theme"&&e.newValue){document.documentElement.dataset.theme=e.newValue;syncThemeColor()}});
function menu(){const chev='<svg class="chev" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 2l6 6-6 6"/></svg>',it=(a,ic,n)=>`<button ${a}>${svg(ic)}<span>${n}</span>${chev}</button>`;
  openSheet(`<h3>Menú</h3><div class="mlist">${it('data-go="today"','<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',"Hoy")}${it('data-go="week"','<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16"/>',"Semana")}${it('data-go="stats"','<path d="M4 19h16M7 16v-4M12 16V7M17 16v-6"/>',"Progreso")}${it('data-go="habits"','<rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/>',"Hábitos")}</div>
  <div class="mlist">${it("data-account",'<circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/>',window.Nube&&Nube.user()?"Cuenta · "+Nube.user().email:"Iniciar sesión y respaldar")}${it("data-theme-toggle",isDark()?IC.sun:IC.moon,isDark()?"Tema claro":"Tema oscuro")}${S.sample?it("data-wipe",'<path d="M4 7h16M6 7l1 13h10l1-13M9 7V4h6v3"/>',"Borrar historial de ejemplo"):it("data-reset",'<path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/>',"Cargar historial de ejemplo")}
  <a href="../">${svg('<path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/>')}<span>Todos mis proyectos</span>${chev}</a></div>
  <p class="lbl" style="margin-top:14px">${S.sample?"Estás viendo un historial de ejemplo. ":""}Todo se guarda solo en este iPhone.</p>`)}
let tt;function toast(msg,act,fn){const e=$("#toast");e.innerHTML=`<span>${msg}</span>${act?`<button>${act}</button>`:""}`;e.classList.toggle("act",!!act);if(act)e.querySelector("button").onclick=()=>{fn();e.classList.remove("on")};e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),act?4000:1800)}

/* --- Eventos --- */
document.addEventListener("click",e=>{
  const g=s=>e.target.closest(s);let t;
  if(t=g("[data-go]")){closeSheet();go(t.dataset.go);return}
  if(g("[data-new]")){editor();return}
  if(g("[data-menu]")){menu();return}
  if(t=g("[data-edit]")){editor(H(t.dataset.edit));return}
  if(t=g("[data-undo]")){const a=S.log[today()][t.dataset.undo];a.pop();if(!a.length)delete S.log[today()][t.dataset.undo];save();closeSheet();render();toast("Última marca quitada");return}
  if(t=g("[data-w]")){wOff=Math.min(0,wOff+ +t.dataset.w);render(true);return}
  if(t=g("[data-cell]")){const [id,d]=t.dataset.cell.split("|"),h=H(id),c=cnt(h,d),L=S.log[d]=S.log[d]||{};
    if(h.kind==="day"&&c<h.target){(L[id]=L[id]||[]).push(d===today()?nowMin():720)}else if(h.kind==="week"&&!c){L[id]=[d===today()?nowMin():720]}else delete L[id];
    save();const p=h.kind==="day"?Math.min(1,cnt(h,d)/h.target):(cnt(h,d)?1:0);t.querySelector(".lv").style.height=p*100+"%";t.querySelector("em").textContent=h.kind==="day"&&h.target>1&&cnt(h,d)?cnt(h,d):p>=1?"✓":"";
    if(p>=1){const r=t.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,h.c,10)}clearTimeout(render.t);render.t=setTimeout(()=>render(),900);return}
  if(t=g("[data-sh]")){statH=t.dataset.sh;render();return}
  if(g("[data-coach]")){coach();return}
  if(t=g("[data-k]")){draft.kind=t.dataset.k;const hf=$("#hdaysF");if(hf)hf.hidden=draft.kind!=="day";draft.target=Math.min(draft.target,draft.kind==="week"?7:12);t.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t));$("#tg").innerHTML=`${draft.target}<small>${draft.kind==="day"?"al día":"por semana"}</small>`;return}
  if(t=g("[data-st]")){draft.target=Math.max(1,Math.min(draft.kind==="week"?7:12,draft.target+ +t.dataset.st));$("#tg").innerHTML=`${draft.target}<small>${draft.kind==="day"?"al día":"por semana"}</small>`;$("#tg").animate([{transform:"scale(1.18)"},{transform:"none"}],{duration:450,easing:getComputedStyle(document.documentElement).getPropertyValue("--spring")||"ease-out"});return}
  if(t=g("[data-hd]")){const d=+t.dataset.hd,a=draft.days=(draft.days||[]).slice(),i=a.indexOf(d);if(i>=0)a.splice(i,1);else a.push(d);t.setAttribute("aria-pressed",i<0);return}
  if(g("[data-notif]")){testNotif();return}
  if(t=g("[data-sl]")){draft.slot=t.dataset.sl;t.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t));return}
  if(t=g("[data-ic]")){draft.ic=t.dataset.ic;t.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t));return}
  if(t=g("[data-col]")){draft.c=t.dataset.col;t.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t));return}
  if(g("[data-savehab]")){const n=$("#hn").value.trim(),isNew=!draft.id;if(!n){$("#hn").focus();toast("Ponle un nombre");return}draft.n=n;
    const tm=$("#htime")&&$("#htime").value;if(tm)draft.time=tm;else delete draft.time;if(draft.kind!=="day"||!(draft.days||[]).length)delete draft.days;
    if(draft.id){S.habits[S.habits.findIndex(x=>x.id===draft.id)]=draft}else{draft.id="h"+(S.nid++);S.habits.push(draft)}save();closeSheet();render(true);toast(isNew?"Hábito creado":"Hábito guardado");return}
  if(g("[data-del]")){S.habits=S.habits.filter(x=>x.id!==draft.id);for(const d in S.log)delete S.log[d][draft.id];save();closeSheet();render(true);toast("Hábito eliminado");return}
  if(g("[data-close]")){closeSheet();return}
  if(g("[data-account]")){closeSheet();setTimeout(()=>Nube.accountSheet({open:openSheet,close:closeSheet,toast:m=>toast(m),sync:window.SYNC}),480);return}
  if(g("[data-theme-toggle]")){closeSheet();setTimeout(toggleTheme,200);return}
  if(g("[data-wipe]")){S={habits:S.habits,log:{},sample:false,nid:S.nid};save();closeSheet();render(true);toast("Historial borrado: empieza hoy");return}
  if(g("[data-reset]")){S=sample();save();closeSheet();render(true);toast("Historial de ejemplo cargado");return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();if((e.key==="Enter"||e.key===" ")&&e.target.matches(".hab")){e.preventDefault();tapHabit(e.target)}});
["gesturestart","gesturechange"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
// Deslizar entre secciones y arrastrar hojas para cerrar
(()=>{let x0=null,y0,lock;document.addEventListener("touchstart",e=>{if(!$("#sheet").hidden||e.target.closest(".chips,input,.wgrid")){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY;lock=null},{passive:true});
  document.addEventListener("touchmove",e=>{if(x0==null||lock)return;const dx=e.touches[0].clientX-x0,dy=e.touches[0].clientY-y0;if(Math.abs(dx)>10||Math.abs(dy)>10)lock=Math.abs(dx)>Math.abs(dy)*1.3?"x":"y"},{passive:true});
  document.addEventListener("touchend",e=>{if(x0==null||lock!=="x")return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>70){const i=ORDER.indexOf(screen)+(dx<0?1:-1);if(i>=0&&i<ORDER.length)go(ORDER[i])}x0=null},{passive:true});
  const sh=$("#sheet");let sy=null,dy=0;
  sh.addEventListener("touchstart",e=>{if(sh.scrollTop>0||e.target.closest("input"))return;sy=e.touches[0].clientY;dy=0},{passive:true});
  sh.addEventListener("touchmove",e=>{if(sy==null)return;dy=e.touches[0].clientY-sy;if(dy>0){sh.classList.add("drag");sh.style.transform=`translateY(${dy}px)`;if(e.cancelable)e.preventDefault()}},{passive:false});
  sh.addEventListener("touchend",()=>{if(sy==null)return;sy=null;sh.classList.remove("drag");if(dy>90)closeSheet();else sh.style.transform=""});
})();
// Al volver a la app o cambiar de minuto/día se actualiza el reloj
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&screen==="today")render()});
setInterval(()=>{if(screen==="today"&&$("#sheet").hidden&&!document.querySelector(".hab.holding"))render()},60000);

save();syncThemeColor();render();
if(window.Desk)Desk.watch(()=>render());
window.SYNC=window.Nube?Nube.sync("rutinas",{get:()=>S,set:d=>{S=d;migrateH();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render();toast("Datos actualizados desde tu cuenta")}}):null;
if("serviceWorker" in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
