<style>
/* Mi Ciudad: un mapa isométrico (estilo ilustración de plano urbano) donde cada barrio es una app de Diapps.
   Todo se dibuja con SVG desde código: los edificios salen de tus datos (apartados, hábitos, Jetta, canciones, cajas). */
:root{
  --bg:#EFE9DC;--gnd:#F4EFE4;--lot:#E8E2D2;--edge:#D3CBB7;--hatch:#D9D1BD;--road:#2B2B2D;--mark:#F4EFE4;
  --top:#FFFFFF;--left:#F3EFE7;--right:#D9D4C8;--ink:#2A2A2C;--dtop:#5B5B5E;--dleft:#3A3A3D;--dright:#2B2B2E;
  --red:#C8102E;--red2:#99091F;--red3:#E2405A;--win:#2E2E31;--lit:#2E2E31;--tree:#FFFFFF;--kr:#E9DCBC;--kr2:#D6C59E;--gray:#CFCAC0;
  --card:#FFFFFF;--card2:#F2F0EA;--tx:#1B1B1D;--tx2:#77756F;--glass:rgba(255,253,248,.78);
}
:root[data-night="1"]{
  --bg:#111214;--gnd:#16171A;--lot:#1E1F23;--edge:#2A2B30;--hatch:#24252A;--road:#0A0A0B;--mark:#4E4F55;
  --top:#3A3B41;--left:#2B2C31;--right:#212226;--ink:#08080A;--dtop:#2E2F33;--dleft:#1D1E21;--dright:#17181A;
  --red:#D0213C;--red2:#8E0E22;--red3:#E85A70;--win:#1A1B1E;--lit:#FFC56B;--tree:#2B3430;--kr:#5C5444;--kr2:#4A4337;--gray:#4A4A4F;
  --card:#1E1F23;--card2:#2A2B30;--tx:#F2F1EE;--tx2:#9C9BA2;--glass:rgba(30,31,35,.78);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:Urbanist,system-ui,sans-serif;transition:background-color .6s}
a{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#map.drag{cursor:grabbing}
#map polygon,#map path.st{stroke:var(--ink);stroke-width:.7;stroke-linejoin:round;transition:fill .6s}
.gnd{fill:var(--gnd)}.lot{fill:var(--lot)!important;stroke:var(--edge)!important}.fld{fill:url(#hatch)!important;stroke:none!important}
.road{fill:var(--road)!important;stroke:none!important}.gravel{fill:url(#gravel)!important;stroke:none!important}
.dash{stroke:var(--mark);stroke-width:1.3;stroke-dasharray:9 9;fill:none}.mk{stroke:var(--mark);stroke-width:1.2;fill:none}
.zb{fill:var(--mark)!important;stroke:none!important}
.t{fill:var(--top)}.l{fill:var(--left)}.r{fill:var(--right)}
.dk.t{fill:var(--dtop)}.dk.l{fill:var(--dleft)}.dk.r{fill:var(--dright)}
.rd.t{fill:var(--red3)}.rd.l{fill:var(--red)}.rd.r{fill:var(--red2)}
.gy.t,.gy.l{fill:var(--gray)}.gy.r{fill:color-mix(in srgb,var(--gray) 80%,#000)}
.kr.t{fill:var(--kr)}.kr.l{fill:var(--kr)}.kr.r{fill:var(--kr2)}
#map polygon.w{fill:var(--win);stroke:none}#map polygon.w.on{fill:var(--lit)}
#map polygon.dr{fill:var(--win);stroke:none}#map polygon.dr.red{fill:var(--red)}
#map polygon.flag{fill:var(--red);stroke:none}
.tr{fill:var(--tree);stroke:var(--ink);stroke-width:.7;transition:fill .6s}.sh{fill:#000;opacity:.10}
.trunk{stroke:var(--ink);stroke-width:1.2}
.sp{stroke:var(--red);stroke-width:1.7;fill:none;stroke-linecap:round}
#map text{text-rendering:geometricPrecision}
.bbt{font-family:"Saira Condensed",sans-serif;font-weight:800;fill:#fff;letter-spacing:.4px}
.bbt.dkt{fill:#2A2A2C}
.gl{font-family:"Saira Condensed",sans-serif;font-weight:700;fill:var(--mark);letter-spacing:1.5px}
.pl{font-family:"Saira Condensed",sans-serif;font-weight:700;fill:var(--ink);opacity:.75}
:root[data-night="1"] .pl{fill:#d8d6cf}
.rail{stroke:var(--ink);stroke-width:1.4;fill:none}.tie{stroke:var(--ink);stroke-width:1;opacity:.55}
.cloud{fill:#fff;opacity:.92;stroke:var(--ink);stroke-width:.6}.cloudsh{fill:#000;opacity:.06}
:root[data-night="1"] .cloud{fill:#3a3c44;opacity:.6}
.hl{animation:hl 1.4s ease}
@keyframes hl{0%,100%{filter:none}40%{filter:drop-shadow(0 0 10px rgba(200,16,46,.65))}}

/* interfaz encima del mapa */
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;display:flex;gap:10px;align-items:flex-start;pointer-events:none;z-index:3}
.hud>*{pointer-events:auto}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);box-shadow:0 6px 24px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.06)}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib svg{width:20px;height:20px}
.ttl{flex:1;min-width:0;border-radius:22px;padding:8px 14px 9px;display:flex;align-items:center;gap:10px}
.ttl b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.ttl small{display:block;font-size:12.5px;color:var(--tx2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{width:38px;height:38px;flex:none;position:relative}
.ring svg{width:38px;height:38px;transform:rotate(-90deg)}
.ring em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:800}
.chips{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;z-index:3}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:42px;padding:0 16px;border-radius:21px;font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--tx)}
.chip i.red{background:var(--red)}
.scrim{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:8px;right:8px;bottom:8px;z-index:9;max-width:520px;margin:0 auto;max-height:78vh;overflow:auto;background:var(--card);border-radius:30px;
  padding:10px 20px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(110%);transition:transform .38s cubic-bezier(.2,.9,.25,1);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--card2);margin:0 auto 10px}
.sheet h3{margin:4px 0 2px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.sheet .sub{color:var(--tx2);font-size:14px;font-weight:600;margin:0 0 12px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.kp div{background:var(--card2);border-radius:18px;padding:11px 13px}
.kp small{display:block;color:var(--tx2);font-size:12.5px;font-weight:600}
.kp b{font-size:21px;font-weight:800;letter-spacing:-.02em}
.kp b.red{color:var(--red)}
.rows{background:var(--card2);border-radius:18px;padding:2px 14px;margin:0 0 12px}
.rows div{display:flex;align-items:center;gap:10px;padding:10px 0;font-weight:600;font-size:15px}
.rows div+div{border-top:.5px solid color-mix(in srgb,var(--tx) 12%,transparent)}
.rows span{flex:1;min-width:0}
.rows small{display:block;color:var(--tx2);font-size:12.5px;font-weight:500}
.rows b{font-weight:700;white-space:nowrap}
.rows .dot{width:10px;height:10px;border-radius:50%;flex:none}
.how{font-size:13.5px;color:var(--tx2);line-height:1.45;margin:0 0 14px}
.btn{height:50px;border-radius:25px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;width:100%;text-decoration:none;color:inherit;background:var(--card2)}
.btn.dark{background:var(--tx);color:var(--card)}
.btns{display:flex;gap:8px;margin-top:8px}.btns .btn{flex:1}
.field{margin:8px 0}.lbl{color:var(--tx2);font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:9px;background:var(--card2);color:var(--tx2);vertical-align:middle;margin-left:6px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 70px);transform:translate(-50%,20px);opacity:0;z-index:12;background:var(--tx);color:var(--card);
  padding:12px 18px;border-radius:22px;font-weight:700;font-size:14.5px;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){.chips{justify-content:center}.sheet{left:auto;right:20px;bottom:20px;top:auto;width:420px}}
</style>
</head>
<body>
<svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="Mapa de tu ciudad">
  <defs>
    <pattern id="hatch" width="10" height="5" patternUnits="userSpaceOnUse" patternTransform="skewX(-63.4)"><rect width="10" height="5" fill="var(--lot)"/><line x1="0" y1="0" x2="0" y2="5" stroke="var(--hatch)" stroke-width="2"/></pattern>
    <pattern id="gravel" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="var(--lot)"/><circle cx="1.5" cy="1.5" r=".9" fill="var(--hatch)"/><circle cx="4.5" cy="4.5" r=".9" fill="var(--hatch)"/></pattern>
  <clipPath id="land"><polygon id="landP"/></clipPath>
  </defs>
  <g id="world"><g id="ground"></g><g id="cars" clip-path="url(#land)"></g><g id="objs"></g><g id="train" clip-path="url(#land)"></g><g id="front"></g><g id="sky" clip-path="url(#land)"></g></g>
</svg>
<div class="hud">
  <a class="ib glass" href="../" aria-label="Volver a Diapps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
  <div class="ttl glass"><span style="flex:1;min-width:0"><b>Mi Ciudad</b><small id="sub">Cargando…</small></span><span class="ring" id="ring"></span></div>
  <button class="ib glass" id="nightB" aria-label="Día o noche"></button>
  <button class="ib glass" id="acctB" aria-label="Cuenta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.5-9 6 6 0 0 1 11.6 1.6A3.8 3.8 0 0 1 17.5 18z"/></svg></button>
</div>
<div class="chips" id="chips"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ======================= Datos de tus apps (solo lectura) =======================
   Se leen del almacenamiento del navegador (mismo sitio que las demás apps) y, si tienes sesión,
   de tu cuenta de Diapps (la copia más nueva gana). Ciudad nunca modifica los datos de otras apps. */
const $=s=>document.querySelector(s);
const LSj=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dIso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dToday=()=>dIso(new Date());
const dAdd=(s,n)=>{const d=new Date(s+"T12:00");d.setDate(d.getDate()+n);return dIso(d)};
const mxn0=v=>"$"+Math.round(v).toLocaleString("es-MX");
let hideAmt=false;try{hideAmt=localStorage.getItem("diapps-fin-hide")==="1"}catch(e){}
const money=v=>hideAmt?"$•••":mxn0(v);
const {SRC,D,stamp}=Vida,model=Vida.model;
async function loadCloud(){if(await Vida.loadCloud()){build();toast("Ciudad actualizada desde tu cuenta")}}

/* ======================= Dibujo isométrico =======================
   Cuadrícula (x,y) en el piso, z hacia arriba. Caras visibles: arriba (t), frente-izquierda (+y, l) y frente-derecha (+x, r). */
const TW=64,TH=32,ZU=34;
const P=(x,y,z=0)=>[(x-y)*TW/2,(x+y)*TH/2-z*ZU];
const pts=a=>a.map(p=>{const q=P(p[0],p[1],p[2]||0);return q[0].toFixed(1)+","+q[1].toFixed(1)}).join(" ");
const poly=(a,c)=>`<polygon points="${pts(a)}" class="${c}"/>`;
let seed=7;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const LIT=()=>rnd()<.5?" on":"";
function quadL(x0,x1,Y,z0,z1,c){return poly([[x0,Y,z0],[x1,Y,z0],[x1,Y,z1],[x0,Y,z1]],c)}
function quadR(y0,y1,X,z0,z1,c){return poly([[X,y0,z0],[X,y1,z0],[X,y1,z1],[X,y0,z1]],c)}
/* Ventanas: filas por piso en las dos caras visibles. o={fl:altura de piso, band:franjas continuas, skipL} */
function windows(x,y,z,w,d,h,o){let s="";const fl=o.fl||.42,n=Math.max(1,Math.floor((h-.12)/fl));
  for(let i=0;i<n;i++){const z0=z+.1+i*fl,z1=z0+fl*.5;
    if(o.band){if(!o.skipL)s+=quadL(x+.12,x+w-.12,y+d,z0,z1,"w"+LIT());s+=quadR(y+.12,y+d-.12,x+w,z0,z1,"w"+LIT());continue}
    if(!o.skipL){const cl=Math.max(1,Math.floor((w-.1)/.42));for(let j=0;j<cl;j++){const u=x+(w-cl*.42)/2+j*.42+.1;s+=quadL(u,u+.22,y+d,z0,z1,"w"+LIT())}}
    const cr=Math.max(1,Math.floor((d-.1)/.42));for(let j=0;j<cr;j++){const v=y+(d-cr*.42)/2+j*.42+.1;s+=quadR(v,v+.22,x+w,z0,z1,"w"+LIT())}}
  return s}
function box(x,y,z,w,d,h,o={}){const t=z+h,c=o.c?" "+o.c:"";
  let s=poly([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,t],[x+w,y,t]],"r"+c)+poly([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,t],[x,y+d,t]],"l"+c)+poly([[x,y,t],[x+w,y,t],[x+w,y+d,t],[x,y+d,t]],"t"+(o.top?" "+o.top:c));
  if(o.win)s+=windows(x,y,z,w,d,h,o.win);return s}
/* Casa con techo de dos aguas (cumbrera a lo largo de x) */
function house(x,y,w,d,h,r,o={}){const c=o.c?" "+o.c:"";
  return box(x,y,0,w,d,h,o)+poly([[x,y,h],[x+w,y,h],[x+w,y+d/2,h+r],[x,y+d/2,h+r]],"t")+poly([[x+w,y,h],[x+w,y+d,h],[x+w,y+d/2,h+r]],"r"+c)+poly([[x,y+d,h],[x+w,y+d,h],[x+w,y+d/2,h+r],[x,y+d/2,h+r]],"t"+(o.roof?" "+o.roof:""))}
function tree(x,y,s=1){const [a,b]=P(x,y);const k=s;
  return `<g transform="translate(${a.toFixed(1)},${b.toFixed(1)})"><ellipse cx="4" cy="1" rx="${10*k}" ry="${4.6*k}" class="sh"/><line x1="0" y1="0" x2="0" y2="${-9*k}" class="trunk"/>`+
    (rnd()<.55?`<circle cx="0" cy="${-17*k}" r="${8.5*k}" class="tr"/><circle cx="${-4*k}" cy="${-12*k}" r="${5*k}" class="tr"/>`:`<ellipse cx="0" cy="${-17*k}" rx="${6*k}" ry="${11*k}" class="tr"/>`)+`</g>`}
function bush(x,y){const [a,b]=P(x,y);return `<g transform="translate(${a.toFixed(1)},${b.toFixed(1)})"><ellipse cx="2" cy="1" rx="10" ry="4" class="sh"/><circle cx="-5" cy="-4" r="5" class="tr"/><circle cx="4" cy="-4" r="5.5" class="tr"/><circle cx="0" cy="-8" r="5.5" class="tr"/></g>`}
function sprout(x,y){const [a,b]=P(x,y);return `<path class="sp" transform="translate(${a.toFixed(1)},${b.toFixed(1)})" d="M0 0L-4 -6M0 0L0 -8M0 0L4 -6M0 0L-6 -2M0 0L6 -2"/>`}
/* Texto pintado sobre una cara vertical: "x" = cara que mira a +y (corre en x); "y" = cara que mira a +x (corre en y, se lee hacia -y) */
const K=1/120;
function faceText(dir,x,y,z,lines,w,hz){const [ox,oy]=P(x,y,z),a=TW/2*K,b=(dir==="x"?1:-1)*TH/2*K,cx=w/K/2,aw=w/K-24;
  // se ajusta el tamaño para que cada renglón quepa a lo ancho y todo quepa a lo alto del letrero
  let L2=lines.map(L=>({...L,sz:Math.min(L.sz*3,aw/(.5*Math.max(1,String(L.t).length))),gap:(L.gap||3)*3}));
  const tot=()=>L2.reduce((s2,L)=>s2+L.sz*1.02+L.gap,0)-L2[L2.length-1].gap;
  let off=8;if(hz){const av=hz/K-24,t0=tot();if(t0>av){const f=av/t0;L2=L2.map(L=>({...L,sz:L.sz*f,gap:L.gap*f}))}off=Math.max(10,(hz/K-tot())/2)}
  let s=`<g transform="matrix(${a},${b},0,${ZU*K},${ox.toFixed(1)},${oy.toFixed(1)})">`,yy=off;
  for(const L of L2){yy+=L.sz*.86;s+=`<text x="${cx}" y="${yy.toFixed(1)}" text-anchor="middle" font-size="${L.sz.toFixed(1)}" class="bbt${L.dark?" dkt":""}">${esc(L.t)}</text>`;yy+=L.sz*.16+L.gap}return s+"</g>"}
/* Espectacular sobre dos postes, como los letreros del plano */
function billboard(dir,x,y,w,h,lines,v="dk",z0=.35){const th=.12;let s="";
  if(dir==="x"){s+=box(x+.25,y,0,.08,.08,z0)+box(x+w-.33,y,0,.08,.08,z0)+box(x,y,z0,w,th,h,{c:v});s+=faceText("x",x,y+th,z0+h,lines,w,h)}
  else{s+=box(x,y+.25,0,.08,.08,z0)+box(x,y+w-.33,0,.08,.08,z0)+box(x,y,z0,th,w,h,{c:v});s+=faceText("y",x+th,y+w,z0+h,lines,w,h)}
  return s}
function groundText(dir,x,y,t,sz=13){const [ox,oy]=P(x,y),k=1/34,a=TW/2*k,b=TH/2*k,hl=t.length*sz*.03+.25,gap=dir==="x"?rect(x-hl,y-.15,x+hl,y+.15,"road"):rect(x-.15,y-hl,x+.15,y+hl,"road");
  const m=dir==="x"?`${a},${b},${-a},${b}`:`${a},${-b},${a},${b}`;return gap+`<text class="gl" transform="matrix(${m},${ox.toFixed(1)},${oy.toFixed(1)})" text-anchor="middle" dominant-baseline="middle" font-size="${sz}">${esc(t)}</text>`}
const rect=(x0,y0,x1,y1,c)=>poly([[x0,y0],[x1,y0],[x1,y1],[x0,y1]],c);
const isoEll=(x,y,r,c)=>{const [a,b]=P(x,y);return `<ellipse cx="${a}" cy="${b}" rx="${r*TW/2*Math.SQRT2}" ry="${r*TH/2*Math.SQRT2}" class="${c}"/>`};

/* Barrios: rectángulos en la cuadrícula; sirven para tocar y para centrar la vista */
const DIST={
  rut:{n:"Barrio Rutinas",c:[7,7],r:[[.3,.3,13.7,13.7]]},
  fin:{n:"Distrito Financiero",c:[24,7],r:[[16.3,.3,31.7,13.7]]},

  return r}

  if(!ms){V.s=s;V.x=tx;V.y=ty;apply();return}const a={...V},t1=performance.now();
  const step=n=>{const k=Math.min(1,(n-t1)/ms),e=1-Math.pow(1-k,3);V.s=a.s+(s-a.s)*e;V.x=a.x+(tx-a.x)*e;V.y=a.y+(ty-a.y)*e;apply();if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
const ptr=new Map();let moved=0,downT=null,pinch=null;
svgEl.addEventListener("pointerdown",e=>{ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===1){moved=0;downT=e.target}svgEl.classList.add("drag");
  if(ptr.size===2){const [a,b]=[...ptr.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:V.s}}});
svgEl.addEventListener("pointermove",e=>{const p=ptr.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(ptr.size===1){V.x+=dx;V.y+=dy;moved+=Math.abs(dx)+Math.abs(dy);apply()}
  p.x=e.clientX;p.y=e.clientY;
  if(ptr.size===2&&pinch){const [a,b]=[...ptr.values()];moved+=99;zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d);
    if(p===a||p===b){V.x+=dx/2;V.y+=dy/2;apply()}}});
const up=e=>{if(!ptr.has(e.pointerId))return;ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;if(!ptr.size){svgEl.classList.remove("drag");
  if(moved<8&&downT&&e.type==="pointerup"){const g=downT.closest&&downT.closest("[data-d]");if(g)openDist(g.dataset.d,false);else closeSheet()}}};
svgEl.addEventListener("pointerup",up);svgEl.addEventListener("pointercancel",up);
svgEl.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,V.s*Math.exp(-e.deltaY*.0015))},{passive:false});
svgEl.addEventListener("dblclick",e=>zoomAt(e.clientX,e.clientY,V.s*1.6));
