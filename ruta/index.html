<title>Ruta</title>

<script>
/* Tema de Ruta: automático (sigue a Diapps y la hora), claro u oscuro */
(function(){var m="auto",t="light";try{m=(JSON.parse(localStorage.getItem("ruta1"))||{}).theme||"auto";t=localStorage.getItem("diapps-theme")||"light"}catch(e){}
  var h=new Date().getHours(),d=m==="dark"||(m==="auto"&&(t==="dark"||h>=19||h<7));document.documentElement.dataset.mode=d?"dark":"light"})();

<style>
/* Ruta · concepto "grafito y volt": mapa monocromo propio (sin azules), un solo acento verde-lima eléctrico para
   la ruta, tu posición y la acción principal; números en Space Grotesk; controles abajo, al alcance del pulgar. */
:root{--volt:#C8FF2E;--volt2:#A6E000;--ink:#0F0F0F;
  --bg:#F2F0EB;--panel:rgba(250,249,246,.9);--panel2:#E9E6DF;--tx:#121212;--tx2:#6B6862;--tx3:#9A968E;--line:rgba(0,0,0,.08);--shadow:0 18px 50px rgba(30,25,15,.18);--onvolt:#0F0F0F;--hl:#121212}
:root[data-mode="dark"]{--bg:#0F0F0F;--panel:rgba(22,22,21,.9);--panel2:#232321;--tx:#EFEDE8;--tx2:#8E8B84;--tx3:#5F5C56;--line:rgba(255,255,255,.07);--shadow:0 18px 50px rgba(0,0,0,.55);--hl:var(--volt)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:Urbanist,system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
.num,h2,.big{font-family:"Space Grotesk",Urbanist,sans-serif}
#map{position:fixed;inset:0}
.pn{background:var(--panel);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:var(--shadow),0 0 0 1px var(--line)}
.sq{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex:none}
.sq svg{width:20px;height:20px}
.sq.on{background:var(--volt);color:var(--onvolt)}
/* barra lateral derecha */
.rail{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 12px);z-index:5;display:flex;flex-direction:column;gap:8px;transition:opacity .3s}
.back{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 12px);z-index:5}
.compass{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 70px);z-index:5;width:48px;height:48px;border-radius:16px;display:grid;place-items:center}
.compass svg{width:26px;height:26px;transition:transform .2s}
/* base inferior: buscar y destinos */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 10px calc(env(safe-area-inset-bottom) + 10px);max-width:560px;margin:0 auto;transition:transform .35s cubic-bezier(.2,.9,.25,1)}
body.nav #dock,body.sheeton #dock{transform:translateY(130%)}
.dockin{border-radius:28px;padding:12px}
.stat{display:flex;align-items:center;gap:10px;padding:2px 6px 10px;font-size:12px;font-weight:700;color:var(--tx2);letter-spacing:.04em;text-transform:uppercase}
.stat .dot{width:8px;height:8px;border-radius:50%;background:var(--volt);box-shadow:0 0 10px var(--volt)}
.stat .sp{flex:1}
.stat b{color:var(--tx);font-family:"Space Grotesk";font-size:13px}
.go{display:flex;align-items:center;gap:10px;height:58px;border-radius:20px;background:var(--panel2);padding:0 8px 0 18px;width:100%;text-align:left}
.go span{flex:1;font-size:19px;font-weight:700;color:var(--tx2);font-family:"Space Grotesk"}
.go i{width:44px;height:44px;border-radius:14px;background:var(--volt);color:var(--onvolt);display:grid;place-items:center}
.go i svg{width:20px;height:20px}
.tiles{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;width:96px;height:88px;border-radius:18px;background:var(--panel2);padding:11px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.tile svg{width:20px;height:20px;color:var(--tx2)}
.tile b{font-size:14px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{display:block;font-size:11.5px;color:var(--tx2);font-family:"Space Grotesk";font-weight:500}
.tile.empty b{color:var(--tx2)}
/* hoja de ruta */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:7;max-width:560px;margin:0 auto;padding:0 10px calc(env(safe-area-inset-bottom) + 10px);transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.9,.25,1)}
.sheet.on{transform:none}
.sheetin{border-radius:28px;padding:16px;max-height:76vh;overflow:auto}
.sheet h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.sub{color:var(--tx2);font-size:14px;font-weight:600;margin-top:3px}
.kick{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px}
.opts{display:flex;gap:8px;overflow-x:auto;margin:14px -2px;padding:2px;scrollbar-width:none}
.opts::-webkit-scrollbar{display:none}
.opt{flex:none;min-width:150px;border-radius:20px;background:var(--panel2);padding:12px 14px;text-align:left;position:relative}
.opt.on{box-shadow:inset 0 0 0 2px var(--hl)}
.opt .big{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1}
.opt .big small{font-size:14px;font-weight:600;margin-left:3px;color:var(--tx2)}
.opt em{display:block;font-style:normal;font-size:12px;color:var(--tx2);font-weight:600;margin-top:6px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.opt .tag{position:absolute;right:10px;top:10px;font-size:10px;font-weight:800;letter-spacing:.06em;background:var(--volt);color:var(--onvolt);border-radius:8px;padding:3px 7px}
.fuel{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--panel2);margin-bottom:12px}
.fuel .big{font-size:22px;font-weight:700}
.fuel small{display:block;color:var(--tx2);font-size:12px;font-weight:600}
.fuel.warn{box-shadow:inset 0 0 0 2px #FF6A3D}
.row{display:flex;gap:8px}
.btn{height:56px;border-radius:18px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--panel2);flex:1;font-family:"Space Grotesk"}
.btn.prim{background:var(--volt);color:var(--onvolt);flex:2}
.btn.sq2{flex:none;width:56px}
.btn svg{width:19px;height:19px}
.mini{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.mini button{flex:none;height:36px;padding:0 13px;border-radius:12px;background:var(--panel2);font-weight:700;font-size:12.5px;color:var(--tx2)}
/* búsqueda */
#find{position:fixed;inset:0;z-index:10;background:var(--bg);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 12px 0}
#find.on{display:flex}
.frow{display:flex;gap:8px;align-items:center}
.inp{flex:1;height:56px;border-radius:18px;border:0;background:var(--panel2);color:var(--tx);padding:0 18px;font:inherit;font-size:18px;font-weight:600;font-family:"Space Grotesk"}
.inp:focus{outline:2px solid var(--hl)}
.list{flex:1;overflow:auto;padding:10px 0 30px}
.list h4{margin:16px 6px 6px;font-size:11px;color:var(--tx3);font-weight:800;text-transform:uppercase;letter-spacing:.12em}
.it{display:flex;align-items:center;gap:12px;padding:10px 6px;width:100%;text-align:left;border-radius:16px}
.it:active{background:var(--panel2)}
.it i{width:42px;height:42px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;flex:none;color:var(--tx2)}
.it i svg{width:18px;height:18px}
.it i.acc{background:var(--volt);color:var(--onvolt)}
.it span{flex:1;min-width:0}
.it b{display:block;font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{display:block;color:var(--tx2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it em{font-style:normal;color:var(--tx2);font-size:12.5px;font-weight:600;font-family:"Space Grotesk"}
/* navegación */
#banner{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 10px);z-index:8;max-width:560px;margin:0 auto;display:none;border-radius:26px;background:#0F0F0F;color:#EFEDE8;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.45);overflow:hidden}
body.nav #banner{display:block}
.mv{display:flex;gap:14px;align-items:center}
.mv .ar{width:64px;height:64px;border-radius:20px;background:var(--volt);color:#0F0F0F;display:grid;place-items:center;flex:none}
.mv .ar svg{width:40px;height:40px}
.mv .big{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--volt)}
.mv .big small{font-size:18px;margin-left:2px}
.mv p{margin:5px 0 0;font-size:16.5px;font-weight:600;line-height:1.25}
.prog{height:4px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--volt);transition:width .8s linear}
.then{margin-top:10px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;color:#8E8B84}
.then svg{width:16px;height:16px;color:#EFEDE8}
#navbar{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:8;max-width:560px;margin:0 auto;display:none;border-radius:24px;padding:10px 10px 10px 16px;align-items:center;gap:6px}
body.nav #navbar{display:flex}
.col{flex:1;min-width:0}
.col small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--tx3)}
.col b{display:block;font-family:"Space Grotesk";font-size:21px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col em{display:block;font-style:normal;font-size:11.5px;font-weight:700;color:var(--tx2);font-family:"Space Grotesk";white-space:nowrap}
.col b.acc{color:var(--hl)}
.col+.col{border-left:1px solid var(--line);padding-left:12px}
.endb{width:52px;height:52px;border-radius:16px;background:#FF5A36;color:#fff;display:grid;place-items:center;flex:none}
.endb svg{width:20px;height:20px}
#mute{width:44px;height:52px;display:grid;place-items:center;color:var(--tx2)}
#mute svg{width:20px;height:20px}
body.nav .rail{top:auto;bottom:calc(env(safe-area-inset-bottom) + 96px)}
body.nav .back,body.nav .compass{display:none}
.recenter{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 96px);z-index:8;height:46px;padding:0 18px;border-radius:16px;font-weight:800;display:none;align-items:center;gap:8px;font-family:"Space Grotesk"}
.recenter.on{display:flex}
.recenter svg{width:16px;height:16px;color:var(--hl)}
/* marcadores */
.me{width:30px;height:30px}
.me i{position:absolute;inset:6px;border-radius:50%;background:var(--volt);border:3px solid #0F0F0F;box-shadow:0 0 0 6px rgba(200,255,46,.22),0 0 18px rgba(200,255,46,.6)}
.me .cone{position:absolute;left:50%;top:50%;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;background:conic-gradient(from -28deg,rgba(200,255,46,.35),rgba(200,255,46,0) 56deg,transparent 304deg,rgba(200,255,46,.35));-webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%);display:none}
.me.dir .cone{display:block}
.me.nav{width:52px;height:52px}
.me.nav i{inset:0;background:var(--volt);border:0;border-radius:0;clip-path:polygon(50% 0,100% 100%,50% 76%,0 100%);box-shadow:none;filter:drop-shadow(0 0 6px rgba(0,0,0,.6))}
.pin{width:34px;height:44px}
.fuelpin{width:34px;height:34px;border-radius:12px;background:#0F0F0F;color:var(--volt);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.35);cursor:pointer}
.fuelpin svg{width:17px;height:17px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translate(-50%,-10px);opacity:0;z-index:30;background:#0F0F0F;color:var(--volt);padding:12px 18px;border-radius:16px;font-weight:700;font-size:14px;transition:all .3s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;font-family:"Space Grotesk"}
.toast.on{opacity:1;transform:translate(-50%,0)}
.maplibregl-ctrl-attrib{font-size:10px}
.maplibregl-ctrl-attrib.maplibregl-compact{background:var(--panel)!important;color:var(--tx2)}
.maplibregl-ctrl-bottom-left{left:auto;right:0;bottom:calc(env(safe-area-inset-bottom) + 2px)}
@media (min-width:900px){#dock,.sheet{left:20px;right:auto;width:420px;margin:0}#banner{left:20px;right:auto;width:440px;margin:0}#navbar{left:20px;right:auto;width:440px;margin:0}}
</style>
</head>

  <button class="sq pn" id="bLoc" aria-label="Mi ubicación"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg></button>

  <div class="stat"><span class="dot"></span><span id="here">Ubicando…</span><span class="sp"></span><b id="jstat"></b></div>
  <button class="go" id="openFind"><span>¿A dónde vamos?</span><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i></button>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const svg=(p,f)=>`<svg viewBox="0 0 24 24" fill="${f||"none"}" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
let tT;function toast(m,ms=2400){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("on"),ms)}
const IC={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',work:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  fuel:'<path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M14 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/><path d="M7 7h4"/>',star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>'};

/* ======================= Datos guardados: casa, trabajo, favoritos y recientes ======================= */
const KEY="ruta1";
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.fav)S={fav:{},saved:[],recent:[],voice:true};
function save(){S._u=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(window.SYNC)SYNC.touch()}
const placeKey=p=>p.lat.toFixed(5)+","+p.lon.toFixed(5);
function addRecent(p){S.recent=[p,...S.recent.filter(x=>placeKey(x)!==placeKey(p))].slice(0,12);save()}
/* Jetta: rendimiento, gasolina y precio para estimar el costo del viaje */
function jetta(){let J=null;try{J=JSON.parse(localStorage.getItem("jetta6v3"))}catch(e){}if(!J||!J.odo)return null;
  const fl=(J.fills||[]).slice().sort((a,b)=>a.odo-b.odo);let km=0,L=0;for(let i=1;i<fl.length;i++){km+=fl[i].odo-fl[i-1].odo;L+=fl[i].litros}
  const kmpl=L>0&&km/L>3&&km/L<30?km/L:11.5,price=fl.length?fl[fl.length-1].price:24.5;return {J,kmpl,price,range:55*(J.fuel||0)/100*kmpl}}

/* ======================= Utilidades geográficas ======================= */
const R2D=180/Math.PI,D2R=Math.PI/180;
function hav(a,b){const dLat=(b[1]-a[1])*D2R,dLon=(b[0]-a[0])*D2R,s=Math.sin(dLat/2)**2+Math.cos(a[1]*D2R)*Math.cos(b[1]*D2R)*Math.sin(dLon/2)**2;return 2*6371000*Math.asin(Math.sqrt(s))}
function bearing(a,b){const y=Math.sin((b[0]-a[0])*D2R)*Math.cos(b[1]*D2R),x=Math.cos(a[1]*D2R)*Math.sin(b[1]*D2R)-Math.sin(a[1]*D2R)*Math.cos(b[1]*D2R)*Math.cos((b[0]-a[0])*D2R);return (Math.atan2(y,x)*R2D+360)%360}
function circle(c,r){const pts=[];for(let i=0;i<=48;i++){const a=i/48*Math.PI*2;pts.push([c[0]+Math.cos(a)*r/(111320*Math.cos(c[1]*D2R)),c[1]+Math.sin(a)*r/110540])}return {type:"Feature",geometry:{type:"Polygon",coordinates:[pts]}}}
const fmtD=m=>m<1000?(m<100?Math.round(m/10)*10:Math.round(m/50)*50)+" m":(m/1000).toFixed(m<10000?1:0).replace(".",",")+" km";
const fmtT=s=>{const m=Math.round(s/60);return m<60?m+" min":Math.floor(m/60)+" h "+(m%60?m%60+" min":"")};

function mapStyle(d){

           :{bg:"#F2F0EB",res:"#ECE9E3",park:"#E2E5DA",wood:"#DCE0D3",water:"#D6D3CC",bld:"#E4E1DA",bldLine:"#D8D4CC",minor:"#FFFFFF",sec:"#FFFFFF",prim:"#FFFFFF",mot:"#FFFDF5",cas:"#D2CEC6",rail:"#C9C5BD",lbl:"#7A766E",lblHi:"#2A2825",halo:"#F2F0EB",path:"#E6E3DC",bnd:"#BDB8AE"};

      {id:"path",type:"line",source:"om","source-layer":"transportation",minzoom:15,filter:cls(["path","track"]),paint:{"line-color":C.path,"line-width":1.2,"line-dasharray":[2,2]}},
      ...road("service",["service"],14,[14,18],[.5,6],C.minor),

      {id:"bnd",type:"line",source:"om","source-layer":"boundary",filter:["<=",["get","admin_level"],4],paint:{"line-color":C.bnd,"line-width":1,"line-dasharray":[4,3]}},
      {id:"road-lbl",type:"symbol",source:"om","source-layer":"transportation_name",minzoom:13,layout:{"symbol-placement":"line","text-field":name,"text-font":["Noto Sans Regular"],"text-size":W([13,18],[10,14]),"text-letter-spacing":.03},paint:{"text-color":C.lbl,"text-halo-color":C.halo,"text-halo-width":1.4}},
      {id:"poi",type:"symbol",source:"om","source-layer":"poi",minzoom:16,filter:["<=",["get","rank"],12],layout:{"text-field":name,"text-font":["Noto Sans Regular"],"text-size":11,"text-max-width":8},paint:{"text-color":C.lbl,"text-halo-color":C.halo,"text-halo-width":1.2,"text-opacity":.85}},

const EMPTY={type:"FeatureCollection",features:[]};
function src(id,data){if(map.getSource(id))map.getSource(id).setData(data);else map.addSource(id,{type:"geojson",data})}
function setupLayers(){if(map.getSource("route"))return;
  src("acc",EMPTY);src("alts",EMPTY);src("route",EMPTY);src("done",EMPTY);
  const dk=isDark();map.addLayer({id:"acc",type:"fill",source:"acc",paint:{"fill-color":"#C8FF2E","fill-opacity":dk?.1:.25}});
  map.addLayer({id:"alts-casing",type:"line",source:"alts",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":dk?"#000000":"#B9B4AA","line-width":9}});
  map.addLayer({id:"alts",type:"line",source:"alts",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":dk?"#4A4842":"#E9E6DF","line-width":6}});
  map.addLayer({id:"route-casing",type:"line",source:"route",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":dk?"#000000":"#0F0F0F","line-width":["interpolate",["linear"],["zoom"],10,7,16,15]}});
  map.addLayer({id:"route",type:"line",source:"route",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#C8FF2E","line-width":["interpolate",["linear"],["zoom"],10,4,16,9]}});
  map.addLayer({id:"done",type:"line",source:"done",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":dk?"#3A3936":"#B9B4AA","line-width":["interpolate",["linear"],["zoom"],10,4,16,9]}});
  // edificios en 3D cuando el estilo los trae
  const b=map.getStyle().layers.find(l=>/building/.test(l.id)&&l.type==="fill");
  if(b&&!map.getLayer("b3d"))try{map.addLayer({id:"b3d",type:"fill-extrusion",source:b.source,"source-layer":b["source-layer"],minzoom:15,paint:{"fill-extrusion-color":dk?"#1F1F1E":"#E6E3DC","fill-extrusion-height":["coalesce",["get","render_height"],["get","height"],8],"fill-extrusion-base":["coalesce",["get","render_min_height"],0],"fill-extrusion-opacity":.75}})}catch(e){}
  if(ROUTE)drawRoute()}
map.on("click","alts",e=>{const i=e.features[0].properties.i;if(i!=null){RI=i;showPreview()}});
map.on("dragstart",()=>{if(MODE==="nav"){FOLLOW=false;$("#recenter").classList.add("on")}});

/* ======================= Ubicación en tiempo real ======================= */
let ME=null,meMarker=null,watchId=null,lastFix=null,headingDeg=null,SIM=null;
function meEl(){const d=document.createElement("div");d.className="me";d.innerHTML='<span class="cone"></span><i></i>';return d}
function onFix(p){const c=[p.coords.longitude,p.coords.latitude],acc=p.coords.accuracy||30;let h=p.coords.heading,sp=p.coords.speed;
  if(lastFix){const d=hav(lastFix,c);if(d>3&&(h==null||isNaN(h)))h=bearing(lastFix,c)}if(h!=null&&!isNaN(h))headingDeg=h;
  if(sp==null&&lastFix&&ME&&ME.t)sp=hav(lastFix,c)/Math.max(.5,(p.timestamp-ME.t)/1000);
  lastFix=c;ME={c,acc,speed:Math.max(0,sp||0),t:p.timestamp||Date.now()};
  try{localStorage.setItem("ruta-last",JSON.stringify(c))}catch(e){}
  if(!meMarker){meMarker=new maplibregl.Marker({element:meEl(),rotationAlignment:"map",pitchAlignment:"map"}).setLngLat(c).addTo(map);if(MODE==="browse")map.jumpTo({center:c,zoom:15.5})}
  meMarker.setLngLat(c);const el=meMarker.getElement();el.classList.toggle("dir",headingDeg!=null&&MODE!=="nav");el.classList.toggle("nav",MODE==="nav");if(headingDeg!=null)meMarker.setRotation(headingDeg);
  if(map.getSource("acc"))map.getSource("acc").setData(MODE==="nav"?EMPTY:circle(c,acc));
  $("#spd").textContent=Math.round((ME.speed||0)*3.6);
  if(MODE==="nav")navTick()}
function startWatch(){if(!navigator.geolocation){toast("Este dispositivo no da ubicación");return}
  if(watchId!=null)return;watchId=navigator.geolocation.watchPosition(p=>{if(!SIM)onFix(p)},e=>toast(e.code===1?"Permite la ubicación para navegar":"No se pudo obtener tu ubicación"),{enableHighAccuracy:true,maximumAge:1000,timeout:20000})}
$("#bLoc").onclick=()=>{startWatch();if(ME){map.easeTo({center:ME.c,zoom:Math.max(map.getZoom(),15.5),bearing:0,duration:700})}else toast("Buscando tu ubicación…")};

/* ======================= Búsqueda (Photon / OpenStreetMap) ======================= */
function openFind(){$("#find").classList.add("on");$("#q").value="";renderFind();setTimeout(()=>$("#q").focus(),60)}
function closeFind(){$("#find").classList.remove("on");try{document.activeElement&&document.activeElement.blur()}catch(e){}scrollTo(0,0);setTimeout(()=>{scrollTo(0,0);map.resize()},350)}
$("#openFind").onclick=openFind;$("#closeFind").onclick=closeFind;
const distTxt=p=>ME?fmtD(hav(ME.c,[p.lon,p.lat])):"";
const itemHTML=(p,ic="pin",cls="")=>`<button class="it" data-p='${esc(JSON.stringify(p))}'><i class="${cls}">${svg(IC[ic])}</i><span><b>${esc(p.name)}</b><small>${esc(p.addr||"")}</small></span><em>${distTxt(p)}</em></button>`;
function renderFind(results){const q=$("#q").value.trim();let h="";
  if(results){h=results.length?results.map(p=>itemHTML(p,p.fuel?"fuel":"pin",p.fuel?"acc":"")).join(""):`<p class="sub" style="padding:14px 8px">Sin resultados para “${esc(q)}”.</p>`}
  else{h+=`<h4>Lugares</h4>`+[["casa","home","Casa"],["trabajo","work","Trabajo"]].map(([k,ic,n])=>S.fav[k]?itemHTML({...S.fav[k],name:n,addr:S.fav[k].addr||S.fav[k].name},ic,"acc"):`<button class="it" data-setfav="${k}"><i>${svg(IC[ic])}</i><span><b>${n}</b><small>Toca para elegir en el mapa o búscalo y guárdalo</small></span></button>`).join("");
    if(S.saved.length)h+=`<h4>Guardados</h4>`+S.saved.map(p=>itemHTML(p,"star")).join("");
    h+=`<button class="it" data-fuel><i class="acc">${svg(IC.fuel)}</i><span><b>Gasolineras cerca</b><small>Dentro de 5 km de ti</small></span></button>`;
    if(S.recent.length)h+=`<h4>Recientes</h4>`+S.recent.map(p=>itemHTML(p,"clock")).join("")}
  $("#res").innerHTML=h}
let qT,qId=0;$("#q").oninput=()=>{clearTimeout(qT);const q=$("#q").value.trim();if(q.length<3){renderFind();return}qT=setTimeout(()=>search(q),350)};
$("#q").onkeydown=e=>{if(e.key==="Enter"){clearTimeout(qT);search($("#q").value.trim())}};
async function search(q){const id=++qId;const c=ME?ME.c:map.getCenter().toArray();
  try{const r=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=${c[1]}&lon=${c[0]}&limit=10`);const j=await r.json();if(id!==qId)return;
    renderFind(j.features.map(f=>{const p=f.properties,co=f.geometry.coordinates;return {name:p.name||[p.street,p.housenumber].filter(Boolean).join(" ")||p.city||"Lugar",addr:[p.street&&p.name?p.street+(p.housenumber?" "+p.housenumber:""):"",p.district||p.locality,p.city,p.state].filter(Boolean).join(", "),lat:co[1],lon:co[0]}}))}
  catch(e){if(id===qId)$("#res").innerHTML=`<p class="sub" style="padding:14px 8px">No se pudo buscar. Revisa tu conexión.</p>`}}
$("#res").addEventListener("click",e=>{let b;if(b=e.target.closest("[data-p]")){const p=JSON.parse(b.dataset.p);closeFind();goTo(p);return}
  if(b=e.target.closest("[data-setfav]")){const k=b.dataset.setfav;closeFind();PICK=k;toast(`Mantén presionado o toca en el mapa para elegir ${k==="casa"?"Casa":"Trabajo"}`,4000);return}
  if(e.target.closest("[data-fuel]")){closeFind();fuelNear()}});
/* elegir punto en el mapa (mantener presionado) */
let PICK=null;
async function reverse(c){try{const r=await fetch(`https://photon.komoot.io/reverse?lat=${c[1]}&lon=${c[0]}`);const j=await r.json();const p=(j.features[0]||{}).properties||{};
  return {name:p.name||[p.street,p.housenumber].filter(Boolean).join(" ")||"Punto en el mapa",addr:[p.street,p.district||p.locality,p.city].filter(Boolean).join(", "),lat:c[1],lon:c[0]}}catch(e){return {name:"Punto en el mapa",addr:c[1].toFixed(5)+", "+c[0].toFixed(5),lat:c[1],lon:c[0]}}}
map.on("contextmenu",async e=>{if(MODE==="nav")return;const p=await reverse([e.lngLat.lng,e.lngLat.lat]);if(PICK){setFav(PICK,p);PICK=null}else goTo(p)});
map.on("click",async e=>{if(!PICK||MODE==="nav")return;const p=await reverse([e.lngLat.lng,e.lngLat.lat]);setFav(PICK,p);PICK=null});
function setFav(k,p){S.fav[k]={...p};save();chips();toast((k==="casa"?"Casa":"Trabajo")+" guardado")}
/* gasolineras cercanas (Overpass) */
let fuelMarkers=[];
async function fuelNear(){const c=ME?ME.c:map.getCenter().toArray();toast("Buscando gasolineras…");
  try{const q=`[out:json][timeout:20];(node[amenity=fuel](around:5000,${c[1]},${c[0]});way[amenity=fuel](around:5000,${c[1]},${c[0]}););out center 30;`;
    const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"}});const j=await r.json();
    fuelMarkers.forEach(m=>m.remove());fuelMarkers=[];
    const L=j.elements.map(el=>({name:(el.tags&&(el.tags.brand||el.tags.name))||"Gasolinera",addr:el.tags&&[el.tags["addr:street"],el.tags["addr:city"]].filter(Boolean).join(", "),lat:el.lat||el.center.lat,lon:el.lon||el.center.lon,fuel:true}))
      .sort((a,b)=>hav(c,[a.lon,a.lat])-hav(c,[b.lon,b.lat]));
    if(!L.length){toast("No encontré gasolineras cerca");return}
    L.forEach(p=>{const d=document.createElement("div");d.className="fuelpin";d.innerHTML=svg(IC.fuel);d.onclick=ev=>{ev.stopPropagation();goTo(p)};fuelMarkers.push(new maplibregl.Marker({element:d}).setLngLat([p.lon,p.lat]).addTo(map))});
    const bb=new maplibregl.LngLatBounds();L.slice(0,8).forEach(p=>bb.extend([p.lon,p.lat]));bb.extend(c);map.fitBounds(bb,{padding:80,maxZoom:15});
    openFind();renderFind(L);$("#q").value="Gasolineras cerca"}catch(e){toast("No se pudo consultar gasolineras")}}

/* ======================= Rutas (OSRM) ======================= */
let MODE="browse",DEST=null,ROUTES=[],RI=0,ROUTE=null,destMarker=null;
function pinEl(){const d=document.createElement("div");d.className="pin";d.innerHTML='<svg viewBox="0 0 30 40"><path d="M15 39s13-12.5 13-23A13 13 0 0 0 2 16c0 10.5 13 23 13 23z" fill="#E5484D" stroke="#fff" stroke-width="2"/><circle cx="15" cy="15.5" r="5" fill="#fff"/></svg>';return d}
async function goTo(p){DEST=p;addRecent(p);startWatch();
  if(destMarker)destMarker.remove();destMarker=new maplibregl.Marker({element:pinEl(),anchor:"bottom"}).setLngLat([p.lon,p.lat]).addTo(map);
  $("#openFind span").textContent=p.name;
  if(!ME){map.easeTo({center:[p.lon,p.lat],zoom:15});openSheet(`<div class="kick">Destino</div><h2>${esc(p.name)}</h2><div class="sub">${esc(p.addr||"")}</div><p class="sub" style="margin:14px 0">Esperando tu ubicación para trazar la ruta… Permite el acceso a la ubicación.</p><div class="row"><button class="btn" data-a="close">Cerrar</button></div>`);
    const w=setInterval(()=>{if(ME){clearInterval(w);goTo(p)}},800);setTimeout(()=>clearInterval(w),30000);return}
  openSheet(`<h2>${esc(p.name)}</h2><div class="sub">${esc(p.addr||"")}</div><p class="sub" style="margin:14px 0">Calculando ruta…</p>`);
  try{ROUTES=await route(ME.c,[p.lon,p.lat],true);RI=0;showPreview()}catch(e){openSheet(`<h2>${esc(p.name)}</h2><p class="sub" style="margin:12px 0">No se pudo calcular la ruta. ${esc(e.message||"")}</p><div class="row"><button class="btn" data-a="close">Cerrar</button><button class="btn prim" data-a="retry">Reintentar</button></div>`)}}
async function route(a,b,alts){const u=`https://router.project-osrm.org/route/v1/driving/${a[0]},${a[1]};${b[0]},${b[1]}?overview=full&geometries=geojson&steps=true&alternatives=${alts?"true":"false"}`;
  const r=await fetch(u);if(!r.ok)throw new Error("Servidor de rutas ocupado");const j=await r.json();if(j.code!=="Ok"||!j.routes.length)throw new Error("No hay ruta en auto");
  return j.routes.map(prep)}
/* prepara la ruta: distancias acumuladas e inicio de cada paso */
function prep(r){const co=r.geometry.coordinates,cum=[0];for(let i=1;i<co.length;i++)cum.push(cum[i-1]+hav(co[i-1],co[i]));
  const steps=[];let acc=0;r.legs[0].steps.forEach(s=>{steps.push({...s,at:acc});acc+=s.distance});
  const via=[...r.legs[0].steps].sort((a,b)=>b.distance-a.distance).map(s=>s.name).find(Boolean)||"";
  return {co,cum,total:cum[cum.length-1],dur:r.duration,dist:r.distance,steps,via}}
function drawRoute(){if(!map.getSource("route"))return;ROUTE=ROUTES[RI];
  map.getSource("route").setData({type:"Feature",geometry:{type:"LineString",coordinates:ROUTE.co}});
  map.getSource("alts").setData(MODE==="nav"?EMPTY:{type:"FeatureCollection",features:ROUTES.map((r,i)=>i===RI?null:{type:"Feature",properties:{i},geometry:{type:"LineString",coordinates:r.co}}).filter(Boolean)});
  map.getSource("done").setData(EMPTY)}
function showPreview(){MODE="preview";drawRoute();const r=ROUTE,j=jetta();
  const bb=new maplibregl.LngLatBounds();r.co.forEach(c=>bb.extend(c));map.fitBounds(bb,{padding:{top:90,bottom:Math.min(innerHeight*.55,430),left:40,right:70},maxZoom:16,duration:700});
  const mm=s=>Math.max(1,Math.round(s/60));let jt="";
  if(j){const L=r.dist/1000/j.kmpl,cost=L*j.price,warn=j.range<r.dist/1000*1.1;
    jt=`<div class="fuel${warn?" warn":""}"><span class="big">$${Math.round(cost)}</span><span style="flex:1"><small>${warn?"No te alcanza: carga gasolina antes":"Gasolina estimada del viaje"}</small><b style="font-size:13.5px">${L.toFixed(1)} L · ${j.kmpl.toFixed(1)} km/L · Jetta ≈ ${Math.round(j.range)} km</b></span></div>`}
  openSheet(`<div class="kick">Ruta a</div><h2>${esc(DEST.name)}</h2><div class="sub">${esc(DEST.addr||"")}</div>
    <div class="opts">${ROUTES.map((x,i)=>`<button class="opt${i===RI?" on":""}" data-r="${i}">${i===0?'<span class="tag">MÁS RÁPIDA</span>':""}<div class="big">${mm(x.dur)}<small>min</small></div><em>${fmtD(x.dist)} · llega ${clockAt(x.dur)}</em><em>${x.via?"Por "+esc(x.via):""}</em></button>`).join("")}</div>
    ${jt}<div class="row"><button class="btn sq2" data-a="close" aria-label="Cerrar">${svg('<path d="M6 6l12 12M18 6L6 18"/>')}</button><button class="btn" data-a="sim">${svg('<path d="M7 5l12 7-12 7z"/>')}Simular</button><button class="btn prim" data-a="go">${svg('<path d="M12 2l7 19-7-4-7 4z"/>',"currentColor")}Iniciar</button></div>
    <div class="mini"><button data-a="fav">★ Guardar</button><button data-a="home">Es mi casa</button><button data-a="work">Es mi trabajo</button><button data-a="share">Compartir llegada</button></div>`)}
function openSheet(h){$("#sheetIn").innerHTML=h;$("#sheet").classList.add("on");document.body.classList.add("sheeton")}
function closeSheet(){$("#sheet").classList.remove("on");document.body.classList.remove("sheeton")}
$("#sheetIn").addEventListener("click",async e=>{let b;if(b=e.target.closest("[data-r]")){RI=+b.dataset.r;showPreview();return}
  b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
  if(a==="close"){clearRoute();return}if(a==="retry"){goTo(DEST);return}
  if(a==="go")startNav(false);if(a==="sim")startNav(true);
  if(a==="fav"){if(!S.saved.some(x=>placeKey(x)===placeKey(DEST)))S.saved.unshift({...DEST});save();toast("Guardado")}
  if(a==="home")setFav("casa",DEST);if(a==="work")setFav("trabajo",DEST);
  if(a==="share"){const t=`Voy a ${DEST.name}, llego ≈ ${clockAt(ROUTE.dur)}. https://www.openstreetmap.org/?mlat=${DEST.lat}&mlon=${DEST.lon}#map=17/${DEST.lat}/${DEST.lon}`;if(navigator.share)navigator.share({text:t}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(t);toast("Copiado")}}
  if(a==="addkm")addKm();if(a==="done")clearRoute()});
function clearRoute(){MODE="browse";ROUTES=[];ROUTE=null;DEST=null;closeSheet();if(destMarker)destMarker.remove();destMarker=null;$("#openFind span").textContent="¿A dónde vamos?";
  ["route","alts","done"].forEach(s=>map.getSource(s)&&map.getSource(s).setData(EMPTY));}

/* ======================= Navegación vuelta por vuelta ======================= */
const MODS={left:"a la izquierda",right:"a la derecha","slight left":"ligeramente a la izquierda","slight right":"ligeramente a la derecha","sharp left":"cerrado a la izquierda","sharp right":"cerrado a la derecha",straight:"derecho",uturn:"en U"};
const ORD=["","primera","segunda","tercera","cuarta","quinta","sexta","séptima","octava"];
function say(s){const m=s.maneuver,mod=MODS[m.modifier]||"",on=s.name?` en ${s.name}`:"",to=s.name?` hacia ${s.name}`:"";
  switch(m.type){case"depart":return`Sal${to||" por la ruta"}`;case"arrive":return"Llegas a tu destino";
    case"turn":case"end of road":return m.modifier==="uturn"?"Da vuelta en U"+on:`Gira ${mod}${on}`;
    case"continue":case"new name":return m.modifier&&m.modifier!=="straight"?`Sigue ${mod}${on}`:`Continúa${on||" derecho"}`;
    case"merge":return`Incorpórate ${mod}${on}`;case"on ramp":return`Toma la entrada ${mod}${to}`;case"off ramp":return`Toma la salida ${mod}${to}`;
    case"fork":return`Mantente ${mod}${to}`;case"roundabout":case"rotary":return`En la glorieta, toma la ${ORD[m.exit]||m.exit+"ª"} salida${to}`;
    case"exit roundabout":case"exit rotary":return`Sal de la glorieta${to}`;default:return mod?`Sigue ${mod}${on}`:`Continúa${on}`}}
function arrow(s){const m=s.maneuver,t=m.type,mod=m.modifier||"straight";
  if(t==="arrive")return svg('<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>');
  if(t==="roundabout"||t==="rotary")return svg('<circle cx="12" cy="9" r="4"/><path d="M12 13v8M16 9h4"/>');
  const P={straight:'<path d="M12 21V4M6 10l6-6 6 6"/>',left:'<path d="M17 21v-8a4 4 0 0 0-4-4H5M10 4L5 9l5 5"/>',right:'<path d="M7 21v-8a4 4 0 0 1 4-4h8M14 4l5 5-5 5"/>',
    "slight left":'<path d="M15 21v-7L8 7M8 13V7h6"/>',"slight right":'<path d="M9 21v-7l7-7M16 13V7h-6"/>',"sharp left":'<path d="M17 4v10l-9 7M8 13v8h8"/>',"sharp right":'<path d="M7 4v10l9 7M16 13v8H8"/>',uturn:'<path d="M8 21V9a4 4 0 0 1 8 0v4M12 9l4 4 4-4"/>'};
  return svg(P[mod]||P.straight)}
let NAV=null,FOLLOW=true,wake=null;
async function startNav(sim){MODE="nav";closeSheet();document.body.classList.add("nav");FOLLOW=true;$("#recenter").classList.remove("on");
  NAV={idx:0,seg:0,prog:0,spoken:{},off:0,lastReroute:0,start:Date.now(),startOdoPos:ME.c,driven:0,lastC:ME.c};drawRoute();
  if(meMarker)meMarker.getElement().classList.add("nav");if(map.getSource("acc"))map.getSource("acc").setData(EMPTY);
  try{if("wakeLock" in navigator)wake=await navigator.wakeLock.request("screen")}catch(e){}
  speak("Iniciando ruta a "+DEST.name+". "+say(ROUTE.steps[0]));
  if(sim)startSim();navTick();renderMute()}
function endNav(arrived){if(SIM){clearInterval(SIM.iv);SIM=null}MODE=arrived?"arrived":"browse";document.body.classList.remove("nav");$("#recenter").classList.remove("on");
  try{wake&&wake.release()}catch(e){}wake=null;if(meMarker)meMarker.getElement().classList.remove("nav");map.easeTo({pitch:pitched?60:0,bearing:0,duration:800});
  if(arrived){const km=NAV.driven/1000,mins=Math.round((Date.now()-NAV.start)/60000),j=jetta();
    openSheet(`<div class="kick">Llegaste</div><h2>${esc(DEST.name)}</h2><div class="sub">${fmtD(NAV.driven)} recorridos en ${mins} min</div><div style="height:14px"></div>
      <div class="row">${j&&km>.3?`<button class="btn" data-a="addkm">Sumar ${km.toFixed(1)} km al Jetta</button>`:""}<button class="btn prim" data-a="done">Listo</button></div>`)}
  else clearRoute()}
$("#end").onclick=()=>endNav(false);
$("#recenter").onclick=()=>{FOLLOW=true;$("#recenter").classList.remove("on");navTick()};
/* lo más cercano de la ruta a tu posición: avance y distancia fuera de ruta */
function snap(c){const co=ROUTE.co,lat0=c[1]*D2R,kx=111320*Math.cos(lat0),ky=110540;let best={d:1e9,i:0,t:0};
  const from=Math.max(0,NAV.seg-30),to=Math.min(co.length-1,NAV.seg+400);
  const scan=(a,b)=>{for(let i=a;i<b;i++){const ax=(co[i][0]-c[0])*kx,ay=(co[i][1]-c[1])*ky,bx=(co[i+1][0]-c[0])*kx,by=(co[i+1][1]-c[1])*ky,dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;
    let t=L2?-(ax*dx+ay*dy)/L2:0;t=Math.max(0,Math.min(1,t));const px=ax+dx*t,py=ay+dy*t,d=Math.hypot(px,py);if(d<best.d)best={d,i,t}}};
  scan(from,to);if(best.d>80)scan(0,co.length-1);const seg=co[best.i+1]?hav(co[best.i],co[best.i+1]):0;return {...best,prog:ROUTE.cum[best.i]+seg*best.t}}
function navTick(){if(MODE!=="nav"||!ME||!ROUTE)return;const c=ME.c,s=snap(c);NAV.seg=s.i;NAV.prog=Math.max(NAV.prog-30,s.prog);
  if(NAV.lastC){const d=hav(NAV.lastC,c);if(d<200)NAV.driven+=d}NAV.lastC=c;
  // fuera de ruta: recalcular
  if(s.d>45&&(ME.acc||0)<60){NAV.off++;if(NAV.off>=3&&Date.now()-NAV.lastReroute>10000){NAV.lastReroute=Date.now();NAV.off=0;reroute();return}}else NAV.off=0;
  const remain=Math.max(0,ROUTE.total-NAV.prog);
  if(remain<25){speak("Llegaste a tu destino");endNav(true);return}
  // siguiente maniobra
  let k=ROUTE.steps.findIndex(st=>st.at>NAV.prog+5);if(k<0)k=ROUTE.steps.length-1;const st=ROUTE.steps[k],toM=Math.max(0,st.at-NAV.prog),nx=ROUTE.steps[k+1];
  const dTxt=fmtD(toM),dNum=dTxt.replace(/ (m|km)$/,""),dU=dTxt.endsWith("km")?"km":"m",segLen=Math.max(1,st.at-(ROUTE.steps[k-1]?ROUTE.steps[k-1].at:0)),pg=Math.max(0,Math.min(100,100-toM/segLen*100));
  $("#banner").innerHTML=`<div class="mv"><span class="ar">${arrow(st)}</span><span style="flex:1;min-width:0"><span class="big">${dNum}<small>${dU}</small></span><p>${esc(say(st))}</p></span></div><div class="prog"><i style="width:${pg}%"></i></div>${nx&&nx.maneuver.type!=="arrive"&&toM<600?`<div class="then">LUEGO ${arrow(nx)} ${esc(say(nx))}</div>`:""}`;
  const remT=ROUTE.dur*remain/ROUTE.total;{const t=new Date(Date.now()+remT*1000);$("#eta").textContent=t.getHours()%12||12;$("#eta").textContent+=":"+String(t.getMinutes()).padStart(2,"0");$("#etaP").textContent=t.getHours()<12?"a.m.":"p.m."}$("#rem").textContent=remT<3600?Math.max(1,Math.round(remT/60))+" min":fmtT(remT);$("#remK").textContent=fmtD(remain);
  // voz: avisos a 800 m (si vas rápido), 300 m y al llegar a la maniobra
  const sp=NAV.spoken[k]=NAV.spoken[k]||{},v=(ME.speed||0)*3.6;
  if(toM<900&&toM>500&&v>60&&!sp.a){sp.a=1;speak(`En ${fmtD(toM)}, ${say(st)}`)}
  else if(toM<330&&toM>120&&!sp.b){sp.b=1;speak(`En ${fmtD(toM)}, ${say(st)}`)}
  else if(toM<=60&&!sp.c){sp.c=1;speak(say(st))}
  // parte recorrida en gris
  if(map.getSource("done"))map.getSource("done").setData({type:"Feature",geometry:{type:"LineString",coordinates:[...ROUTE.co.slice(0,s.i+1),c]}});
  if(FOLLOW){const hd=headingDeg!=null?headingDeg:bearing(ROUTE.co[s.i],ROUTE.co[Math.min(ROUTE.co.length-1,s.i+1)]);const z=v>90?15.3:v>50?16:16.8;
    map.easeTo({center:c,bearing:hd,pitch:58,zoom:z,padding:{top:innerHeight*.42,bottom:90,left:0,right:0},duration:900,easing:x=>x})}}
async function reroute(){toast("Recalculando ruta…");try{ROUTES=await route(ME.c,[DEST.lon,DEST.lat],false);RI=0;NAV.seg=0;NAV.prog=0;NAV.spoken={};drawRoute();speak("Ruta recalculada")}catch(e){toast("No se pudo recalcular")}}
/* voz en español */
function renderMute(){$("#mute").innerHTML=svg(S.voice?'<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>':'<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/>')}
$("#mute").onclick=()=>{S.voice=!S.voice;save();renderMute();toast(S.voice?"Voz activada":"Voz silenciada");if(!S.voice&&window.speechSynthesis)speechSynthesis.cancel()};
function speak(t){if(!S.voice||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="es-MX";u.rate=1.02;speechSynthesis.speak(u)}catch(e){}}
/* simulación: recorre la ruta a ~50 km/h para probar sin manejar */
function startSim(){const r=ROUTE;let d=0;SIM={iv:setInterval(()=>{d+=14;if(d>r.total)d=r.total;let i=r.cum.findIndex(x=>x>=d);if(i<1)i=1;const a=r.co[i-1],b=r.co[i],seg=r.cum[i]-r.cum[i-1]||1,t=(d-r.cum[i-1])/seg;
  const c=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];headingDeg=bearing(a,b);onFix({coords:{longitude:c[0],latitude:c[1],accuracy:5,heading:headingDeg,speed:14},timestamp:Date.now()})},1000)};toast("Simulación a 50 km/h")}
/* sumar los km del viaje al Jetta (y bajar la gasolina según tu rendimiento) */
function addKm(){const j=jetta();if(!j)return;const km=NAV.driven/1000,J=j.J;J.odo=Math.round((J.odo+km)*10)/10;J.fuel=Math.max(0,Math.round(((J.fuel||0)-km/j.kmpl/55*100)*10)/10);J._u=Date.now();
  try{localStorage.setItem("jetta6v3",JSON.stringify(J))}catch(e){}if(window.Nube&&Nube.user())Nube.save("jetta",J,J._u).catch(()=>{});toast(`Jetta: ${Math.round(J.odo).toLocaleString("es-MX")} km · gasolina ${Math.round(J.fuel)}%`);clearRoute()}

/* ======================= Accesos rápidos ======================= */
function chips(){const j=jetta(),t=(k,ic,n,sub,cls="")=>`<button class="tile${cls}" ${k}>${svg(IC[ic])}<span><b>${n}</b><small>${sub}</small></span></button>`;
  const fd=k=>S.fav[k]?(ME?fmtD(hav(ME.c,[S.fav[k].lon,S.fav[k].lat])):"Guardado"):"Elegir";
  $("#chips").innerHTML=t('data-fav="casa"',"home","Casa",fd("casa"),S.fav.casa?"":" empty")+t('data-fav="trabajo"',"work","Trabajo",fd("trabajo"),S.fav.trabajo?"":" empty")+t("data-fuel","fuel","Gasolina","Cerca de ti")+
    S.saved.slice(0,6).map(p=>`<button class="tile" data-p='${esc(JSON.stringify(p))}'>${svg(IC.star)}<span><b>${esc(p.name)}</b><small>${ME?fmtD(hav(ME.c,[p.lon,p.lat])):""}</small></span></button>`).join("");
  $("#jstat").textContent=j?`JETTA ${Math.round(j.J.fuel||0)}% · ${Math.round(j.range)} KM`:""}
$("#chips").addEventListener("click",e=>{let b;if(b=e.target.closest("[data-p]")){goTo(JSON.parse(b.dataset.p));return}if(b=e.target.closest("[data-fav]")){const k=b.dataset.fav;if(S.fav[k])goTo({...S.fav[k],name:k==="casa"?"Casa":"Trabajo"});else{PICK=k;toast(`Toca en el mapa para elegir ${k==="casa"?"Casa":"Trabajo"}`,4000)}return}
  if(e.target.closest("[data-fuel]"))fuelNear()});
window.SYNC=window.Nube?Nube.sync("ruta",{get:()=>S,set:d=>{S=d;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}chips()}}):null;
chips();renderMute();startWatch();
function applyTheme(){const d=themeMode()==="dark";document.documentElement.dataset.mode=d?"dark":"light";$('meta[name="theme-color"]').content=d?"#0F0F0F":"#F2F0EB";
  const m=S.theme||"auto";$("#bTheme").innerHTML=svg(m==="auto"?'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>':m==="dark"?'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>':'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>');
  if(applyTheme.d!==d){if(applyTheme.d!==undefined)map.setStyle(mapStyle(d));applyTheme.d=d}}
$("#bTheme").onclick=()=>{const order=["auto","light","dark"];S.theme=order[(order.indexOf(S.theme||"auto")+1)%3];save();applyTheme();toast(S.theme==="auto"?"Tema automático":S.theme==="dark"?"Modo oscuro":"Modo claro")};
applyTheme();setInterval(applyTheme,60000);
map.on("rotate",()=>{$("#compass svg").style.transform=`rotate(${-map.getBearing()}deg)`});
$("#compass").onclick=()=>map.easeTo({bearing:0,pitch:pitched?60:0,duration:500});
let hereT=0;setInterval(async()=>{if(!ME||MODE==="nav"||Date.now()-hereT<45000)return;hereT=Date.now();const p=await reverse(ME.c);$("#here").textContent=(p.addr||p.name).split(",").slice(0,2).join(" · ");chips()},4000);
document.addEventListener("visibilitychange",async()=>{if(!document.hidden&&MODE==="nav"&&!wake)try{wake=await navigator.wakeLock.request("screen")}catch(e){}});
if("serviceWorker" in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
