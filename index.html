<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Diapps</title>
<meta name="description" content="Selector de mis proyectos y apps de prueba">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diapps">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F3">
<script>
/* Tema compartido entre las apps de Diapps: empieza en claro; el modo oscuro se elige en el menú */
(function(){var t="light";try{t=localStorage.getItem("diapps-theme")||localStorage.getItem("jetta6theme")||"light"}catch(e){}document.documentElement.dataset.theme=t})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap">
<style>
/* Selector de proyectos: cada proyecto es una carpeta (pestaña con estado + cuerpo con título y avance) */
:root{
  --bg:#F2F2F3; --ink:#141416; --ink2:#7C7C84; --line:#D6D6DA; --chip:#FFFFFF;
  --f1:#DCDCDF; --f1back:#E8E8EA; --f1ink:#141416;
  --f2:#2E2E31; --f2back:#E3E3E6; --f2ink:#FFFFFF;
  --glass:rgba(255,255,255,.55); --glassBorder:rgba(255,255,255,.8); --glassShadow:rgba(20,20,25,.16);
  --lime:#C6EE3A; --scrim:rgba(0,0,0,.3); --sheet:#FFFFFF;
  --font:"Urbanist",-apple-system,"SF Pro Text",system-ui,sans-serif;
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0E0E10; --ink:#F2F2F4; --ink2:#8C8C94; --line:#2C2C31; --chip:#1A1A1D;
  --f1:#232327; --f1back:#18181B; --f1ink:#F2F2F4;
  --f2:#ECECEE; --f2back:#1C1C1F; --f2ink:#141416;
  --glass:rgba(38,38,44,.6); --glassBorder:rgba(255,255,255,.1); --glassShadow:rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.55); --sheet:#1A1A1D;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
button,a,h1{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;-webkit-touch-callout:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.app{max-width:440px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 18px calc(120px + env(safe-area-inset-bottom,0px))}
.press{transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.press:active{transform:scale(.95)}

/* encabezado */
.top{display:flex;align-items:center;gap:8px;padding-top:6px}
.top .sp{flex:1}
.av{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.rb{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.rb svg{width:21px;height:21px}
.rb.line{border:1.5px solid var(--line)}
.rb.fill{background:var(--line)}
.rb .dot{position:absolute;top:14px;right:15px;width:7px;height:7px;border-radius:50%;background:#E5484D}
h1{font-size:44px;font-weight:400;letter-spacing:-.035em;line-height:1.05;margin:20px 0 4px}
h1 b{font-weight:700}
.lead{color:var(--ink);opacity:.75;font-size:15px;margin:0}

/* filtros */
.filters{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:22px}
.chip{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);font-size:14px;white-space:nowrap;font-weight:500;transition:background-color .25s,color .25s,border-color .25s,transform .18s}
.chip b{font-weight:700}
.chip svg{width:16px;height:16px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .avs{display:flex}
.chip .avs i{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.chip[aria-pressed="true"] .avs i{background:var(--bg);color:var(--ink);border-color:var(--ink)}
.actions{display:flex;align-items:center;justify-content:space-between;margin:20px 0 16px}
.newp{display:inline-flex;align-items:center;gap:9px;height:50px;padding:0 20px 0 16px;border-radius:99px;border:1.5px solid var(--ink2);font-size:15.5px;font-weight:500}
.newp svg{width:19px;height:19px}

/* carpetas */
.list{display:flex;flex-direction:column;gap:14px}
.folder{cursor:pointer;--f:var(--f1);--back:var(--f1back);--fi:var(--f1ink);display:block;position:relative;border-radius:30px;background:var(--back);color:var(--fi);transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .3s;animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
.folder.dark{--f:var(--f2);--back:var(--f2back);--fi:var(--f2ink)}
.folder:active{transform:scale(.97)}
.folder.opening{transform:scale(.96);opacity:.6}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
.f-top{display:flex;align-items:flex-end;height:58px}
.tab{position:relative;background:var(--f);border-radius:28px 28px 0 0;height:100%;display:flex;align-items:center;gap:8px;padding:0 12px 0 14px;flex:none;width:52%}
.tab::after{content:"";position:absolute;right:-30px;bottom:0;width:30px;height:30px;background:radial-gradient(circle at 100% 0,transparent 29.5px,var(--f) 30px)}
.st{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px 0 9px;border-radius:99px;border:1.5px solid currentColor;font-size:14.5px;font-weight:600;white-space:nowrap}
.st svg{width:14px;height:14px}
.tr{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--fi);color:var(--f);flex:none}
.tr svg{width:17px;height:17px}
.by{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0 14px 14px 30px;font-size:12.5px;color:var(--ink2);white-space:nowrap;align-self:center}
.folder.dark .by{color:var(--ink2)}
.by b{color:var(--ink);font-weight:600}
.by .mini{width:26px;height:26px;flex:none;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:11.5px;font-weight:700;position:relative}
.f-body{background:var(--f);border-radius:0 30px 30px 30px;display:flex;align-items:center;gap:16px;padding:12px 18px 22px 14px;position:relative;min-height:112px}
.thumb{width:74px;height:74px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;background:var(--fi);color:var(--f);font-size:26px;font-weight:600}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb.ico{display:block;border-radius:22.5%;width:70px;height:70px;margin:2px;box-shadow:0 0 0 1px color-mix(in srgb,var(--fi) 10%,transparent)}
.thumb.soft{background:color-mix(in srgb,var(--fi) 10%,transparent);color:var(--fi)}
.f-main{flex:1;min-width:0;padding-top:8px}
.f-main b{display:block;font-size:19px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-main span{display:block;font-size:13px;opacity:.6;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{position:relative;height:3px;border-radius:99px;background:color-mix(in srgb,var(--fi) 22%,transparent);margin-top:12px;overflow:hidden}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--fi);border-radius:99px;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1) .25s}
.more{position:absolute;top:8px;right:14px;width:40px;height:30px;display:grid;place-items:center;color:var(--fi)}
.more svg{width:20px;height:20px}
.panel{display:flex;align-items:center;gap:18px;background:var(--f1);border-radius:30px;padding:18px;margin-bottom:12px;animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
.panel h4{margin:2px 4px 12px;font-size:17px;font-weight:600}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{width:100%;height:100%}
.ring .arc{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.9,.25,1)}
.ring span{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:12px;color:var(--ink2);font-weight:500}
.ring b{display:block;font-size:30px;color:var(--ink);letter-spacing:-.03em;font-weight:700}
.kp{display:grid;gap:10px;flex:1}
.kp div{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--ink2);font-weight:500}
.kp b{font-size:22px;color:var(--ink);font-weight:700}
.prow,.te{display:flex;align-items:center;gap:12px;width:100%;padding:10px 4px;text-align:left;transition:transform .2s}
.prow+.prow,.te+.te{border-top:1px solid color-mix(in srgb,var(--ink) 8%,transparent)}
.pi{width:40px;height:40px;border-radius:12px;overflow:hidden;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 10%,transparent);font-weight:700}
.pi img{width:100%;height:100%;display:block}
.pm{flex:1;min-width:0}
.pm b{display:block;font-size:15px;font-weight:600}
.pm>span:not(.pb){display:block;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{display:block;height:6px;border-radius:99px;background:color-mix(in srgb,var(--ink) 12%,transparent);margin-top:7px;overflow:hidden}
.pb i{display:block;height:100%;width:0;border-radius:99px;background:var(--ink);transition:width 1.1s cubic-bezier(.2,.9,.25,1) .2s}
.prow em,.te em{font-style:normal;font-weight:700;font-size:14px;flex:none}
.te em{font-weight:500;color:var(--ink2);font-size:12.5px}
.te{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 50ms)}
.empty{text-align:center;color:var(--ink2);padding:40px 0;font-size:14px}

/* navegación inferior */
.nav{position:fixed;left:50%;bottom:max(14px,calc(env(safe-area-inset-bottom,0px) - 4px));transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:99px;z-index:8;background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glassBorder);box-shadow:inset 0 1px 0 var(--glassBorder),0 14px 34px var(--glassShadow)}
.nav button{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;border:1.5px solid color-mix(in srgb,var(--ink) 12%,transparent);color:var(--ink2);transition:background-color .25s,color .25s,transform .18s}
.nav button:active{transform:scale(.92)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:root:not([data-theme="dark"]) .nav button[aria-current="page"]{background:#fff;color:#141416;border-color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.12)}

/* hoja inferior */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:9;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-width:440px;margin:0 auto;background:var(--sheet);border-radius:30px 30px 0 0;padding:10px 22px calc(26px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:4px 0 6px}
.sheet p{margin:6px 0;color:var(--ink2)}
.rows{background:var(--bg);border-radius:20px;padding:2px 16px;margin-top:14px}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;font-size:15px}
.rows div+div{border-top:1px solid var(--line)}
.rows span:first-child{color:var(--ink2)}
.rows span:last-child{font-weight:600;text-align:right}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;height:52px;border-radius:99px;display:grid;place-items:center;font-weight:600;font-size:16px;border:1.5px solid var(--line)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg);padding:2px 6px;border-radius:6px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:20;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <span class="av" aria-hidden="true">D</span>
    <span class="sp"></span>
    <button class="rb line press" id="bell" aria-label="Novedades"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="dot"></span></button>
    <button class="rb fill press" id="grid" aria-label="Acerca de"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="6" r="1.8"/><circle cx="12" cy="6" r="1.8"/><circle cx="18" cy="6" r="1.8"/><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/><circle cx="6" cy="18" r="1.8"/><circle cx="12" cy="18" r="1.8"/><circle cx="18" cy="18" r="1.8"/></svg></button>
  </div>

  <h1><span id="hi">Hola</span>, <b>Diego!</b></h1>
  <p class="lead">Mira tus proyectos.</p>

  <div class="filters">
    <button class="chip press" data-f="live" aria-pressed="false"><span>Activos y futuros (<b id="nLive">0</b>)</span></button>
    <button class="chip press" data-f="prio" aria-pressed="false"><b>Prioridad alta</b><svg viewBox="0 0 24 24" fill="none" stroke="#E5484D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/></svg></button>
    <button class="chip press" data-f="mine" aria-pressed="false"><span>Creado por: <b>Diego</b></span><span class="avs"><i>D</i></span></button>
  </div>

  <div class="actions">
    <button class="newp press" id="newp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3z"/></svg>Nuevo proyecto</button>
    <button class="rb fill press" id="sort" aria-label="Ordenar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg></button>
  </div>

  <div class="list" id="list"></div>
</main>

<nav class="nav" aria-label="Vistas">
  <button data-v="stats" aria-label="Avance"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="13" width="3" height="6" rx="1"/><rect x="10.5" y="9" width="3" height="10" rx="1"/><rect x="16" y="5" width="3" height="14" rx="1"/></svg></button>
  <button data-v="folders" aria-label="Proyectos" aria-current="page"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg></button>
  <button data-v="recent" aria-label="Recientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- Proyectos ----------------
   Para agregar una app nueva: crea su carpeta (ej. /mi-app/ con su index.html)
   y agrega una entrada aquí. Sin "href" se muestra como "Próximamente". */
const PROJECTS=[
 {id:"jetta",name:"Mi Jetta MK6",desc:"Tablero, servicio, testigos y fallas",href:"jetta/",status:"live",prio:true,by:"Diego",progress:72,icon:"jetta/icons/icon.svg",updated:"2026-10-04"},
 {id:"finanzas",name:"Mis Finanzas",desc:"Gastos, presupuesto, ahorro y asistente",href:"finanzas/",status:"live",prio:true,by:"Diego",progress:60,icon:"finanzas/icons/icon.svg",updated:"2026-10-04"},
 {id:"habitos",name:"Ritmo",desc:"Hábitos diarios y semanales con un toque",href:"habitos/",status:"live",prio:true,by:"Diego",progress:55,icon:"habitos/icons/icon.svg",updated:"2026-10-04"},
 {id:"idea",name:"Laboratorio de ideas",desc:"Pruebas rápidas de UI y prototipos",status:"future",prio:false,by:"Diego",progress:0,letter:"L",updated:"2026-10-04"}
];
/* Bitácora de cambios: alimenta la vista "Recientes" */
const LOG=[
 {p:"habitos",d:"2026-10-04",t:"Nace Ritmo: reloj del día, cápsulas de hábitos, semana y progreso"},
 {p:"finanzas",d:"2026-10-04",t:"Tus 4 tarjetas en el inicio y cartera tipo Wallet"},
 {p:"finanzas",d:"2026-10-04",t:"Nuevo estilo claro/oscuro compartido con las demás apps"},
 {p:"finanzas",d:"2026-10-04",t:"Primera versión: gráficas, presupuesto y asistente"},
 {p:"jetta",d:"2026-10-04",t:"Rediseño del inicio y puntos de revisión"},
 {p:"jetta",d:"2026-10-04",t:"Se vuelve app instalable para iPhone"},
 {p:"hub",d:"2026-10-04",t:"Selector de proyectos con carpetas"}
];
const STATUS={live:["Activo"],future:["Futuro"],done:["Terminado"]};
const $=s=>document.querySelector(s);
const svg=(p,f)=>`<svg viewBox="0 0 24 24" fill="${f?"currentColor":"none"}" stroke="${f?"none":"currentColor"}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON={glass:'<path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9"/>',trend:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',dots:'<circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/>'};
let filters=new Set(),view="folders",sortMode=0;
const SORTS=[["Orden manual",null],["Por avance",(a,b)=>b.progress-a.progress],["Por nombre",(a,b)=>a.name.localeCompare(b.name,"es")]];

function visible(){
  let l=PROJECTS.filter(p=>(!filters.has("live")||p.status!=="done")&&(!filters.has("prio")||p.prio)&&(!filters.has("mine")||p.by==="Diego"));
  if(view==="stats")l=[...l].sort((a,b)=>b.progress-a.progress);
  else if(view==="recent")l=[...l].sort((a,b)=>b.updated.localeCompare(a.updated));
  else if(SORTS[sortMode][1])l=[...l].sort(SORTS[sortMode][1]);
  return l;
}
function render(){
  $("#nLive").textContent=PROJECTS.filter(p=>p.status!=="done").length;
  const l=visible();
  if(view==="stats"){renderStats(l);return}
  if(view==="recent"){renderRecent();return}
  $("#list").innerHTML=l.length?l.map((p,i)=>`<div class="folder${i%3===1?" dark":""}" style="--i:${i}" role="link" tabindex="0" aria-label="${p.name}" data-id="${p.id}">
    <div class="f-top"><div class="tab"><span class="st">${svg(ICON.glass)}${STATUS[p.status][0]}</span><span class="tr">${svg(ICON.trend)}</span></div>
      <div class="by">Creado por <b>${p.by}</b><span class="mini">${p.by[0]}</span></div></div>
    <div class="f-body"><span class="thumb${p.icon?" ico":" soft"}">${p.icon?`<img src="${p.icon}" alt="">`:p.letter}</span>
      <span class="f-main"><b>${p.name}</b><span>${view==="stats"?p.progress+"% de avance":p.desc}</span><span class="prog"><i data-w="${p.progress}"></i></span></span>
      <button class="more" data-more="${p.id}" aria-label="Opciones de ${p.name}">${svg(ICON.dots,1)}</button></div></div>`).join("")
    :`<p class="empty">Ningún proyecto con estos filtros.</p>`;
  grow();
}
const grow=()=>requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll("[data-w]").forEach(i=>i.style.width=Math.max(2,i.dataset.w)+"%")));
/* Vista Avance: resumen de todos los proyectos */
function renderStats(l){
  const live=PROJECTS.filter(p=>p.status==="live"),avg=Math.round(PROJECTS.reduce((a,p)=>a+p.progress,0)/PROJECTS.length);
  const C=2*Math.PI*52;
  $("#list").innerHTML=`<div class="panel" style="--i:0"><div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="12"/><circle class="arc" cx="60" cy="60" r="52" fill="none" stroke="var(--ink)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C*(1-avg/100)}" transform="rotate(-90 60 60)"/></svg><span><b>${avg}%</b>avance total</span></div>
    <div class="kp"><div><b>${PROJECTS.length}</b>proyectos</div><div><b>${live.length}</b>activos</div><div><b>${LOG.length}</b>cambios</div></div></div>
    <div class="panel" style="--i:1;display:block"><h4>Avance por proyecto</h4>${l.map(p=>`<button class="prow" data-id2="${p.id}"><span class="pi">${p.icon?`<img src="${p.icon}" alt="">`:p.letter}</span><span class="pm"><b>${p.name}</b><span class="pb"><i data-w="${p.progress}"></i></span></span><em>${p.progress}%</em></button>`).join("")}</div>`;
  grow();requestAnimationFrame(()=>requestAnimationFrame(()=>{const a=document.querySelector(".arc");if(a)a.style.strokeDashoffset=a.dataset.off}));
}
/* Vista Recientes: bitácora de cambios */
function renderRecent(){
  const P=id=>PROJECTS.find(p=>p.id===id)||{name:"Diapps",letter:"D"};
  $("#list").innerHTML=`<div class="panel" style="--i:0;display:block"><h4>Lo último que cambió</h4><div class="tl">${LOG.map((e,i)=>{const p=P(e.p);return `<button class="te" style="--i:${i}" ${p.href?`data-id2="${p.id}"`:""}><span class="pi">${p.icon?`<img src="${p.icon}" alt="">`:p.letter}</span><span class="pm"><b>${p.name}</b><span>${e.t}</span></span><em>${new Date(e.d+"T12:00").toLocaleDateString("es-MX",{day:"numeric",month:"short"})}</em></button>`}).join("")}</div></div>`;
}

let tt;function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),1800)}
function openSheet(h){$("#sheetBody").innerHTML=h;const s=$("#sheet"),c=$("#scrim");s.hidden=c.hidden=false;document.body.classList.add("lock");requestAnimationFrame(()=>{s.classList.add("on");c.classList.add("on")})}
function closeSheet(){const s=$("#sheet"),c=$("#scrim");if(s.hidden)return;document.body.classList.remove("lock");s.classList.remove("on");c.classList.remove("on");setTimeout(()=>{s.hidden=c.hidden=true},320)}
$("#scrim").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();if(e.key==="Enter"&&e.target.matches(".folder"))e.target.click()});

document.addEventListener("click",e=>{
  const g=s=>e.target.closest(s);let t;
  if(t=g("[data-more]")){e.preventDefault();const p=PROJECTS.find(x=>x.id===t.dataset.more);
    openSheet(`<h3>${p.name}</h3><p>${p.desc}</p><div class="rows"><div><span>Estado</span><span>${STATUS[p.status][0]}</span></div><div><span>Avance</span><span>${p.progress}%</span></div><div><span>Carpeta</span><span><code>/${p.href||p.id+"/"}</code></span></div></div>
      <div class="btns"><button class="btn" data-close>Cerrar</button>${p.href?`<a class="btn dark" href="${p.href}">Abrir</a>`:""}</div>`);return}
  if(t=g(".folder")){const p=PROJECTS.find(x=>x.id===t.dataset.id);e.preventDefault();
    if(!p.href){toast("Próximamente");return}
    t.classList.add("opening");setTimeout(()=>location.href=p.href,170);return}
  if(t=g("[data-close]")){closeSheet();return}
  if(t=g("[data-f]")){const f=t.dataset.f;filters.has(f)?filters.delete(f):filters.add(f);t.setAttribute("aria-pressed",filters.has(f));render();return}
  if(t=g("[data-v]")){view=t.dataset.v;document.querySelectorAll("[data-v]").forEach(b=>b.removeAttribute("aria-current"));t.setAttribute("aria-current","page");render();return}
  if(t=g("[data-id2]")){const p=PROJECTS.find(x=>x.id===t.dataset.id2);if(p&&p.href){t.style.transform="scale(.97)";setTimeout(()=>location.href=p.href,150)}return}
  if(g("#sort")){sortMode=(sortMode+1)%SORTS.length;if(view!=="folders")$('[data-v="folders"]').click();render();toast(SORTS[sortMode][0]);return}
  if(g("#newp")){openSheet(`<h3>Nuevo proyecto</h3><p>Cada proyecto vive en su propia carpeta de este repo, por ejemplo <code>/mi-app/</code>, y aparece aquí como una carpeta.</p><p>Pídeme la app nueva y la agrego al selector. Cuando un proyecto crezca, se puede mover a su propio repo.</p><div class="btns"><button class="btn dark" data-close>Entendido</button></div>`);return}
  if(g("#bell")){openSheet(`<h3>Novedades</h3><div class="rows"><div><span>Mi Jetta MK6</span><span>Rediseño del inicio</span></div><div><span>Mis Finanzas</span><span>Proyecto nuevo</span></div><div><span>Diapps</span><span>Selector de proyectos</span></div></div><div class="btns"><button class="btn dark" data-close>Listo</button></div>`);$("#bell .dot").hidden=true;return}
  if(g("#grid")){openSheet(`<h3>Diapps</h3><p>Repo de pruebas con varias apps. Para instalar una en tu iPhone, ábrela y en Safari toca Compartir y luego <b>Agregar a pantalla de inicio</b>. Cada app se instala con su propio ícono.</p><div class="btns"><button class="btn" data-theme-toggle>${isDark()?"Tema claro":"Tema oscuro"}</button><button class="btn dark" data-close>Cerrar</button></div>`);return}
  if(g("[data-theme-toggle]")){toggleTheme();closeSheet();return}
});

const isDark=()=>document.documentElement.dataset.theme==="dark";
function syncThemeColor(){document.querySelector('meta[name="theme-color"]').content=getComputedStyle(document.documentElement).getPropertyValue("--bg").trim()}
function toggleTheme(){const t=isDark()?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("diapps-theme",t)}catch(e){}syncThemeColor();toast(t==="dark"?"Modo oscuro":"Modo claro")}
addEventListener("storage",e=>{if(e.key==="diapps-theme"&&e.newValue){document.documentElement.dataset.theme=e.newValue;syncThemeColor()}});
syncThemeColor();
const h=new Date().getHours();$("#hi").textContent=h<12?"Buenos días":h<19?"Hola":"Buenas noches";
render();
if("serviceWorker" in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
