<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Diapps</title>
<meta name="description" content="Selector de mis proyectos y apps de prueba">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diapps">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F3">
<script>
/* Tema compartido entre las apps de Diapps: empieza en claro; el modo oscuro se elige en el menú */
(function(){var t="light";try{t=localStorage.getItem("diapps-theme")||localStorage.getItem("jetta6theme")||"light"}catch(e){}document.documentElement.dataset.theme=t})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="shared/desk.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap">
<style>
/* Selector de proyectos: cada proyecto es una carpeta (pestaña con estado + cuerpo con título y avance) */
:root{
  --bg:#F2F2F3; --ink:#141416; --ink2:#7C7C84; --line:#D6D6DA; --chip:#FFFFFF;
  --f1:#DCDCDF; --f1back:#E8E8EA; --f1ink:#141416;
  --f2:#2E2E31; --f2back:#E3E3E6; --f2ink:#FFFFFF;
  --glass:rgba(255,255,255,.55); --glassBorder:rgba(255,255,255,.8); --glassShadow:rgba(20,20,25,.16);
  --lime:#C6EE3A; --scrim:rgba(0,0,0,.3); --sheet:#FFFFFF;
  --font:"Urbanist",-apple-system,"SF Pro Text",system-ui,sans-serif;
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0E0E10; --ink:#F2F2F4; --ink2:#8C8C94; --line:#2C2C31; --chip:#1A1A1D;
  --f1:#232327; --f1back:#18181B; --f1ink:#F2F2F4;
  --f2:#ECECEE; --f2back:#1C1C1F; --f2ink:#141416;
  --glass:rgba(38,38,44,.6); --glassBorder:rgba(255,255,255,.1); --glassShadow:rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.55); --sheet:#1A1A1D;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
button,a,h1{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;-webkit-touch-callout:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.app{max-width:440px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 18px calc(120px + env(safe-area-inset-bottom,0px))}
.press{transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.press:active{transform:scale(.95)}

/* encabezado */
.top{display:flex;align-items:center;gap:8px;padding-top:6px}
.top .sp{flex:1}
.av{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.rb{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.rb svg{width:21px;height:21px}
.rb.line{border:1.5px solid var(--line)}
.rb.fill{background:var(--line)}
.rb .dot{position:absolute;top:14px;right:15px;width:7px;height:7px;border-radius:50%;background:#E5484D}
h1{font-size:44px;font-weight:400;letter-spacing:-.035em;line-height:1.05;margin:20px 0 4px}
h1 b{font-weight:700}
.lead{color:var(--ink);opacity:.75;font-size:15px;margin:0}

/* filtros */
.filters{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:22px}
.chip{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);font-size:14px;white-space:nowrap;font-weight:500;transition:background-color .25s,color .25s,border-color .25s,transform .18s}
.chip b{font-weight:700}
.chip svg{width:16px;height:16px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .avs{display:flex}
.chip .avs i{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.chip[aria-pressed="true"] .avs i{background:var(--bg);color:var(--ink);border-color:var(--ink)}
.actions{display:flex;align-items:center;justify-content:space-between;margin:20px 0 16px}
.newp{display:inline-flex;align-items:center;gap:9px;height:50px;padding:0 20px 0 16px;border-radius:99px;border:1.5px solid var(--ink2);font-size:15.5px;font-weight:500}
.newp svg{width:19px;height:19px}

/* carpetas */
.list{display:flex;flex-direction:column;gap:14px}
.folder{cursor:pointer;--f:var(--f1);--back:var(--f1back);--fi:var(--f1ink);display:block;position:relative;border-radius:30px;background:var(--back);color:var(--fi);transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .3s;animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
.folder.dark{--f:var(--f2);--back:var(--f2back);--fi:var(--f2ink)}
.folder:active{transform:scale(.97)}
.folder.opening{transform:scale(.96);opacity:.6}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
.f-top{display:flex;align-items:flex-end;height:58px}
.tab{position:relative;background:var(--f);border-radius:28px 28px 0 0;height:100%;display:flex;align-items:center;gap:8px;padding:0 12px 0 14px;flex:none;width:52%}
.tab::after{content:"";position:absolute;right:-30px;bottom:0;width:30px;height:30px;background:radial-gradient(circle at 100% 0,transparent 29.5px,var(--f) 30px)}
.st{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px 0 9px;border-radius:99px;border:1.5px solid currentColor;font-size:14.5px;font-weight:600;white-space:nowrap}
.st svg{width:14px;height:14px}
.tr{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--fi);color:var(--f);flex:none}
.tr svg{width:17px;height:17px}
.by{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0 14px 14px 30px;font-size:12.5px;color:var(--ink2);white-space:nowrap;align-self:center}
.folder.dark .by{color:var(--ink2)}
.by b{color:var(--ink);font-weight:600}
.by .mini{width:26px;height:26px;flex:none;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:11.5px;font-weight:700;position:relative}
.f-body{background:var(--f);border-radius:0 30px 30px 30px;display:flex;align-items:center;gap:16px;padding:12px 18px 22px 14px;position:relative;min-height:112px}
.thumb{width:74px;height:74px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;background:var(--fi);color:var(--f);font-size:26px;font-weight:600}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb.ico{display:block;border-radius:22.5%;width:70px;height:70px;margin:2px;box-shadow:0 0 0 1px color-mix(in srgb,var(--fi) 10%,transparent)}
.thumb.soft{background:color-mix(in srgb,var(--fi) 10%,transparent);color:var(--fi)}
.f-main{flex:1;min-width:0;padding-top:8px}
.f-main b{display:block;font-size:19px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-main span{display:block;font-size:13px;opacity:.6;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{position:relative;height:3px;border-radius:99px;background:color-mix(in srgb,var(--fi) 22%,transparent);margin-top:12px;overflow:hidden}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--fi);border-radius:99px;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1) .25s}
.more{position:absolute;top:8px;right:14px;width:40px;height:30px;display:grid;place-items:center;color:var(--fi)}
.more svg{width:20px;height:20px}
.panel{display:flex;align-items:center;gap:18px;background:var(--f1);border-radius:30px;padding:18px;margin-bottom:12px;animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
.panel h4{margin:2px 4px 12px;font-size:17px;font-weight:600}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{width:100%;height:100%}
.ring .arc{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.9,.25,1)}
.ring span{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:12px;color:var(--ink2);font-weight:500}
.ring b{display:block;font-size:30px;color:var(--ink);letter-spacing:-.03em;font-weight:700}
.kp{display:grid;gap:10px;flex:1}
.kp div{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--ink2);font-weight:500}
.kp b{font-size:22px;color:var(--ink);font-weight:700}
.prow,.te{display:flex;align-items:center;gap:12px;width:100%;padding:10px 4px;text-align:left;transition:transform .2s}
.prow+.prow,.te+.te{border-top:1px solid color-mix(in srgb,var(--ink) 8%,transparent)}
.pi{width:40px;height:40px;border-radius:12px;overflow:hidden;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 10%,transparent);font-weight:700}
.pi img{width:100%;height:100%;display:block}
.pm{flex:1;min-width:0}
.pm b{display:block;font-size:15px;font-weight:600}
.pm>span:not(.pb){display:block;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{display:block;height:6px;border-radius:99px;background:color-mix(in srgb,var(--ink) 12%,transparent);margin-top:7px;overflow:hidden}
.pb i{display:block;height:100%;width:0;border-radius:99px;background:var(--ink);transition:width 1.1s cubic-bezier(.2,.9,.25,1) .2s}
.prow em,.te em{font-style:normal;font-weight:700;font-size:14px;flex:none}
.te em{font-weight:500;color:var(--ink2);font-size:12.5px}
.te{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 50ms)}
.empty{text-align:center;color:var(--ink2);padding:40px 0;font-size:14px}

/* navegación inferior */
.nav{position:fixed;left:50%;bottom:max(14px,calc(env(safe-area-inset-bottom,0px) - 4px));transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:99px;z-index:8;background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glassBorder);box-shadow:inset 0 1px 0 var(--glassBorder),0 14px 34px var(--glassShadow)}
.nav button{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;border:1.5px solid color-mix(in srgb,var(--ink) 12%,transparent);color:var(--ink2);transition:background-color .25s,color .25s,transform .18s}
.nav button:active{transform:scale(.92)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:root:not([data-theme="dark"]) .nav button[aria-current="page"]{background:#fff;color:#141416;border-color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.12)}

/* hoja inferior */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:9;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-width:440px;margin:0 auto;background:var(--sheet);border-radius:30px 30px 0 0;padding:10px 22px calc(26px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:4px 0 6px}
.sheet p{margin:6px 0;color:var(--ink2)}
.rows{background:var(--bg);border-radius:20px;padding:2px 16px;margin-top:14px}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;font-size:15px}
.rows div+div{border-top:1px solid var(--line)}
.rows span:first-child{color:var(--ink2)}
.rows span:last-child{font-weight:600;text-align:right}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;height:52px;border-radius:99px;display:grid;place-items:center;font-weight:600;font-size:16px;border:1.5px solid var(--line)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg);padding:2px 6px;border-radius:6px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:20;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* ---------- resumen del día (celular) ---------- */
.today{margin-top:14px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:22px;background:var(--chip);text-decoration:none;color:inherit;min-width:0;animation:wIn2 .45s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--i) * 50ms)}
@keyframes wIn2{from{opacity:0;transform:translateY(8px)}}
.tcard:first-child{grid-column:span 2}
.tcard .th{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.tcard .th img{width:22px;height:22px;border-radius:7px}
.tcard b{font-size:22px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard small{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard em{font-style:normal;font-size:12px;font-weight:700;margin-top:6px;color:color-mix(in srgb,var(--tc) 70%,var(--ink))}
.sech{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}.sech h2{margin:0;font-size:20px;letter-spacing:-.02em}
/* ---------- mega dashboard de escritorio ---------- */
.deskwrap{display:none}
@media (min-width:1100px){
  body.desk .app,body.desk .nav{display:none}
  body.desk .deskwrap{display:block;padding:0 28px 40px;max-width:1800px;margin:0 auto}
  .dkbar .av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800}
  .dkbar .dtab img{width:20px;height:20px;border-radius:6px}
  .dkbar a.dtab{text-decoration:none}
  .mega{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;grid-auto-flow:dense}
  .w{background:var(--chip);border-radius:28px;padding:18px 20px;min-width:0}
  .mega.anim .w{animation:wIn .5s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--i) * 45ms)}
  @keyframes wIn{from{opacity:0;transform:translateY(12px)}}
  .w.span2{grid-column:span 2}.w.tall{grid-row:span 2}
  .w header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .w header h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;flex:1}
  .w .wi img{width:30px;height:30px;border-radius:9px;display:block}
  .w .wo{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;text-decoration:none;color:var(--ink2);padding:6px 10px;border-radius:99px;background:var(--bg)}
  .w .wo svg{width:14px;height:14px}.w .wo:hover{color:var(--ink)}
  .w h4{margin:14px 0 8px;font-size:12.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
  .tag{font-style:normal;font-size:11px;font-weight:700;background:var(--lime);color:#26300a;padding:2px 8px;border-radius:99px;vertical-align:3px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
  .kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis.k3 b{font-size:20px}
  .kpis>div{background:var(--bg);border-radius:18px;padding:12px 14px;min-width:0}
  .kpis small,.accs small,.potg small{display:block;font-size:12px;color:var(--ink2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpis b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
  .kpis em{font-style:normal;font-size:12px;font-weight:700}
  .dn{color:#E5484D}.upc{color:#1F9D55}.warnc{color:#C98A00}.muted2{color:var(--ink2);font-weight:600}
  .wcols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .wbars{display:flex;align-items:flex-end;gap:5px;height:110px}
  .wbars span{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
  .wbars i{display:block;width:100%;border-radius:6px;background:color-mix(in srgb,var(--ink) 16%,transparent)}
  .wbars span.on i{background:var(--ink)}
  .wbars small{font-size:10px;color:var(--ink2);height:12px}
  .accs,.potg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .potg{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .accs span,.potg span{background:var(--bg);border-radius:14px;padding:8px 10px;min-width:0}
  .accs b,.potg b{font-size:15px;font-variant-numeric:tabular-nums}
  .hb{display:grid;grid-template-columns:100px 1fr 74px;align-items:center;gap:10px;font-size:13.5px;margin:7px 0}
  .hb i{height:10px;border-radius:9px;background:linear-gradient(90deg,var(--ink) var(--w),color-mix(in srgb,var(--ink) 8%,transparent) var(--w))}
  .hb b{text-align:right;font-variant-numeric:tabular-nums}
  .rows2>div{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
  .rows2>div:first-child{border-top:0}
  .rows2 span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .rows2 small{display:block;font-size:12px;color:var(--ink2);font-weight:500}
  .rows2 b{font-variant-numeric:tabular-nums;white-space:nowrap}
  .rt{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:center}
  .ringw{position:relative;width:120px;flex:none}.ringw svg{width:120px;height:120px}
  .ringw span{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:12px;color:var(--ink2)}.ringw b{font-size:26px;color:var(--ink)}
  .hl{flex:1;min-width:230px;display:flex;flex-direction:column;gap:8px}
  .hl>div{display:grid;grid-template-columns:10px 1fr 70px;align-items:center;gap:10px;font-size:14px;font-weight:600}
  .hl>div>i{width:10px;height:10px;border-radius:50%}
  .hl small{display:block;font-size:11.5px;color:var(--ink2);font-weight:500}
  .pb2{display:block;height:7px;border-radius:9px;background:var(--line);overflow:hidden}.pb2 i{display:block;height:100%;border-radius:9px}
  .gauge{display:block;height:6px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}.gauge i{display:block;height:100%;background:var(--ink)}
  .warns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.warns span{background:color-mix(in srgb,#E5484D 14%,var(--bg));color:#C2292E;font-weight:700;font-size:13px;padding:6px 10px;border-radius:99px}
  .wok{margin:10px 0 0;font-weight:600;color:#1F9D55}
  .cz h4 small{text-transform:none;font-weight:600;letter-spacing:0}
  .chips2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips2 span{background:var(--bg);border-radius:12px;padding:6px 10px;font-size:12.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .np{display:flex;gap:12px;align-items:center}.np img,.np .npx{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:14px;flex:none;background:var(--bg);display:grid;place-items:center;font-size:26px}
