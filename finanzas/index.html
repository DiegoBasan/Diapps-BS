<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mis Finanzas</title>
<meta name="description" content="Gastos, presupuesto y ahorro personal">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDEDEF">
<script>
/* Tema compartido entre las apps de Diapps: empieza en claro; el modo oscuro se elige en el menú */
(function(){var t="light";try{t=localStorage.getItem("diapps-theme")||"light"}catch(e){}document.documentElement.dataset.theme=t})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<script src="../shared/ia.js"></script>
<script src="../shared/nube.js"></script>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../shared/desk.css">
<style>
/* Mismo lenguaje que Mi Jetta y el selector: Urbanist, fondo gris claro, tarjetas blancas redondeadas,
   barra de vidrio con etiquetas y hojas inferiores. Las gráficas usan los tokens, así funcionan en claro y oscuro. */
:root{
  --bg:#EDEDEF; --card:#FFFFFF; --card2:#F4F4F5; --line:#E4E4E7; --line2:#D3D3D8;
  --ink:#111113; --ink2:#85858C; --ink3:#B4B4BA;
  --up:#23A05C; --down:#E5484D; --lime:#C6EE3A;
  --glass:rgba(255,255,255,.62); --glassBorder:rgba(255,255,255,.8); --glassShadow:rgba(30,32,40,.14);
  --scrim:rgba(0,0,0,.32); --tipShadow:0 10px 30px rgba(0,0,0,.12);
  --font:"Urbanist",-apple-system,"SF Pro Text",system-ui,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121214; --card:#1E1E21; --card2:#27272B; --line:#2E2E33; --line2:#3B3B42;
  --ink:#F3F3F4; --ink2:#8E8E96; --ink3:#56565D;
  --up:#57E39A; --down:#FF6166;
  --glass:rgba(40,40,46,.6); --glassBorder:rgba(255,255,255,.1); --glassShadow:rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.55); --tipShadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button,.nav,.lbl,h1,h2,.cc{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;-webkit-touch-callout:none}
input{font:inherit;color:inherit}
input,textarea{font-size:16px}
a{color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
.app{max-width:440px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 18px calc(118px + env(safe-area-inset-bottom,0px))}
.screen{animation:in .38s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.press{transition:transform .16s cubic-bezier(.2,.8,.2,1)}
.press:active{transform:scale(.95)}

/* encabezado (igual que Mi Jetta) */
.bar{display:flex;align-items:center;gap:8px;padding:6px 0 4px}
.bar .sp{flex:1}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;text-align:left}
.brand img{width:36px;height:36px;border-radius:10px;display:block}
.brand small{display:block;font-size:12px;font-weight:500;color:var(--ink2);line-height:1.1}
.rb{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none;position:relative}
.rb svg{width:20px;height:20px}
.rb .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--down);border:2px solid var(--card)}
h1{font-size:40px;font-weight:600;letter-spacing:-.035em;line-height:1.05;margin:16px 0 0}
.subttl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 4px;color:var(--ink2);font-size:14px;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--card);color:var(--ink);font-weight:600;font-size:13.5px}
.chip.ok{background:color-mix(in srgb,var(--lime) 50%,transparent);color:#26300a}
:root[data-theme="dark"] .chip.ok{color:var(--lime)}
.chip.bad{background:color-mix(in srgb,var(--down) 16%,transparent);color:var(--down)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}

/* tarjetas de contenido */
.card{background:var(--card);border-radius:26px;padding:18px;margin-top:14px}
.card.flat{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
h2{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
.ey{font-size:12px;color:var(--ink2);font-weight:500}
.pill{height:32px;padding:0 13px;border-radius:99px;background:var(--card2);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink);white-space:nowrap}
.pill svg{width:14px;height:14px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lbl{font-size:12.5px;color:var(--ink2);font-weight:500}
.muted{color:var(--ink2)}

/* buscador */
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 8px 0 16px;border-radius:99px;background:var(--card);margin-top:16px}
.search svg{width:18px;height:18px;color:var(--ink2);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none}
.search input::placeholder{color:var(--ink3)}
.kbd{width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--ink2);font-size:13px;font-weight:600}

/* gráfica de velas */
.tb{display:flex;align-items:center;gap:6px;padding:14px 14px 4px;flex-wrap:wrap}
.tb .sp{flex:1}
.tok{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;margin-right:4px}
.tok i{width:30px;height:30px;border-radius:10px;background:var(--ink);color:var(--card);display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:700}
.seg2{display:flex;background:var(--card2);border-radius:99px;padding:3px}
.seg2 button{height:28px;min-width:38px;padding:0 10px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--ink2);display:grid;place-items:center;transition:background-color .2s,color .2s}
.seg2 button svg{width:16px;height:16px}
.seg2 button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chart{display:block;width:100%;height:auto}
.foot{display:flex;justify-content:space-between;padding:12px 18px 16px;font-size:13px;color:var(--ink2)}
.foot b{color:var(--ink)}

/* estadísticas */
.stats{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;margin-bottom:14px}
.stats .v{font-size:21px;font-weight:600;margin-top:2px;letter-spacing:-.02em;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12.5px;color:var(--ink2);font-weight:500}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-.5px}

/* movimientos */
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:12px 18px;text-align:left}
.tx+.tx{border-top:1px solid var(--line)}
.ci{width:42px;height:42px;border-radius:14px;background:var(--card2);display:grid;place-items:center;flex:none}
.ci.cc2{background:color-mix(in srgb,var(--cc) 20%,var(--card));color:color-mix(in srgb,var(--cc) 80%,var(--ink))}
.dotc{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.hero2{display:flex;gap:10px;margin-top:14px}
.hero2 button{flex:1;text-align:left;background:var(--card);border-radius:22px;padding:14px 16px;min-width:0}
.hero2 small{display:block;font-size:12.5px;color:var(--ink2);font-weight:600}
.hero2 b{display:block;font-size:27px;font-weight:700;letter-spacing:-.03em;margin-top:2px;white-space:nowrap}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;background:var(--card);border-radius:20px;font-size:12.5px;font-weight:700}
.qa span{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--qc);color:#fff}
:root[data-theme="dark"] .qa button:first-child span{background:#fff;color:#111}
.qa svg{width:20px;height:20px}
.wkcard{padding:16px 18px}.wkcard h2 small{white-space:nowrap}
.wbar{height:10px;border-radius:9px;background:var(--card2);overflow:hidden}.wbar i{display:block;height:100%;border-radius:9px;transition:width .6s}
.search.in{margin:10px 18px 4px}
.stack{display:flex;gap:3px;height:14px;border-radius:8px;overflow:hidden;margin:14px 0 6px}.stack i{display:block;min-width:4px}
.catl{display:flex;flex-direction:column;margin:6px -6px 0}
.catl button{display:flex;align-items:center;gap:12px;padding:9px 6px;text-align:left;border-radius:14px}
.catl .ci{width:36px;height:36px;border-radius:12px}.catl .ci svg{width:18px;height:18px}
.catl .t{flex:1;min-width:0}.catl b{display:block;font-size:14.5px;font-weight:600}.catl small{display:block;font-size:12px;color:var(--ink2)}
.catl .a{text-align:right}.catl .a small.down{color:var(--down)}.catl .a small.up{color:var(--up)}
.ci svg{width:20px;height:20px}
.tx .t{flex:1;min-width:0}
.tx b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tx .a{font-size:15.5px;font-weight:600;text-align:right;white-space:nowrap}
.tx .a small{justify-content:flex-end}
.empty{padding:26px 18px;text-align:center;color:var(--ink2);font-size:14px}

/* presupuesto */
.periods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.periods .v{font-size:20px;font-weight:600;margin:2px 0 3px;letter-spacing:-.02em}
.chg{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600}
.chg svg{width:12px;height:12px}
.grid{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.grid i{aspect-ratio:1;border-radius:3px;background:var(--card2);animation:pop .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k) * 6ms)}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
.folders{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fold{display:flex;align-items:center;gap:10px;height:56px;padding:0 14px;border-radius:20px;background:var(--card);text-align:left;min-width:0}
.fold .fi{width:30px;height:30px;border-radius:10px;background:var(--card2);display:grid;place-items:center;flex:none}
.fold svg{width:16px;height:16px}
.fold span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:600}
.fold em{font-style:normal;font-size:12px;font-weight:600}

/* cartera de tarjetas */
.wallet{position:relative;margin-top:4px}
.wallet>button{display:block;width:100%;position:relative;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.wallet>button:not(:last-child){margin-bottom:calc(-63.05% + 50px)}
.wallet>button:not(:last-child):active{transform:translateY(-8px)}
.wallet>button:last-child{animation:lift .5s cubic-bezier(.2,.8,.2,1)}
@keyframes lift{from{transform:translateY(-18px)}}
.cc{position:relative;width:100%;aspect-ratio:1.586;border-radius:18px;overflow:hidden;color:#fff;container-type:inline-size;box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 8px 24px rgba(0,0,0,.16);display:block;text-align:left}
.cc .brandmark{position:absolute;left:7%;top:9%;font-weight:600;font-size:10.5cqw;letter-spacing:.01em;line-height:1}
.cc .digits{position:absolute;left:7%;bottom:9%;font-size:5.6cqw;font-weight:500;letter-spacing:.06em}
.cc .digits span{letter-spacing:.2em;margin-right:.4em}
.cc .kind{position:absolute;right:7%;top:10%;font-size:4.4cqw;font-weight:600;opacity:.85;display:flex;align-items:center;gap:2cqw}
.cc .kind svg{width:5cqw;height:5cqw}
.cc .mc{position:absolute;right:7%;bottom:8%;width:20cqw;height:12.5cqw}
.cc .mc i{position:absolute;top:0;width:12.5cqw;height:12.5cqw;border-radius:50%}
.cc .mc i:first-child{left:0;background:#EB001B}
.cc .mc i:last-child{right:0;background:#F79E1B;mix-blend-mode:normal;opacity:.92}
.cc .visa{position:absolute;right:7%;bottom:7.5%;font-size:11cqw;font-weight:800;font-style:italic;letter-spacing:-.02em;background:linear-gradient(180deg,#fff,#c9ccd3 55%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.cc-bbva{background:linear-gradient(160deg,#2F5597 0%,#1E3F80 45%,#16336C 100%)}
.cc-bbva .peak{position:absolute;left:32%;top:24%;width:34%;height:55%}
.cc-bbvaa{background:linear-gradient(160deg,#A4E3E8 0%,#6CC3CD 50%,#4FA8B5 100%)}
.cc-bbvaa .peak{position:absolute;left:32%;top:24%;width:34%;height:55%;opacity:.7}
.cc-nu{background:radial-gradient(120% 120% at 85% 60%,#B15CFF 0%,#8A3FD8 40%,#5E2B9E 100%)}
.cc-nu .brandmark{font-size:14cqw;font-weight:700;letter-spacing:-.04em;top:11%}
.cc-mp{background:#0F0F10}
.cc-mp .words{position:absolute;left:-1%;top:4%;font-weight:800;font-size:23cqw;line-height:.86;letter-spacing:-.04em;background:linear-gradient(100deg,#4A4A4C 0%,#3A3A3C 35%,#1F1F21 60%,#141416 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.cc-mp .chipx{position:absolute;left:44%;top:13%;width:12cqw;height:9.5cqw;border-radius:1.8cqw;background:linear-gradient(135deg,#6E6E70,#3E3E40);box-shadow:inset 0 0 0 .4cqw rgba(255,255,255,.12)}
.cc-mp .kind{top:auto;bottom:30%;right:7%;color:#bbb}
.cc-mp .wal{position:absolute;left:7%;bottom:30%;font-size:4.4cqw;font-weight:700;color:#6a6a6c}
.cc-cash{background:linear-gradient(160deg,#3B4B3E,#24302A)}
.cc-save{background:linear-gradient(160deg,#C6EE3A,#8FC21A);color:#1c2408}
.cc .bal{position:absolute;left:7%;top:42%;font-size:4.4cqw;opacity:.85}
.cc .bal b{display:block;font-size:9cqw;font-weight:700;opacity:1;letter-spacing:-.02em}
.mini{display:inline-block;width:22px;height:14px;border-radius:3.5px;flex:none;position:relative;overflow:hidden}
.mini::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.ver{text-align:center;font-size:11.5px;font-weight:600;color:var(--ink3,var(--ink2));margin:16px 0 4px;letter-spacing:.02em}
.setupban{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:color-mix(in srgb,var(--lime,#C6EE3A) 35%,var(--card))}
.setupban b{display:block;font-size:15px}.setupban small{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px}
.lockv{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center}
.lockv img{width:72px;height:72px;border-radius:18px;margin-bottom:8px}.lockv h2{margin:0;font-size:24px}.lockv p{margin:0 0 18px;color:var(--ink2)}.lockv .btn{flex:none;width:min(280px,100%)}
body.locked{overflow:hidden}
.lnk{font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:14px;color:var(--ink2)}
@media (min-width:1100px){
  body.desk .app{max-width:none;padding:0 28px 40px}
  body.desk .fgrid{grid-template-columns:repeat(auto-fill,minmax(318px,1fr))}
  body.desk .dcol{background:color-mix(in srgb,var(--card) 35%,transparent);border-radius:30px;padding:6px 14px 14px;scroll-margin-top:80px}
  body.desk .dcol .bar{display:none}
  body.desk .dcol>h1{font-size:28px;margin-top:10px}
  body.desk .minis{margin:16px -14px 0;padding:2px 14px 6px}
  body.desk .dchat{position:fixed;z-index:6;top:76px;right:24px;bottom:96px;width:400px;overflow-y:auto;background:var(--card);border-radius:28px;padding:0 18px 16px;box-shadow:0 20px 60px rgba(0,0,0,.12);transform:translateX(calc(100% + 40px));transition:transform .35s cubic-bezier(.2,.9,.25,1)}
  body.desk.chatopen .dchat{transform:none}
  body.desk .dchat .chatTop{margin:0 -18px;padding:12px 18px;background:var(--card)}
  body.desk .dchat .chatTop [data-go="home"]{visibility:hidden}
  body.desk #compose{left:auto;right:24px;transform:none;width:400px;bottom:24px;display:none}
  body.desk.chatopen #compose{display:block}
}
@media (min-width:1640px){
  body.desk .app{padding-right:452px}
  body.desk .dchat{transform:none}
  body.desk #compose{display:block}
  body.desk [data-go="chat"].dtab{display:none}
}
.wsel{margin-bottom:12px;justify-content:space-between}.wsel button{flex:1;min-width:0;padding:0}
.projbig{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}.projbig b{font-size:30px;font-weight:700;letter-spacing:-.03em}.projbig .lbl{width:100%}
.warnl{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:13px;background:color-mix(in srgb,var(--down) 10%,var(--card2));border-radius:16px;padding:10px 12px}
.field textarea{width:100%;min-height:120px;border:0;border-radius:16px;background:var(--card2);padding:12px 14px;outline:none;font:500 13px ui-monospace,Menlo,monospace;color:var(--ink);resize:vertical}
.pots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pot{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--card2);border-radius:18px;padding:12px 13px;min-width:0;animation:rise2 .5s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--i) * 30ms)}
.pot .pn{font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pot b{font-size:19px;font-weight:700;letter-spacing:-.02em}
.pot small{font-size:11px;color:var(--ink2);font-weight:500}
.pb{display:block;height:5px;border-radius:9px;background:var(--line);margin:6px 0 3px;overflow:hidden}.pb i{display:block;height:100%;border-radius:9px;background:var(--ink)}
.potmini{display:block;width:100%;text-align:left}.potmini .chev{width:9px;height:14px;color:var(--ink2)}
.pic{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--pc);color:#fff;font-size:12px;font-weight:800;font-style:normal;flex:none;text-transform:uppercase}
.potrow span{display:flex!important;flex-direction:column;gap:3px}.potrow .pic{width:22px;height:22px;font-size:10.5px;margin-bottom:3px}
.pot .pn{display:flex;align-items:center;gap:7px}
.pdot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;margin-right:2px}
.potrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.potrow span{background:var(--card2);border-radius:14px;padding:8px 10px;min-width:0}
.potrow b{display:block;font-size:15px;font-weight:700}.potrow small{display:block;font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.splitl label{display:flex;align-items:center;gap:12px;padding:10px 16px;font-size:15px;font-weight:500}
.splitl input{width:96px;height:40px;border:0;border-radius:12px;background:var(--card);padding:0 10px;text-align:right;font-size:16px;outline:none}

function candles(){
  const n={"7D":7,"1M":30,"3M":91}[range],bucket=range==="3M"?7:1,end=today(),start=addDays(end,-n+1);
  // tu dinero en Mercado Pago: libre + apartados (apartar o sacar de un apartado no cambia el total)
  let bal=balances(addDays(start,-1)).mp+potTotalAt(addDays(start,-1));
  const byDay={};S.tx.filter(t=>t.d>=start&&t.d<=end).forEach(t=>(byDay[t.d]=byDay[t.d]||[]).push(t));
  const out=[];let cur=null,d=start,i=0;
  while(d<=end){
    if(i%bucket===0){cur={d,o:bal,h:bal,l:bal,c:bal};out.push(cur)}
    for(const t of (byDay[d]||[]).sort((a,b)=>(a.type==="in"?0:1)-(b.type==="in"?0:1))){const dl=t.type==="move"?(t.to==="mp"?t.a:t.acc==="mp"?-t.a:0):t.acc!=="mp"?0:t.type==="in"?t.a:-t.a;if(!dl)continue;bal+=dl;cur.h=Math.max(cur.h,bal);cur.l=Math.min(cur.l,bal)}

  }
  return out;
}

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" font-family="Urbanist,sans-serif" font-weight="600"><defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--ink)" stop-opacity=".22"/><stop offset="1" stop-color="var(--ink)" stop-opacity="0"/></linearGradient></defs><style>@keyframes draw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}</style>${g}${body}

/* ======================= Apartados de Mercado Pago =======================
   Cada apartado tiene saldo propio. Apartar saca dinero del disponible de Mercado Pago y retirar lo regresa.
   Saldo = base (lo que confirmaste) + movimientos posteriores. Todo vive solo en este iPhone. */
const P=()=>S.pots;
const EMOJI=/[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}️‍]/gu;
const potClean=n=>String(n).replace(EMOJI,"").replace(/\s+/g," ").trim();
const potBase=n=>potClean(n).replace(/\s+\d[\d,.]*$/,"").trim()||potClean(n);
const potKey=n=>{let k=norm(potBase(n));let i=0;while(P().alias[k]&&i++<9)k=P().alias[k];return k};
function potEnsure(raw,d){const k=potKey(raw),it=P().items[k];const plan=+(potClean(raw).match(/\s(\d[\d,.]*)$/)||[])[1]?.replace(/,/g,"")||0;
  if(!it)P().items[k]={n:potBase(raw),plan,base:0,baseSeq:0,created:d||today()};else if(plan&&!it.planSet)it.plan=plan;return k}
function potMv(k,a,d,t,extra={}){const m={s:++P().seq,d,k,a:Math.round(a*100)/100,t,...extra};P().mv.push(m);return m}
const potBal=k=>{const it=P().items[k];if(!it)return 0;return it.base+sum(P().mv.filter(m=>m.k===k&&m.s>it.baseSeq&&!(it.baseDate&&m.ref&&m.d<=it.baseDate)),m=>m.a)};
function potSetBal(k,v,d=today()){const it=P().items[k];it.base=v;it.baseSeq=P().seq;it.baseDate=d}
const potList=()=>Object.keys(P().items).sort((a,b)=>potBal(b)-potBal(a));
const potTotal=()=>sum(potList(),potBal);
/* Total apartado en una fecha pasada: el de hoy menos todo lo que entró/salió de los apartados después de esa fecha (incluye historial importado) */
const potTotalAt=d=>potTotal()-sum(P().mv.filter(m=>P().items[m.k]&&m.d>d&&(m.ref||m.s>P().items[m.k].baseSeq)),m=>m.a);
const POTC=["#4DA3FF","#FF8A65","#3DD68C","#9B7BFF","#FFB020","#FF6FA8","#22C3D6","#E879F9","#F59E0B","#2BBF8A","#EF5350","#8D99AE","#A3C93A"];
const potColor=k=>{const it=P().items[k];if(it&&it.c)return it.c;const i=Object.keys(P().items).sort().indexOf(k);return POTC[(i<0?0:i)%POTC.length]};
/* Último reparto: el día más reciente con depósitos a 3 o más apartados */
function lastSplit(){const by={};P().mv.filter(m=>m.t==="dep").forEach(m=>{(by[m.d]=by[m.d]||[]).push(m)});
  const d=Object.keys(by).filter(x=>new Set(by[x].map(m=>m.k)).size>=3).sort().pop();if(!d)return null;
  const per={};by[d].forEach(m=>per[m.k]=(per[m.k]||0)+m.a);return {d,per,total:sum(Object.values(per),v=>v)}}
/* Lo típico que apartas a cada uno por depósito (mediana de los últimos 6 depósitos) */
function potTypical(k){const l=P().mv.filter(m=>m.k===k&&m.t==="dep").slice(-6).map(m=>m.a).sort((a,b)=>a-b);return l.length?l[Math.floor(l.length/2)]:0}

/* --- lector de .xlsx sin librerías (zip + XML) --- */
async function readXlsx(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf),files={};
  let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error("no es un .xlsx");
  let p=dv.getUint32(e+16,true);const n=dv.getUint16(e+10,true),td=new TextDecoder();
  for(let i=0;i<n;i++){const method=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;const st=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);files[name]={method,data:u8.subarray(st,st+cs)}}
  const txt=async f=>{if(!f)return "";if(f.method===0)return td.decode(f.data);const st=new Blob([f.data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));return td.decode(await new Response(st).arrayBuffer())};
  const X=s=>new DOMParser().parseFromString(s,"application/xml");
  const ss=[...X(await txt(files["xl/sharedStrings.xml"])).getElementsByTagName("si")].map(si=>[...si.getElementsByTagName("t")].map(t=>t.textContent).join(""));
  const sheet=Object.keys(files).filter(f=>/^xl\/worksheets\/sheet\d+\.xml$/.test(f)).sort()[0];
  const col=r=>{let c=0;for(const ch of r.replace(/\d+/g,""))c=c*26+ch.charCodeAt(0)-64;return c-1};
  return [...X(await txt(files[sheet])).getElementsByTagName("row")].map(row=>{const out=[];for(const c of row.getElementsByTagName("c")){const t=c.getAttribute("t"),v=c.getElementsByTagName("v")[0]?.textContent??"";
    out[col(c.getAttribute("r")||"A")]=t==="s"?ss[+v]:t==="inlineStr"?[...c.getElementsByTagName("t")].map(x=>x.textContent).join(""):v}return out});
}
function readCsv(text){return text.replace(/^﻿/,"").split(/\r?\n/).map(l=>{const o=[];let cur="",q=false;for(const ch of l){if(ch==='"')q=!q;else if((ch===","||ch===";")&&!q){o.push(cur);cur=""}else cur+=ch}o.push(cur);return o})}

/* --- estado de cuenta de Mercado Pago → movimientos y apartados --- */
const MP_CAT=[[/petro ?7|gasol|\bgas\b|pemex|shell|oxxo gas|bp\b/,"auto"],[/kfc|carls|domino|chili|pizz|taco|krispy|dairy|starbucks|burger|mcdonald|sushi|cafe|restaur|comida|montados|wings|subway|little caesar/,"comida"],
  [/farmacia|botica|similar|bio ?health|doctor|hospital|dental|gym|gimnasio/,"salud"],[/oxxo|7.?eleven|walmart|soriana|heb|costco|chedraui|bodega|super/,"super"],
  [/uber|didi|cabify|metro|taxi/,"transporte"],[/netflix|spotify|apple|icloud|youtube|disney|hbo|prime|chatgpt|claude/,"subs"],[/cine|cinepolis|cinemex|shows|concierto|boletos|ticket|lives/,"ocio"],
  [/credito|crédito|deuda|mensualidad|tarjeta/,"deuda"],[/home depot|steren|telec|playera|souvenir|amazon|mercado ?libre|liverpool|coppel|paypal|cuponopolis|shein|ropa/,"compras"]];
const mpCat=t=>{const n=norm(t);for(const [re,c] of MP_CAT)if(re.test(n))return c;return "otros"};
const nice=s=>s.toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
function parseMP(rows){
  const h=rows.findIndex(r=>r&&r.some(c=>/RELEASE_DATE/i.test(c||"")));if(h<0)throw new Error("no parece un estado de cuenta de Mercado Pago");
  const H=rows[h].map(c=>String(c||"").toUpperCase()),ix=n=>H.indexOf(n),num=v=>parseFloat(String(v||"0").replace(/[,$\s]/g,""))||0;
  const hr=rows.findIndex(r=>r&&r.some(c=>/FINAL_BALANCE/i.test(c||""))),fi=hr>=0?rows[hr].findIndex(c=>/FINAL_BALANCE/i.test(c||"")):-1,head=rows[hr+1]||[];
  const list=rows.slice(h+1).filter(r=>r&&r[ix("RELEASE_DATE")]).map(r=>{const [d,m,y]=String(r[ix("RELEASE_DATE")]).split(/[-/]/);
    return {d:`${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`,t:String(r[ix("TRANSACTION_TYPE")]||"").trim(),ref:String(r[ix("REFERENCE_ID")]||""),a:num(r[ix("TRANSACTION_NET_AMOUNT")]),bal:num(r[ix("PARTIAL_BALANCE")])}});
  return {list,final:fi>=0?num(head[fi]):null}
}
/* Convierte el estado de cuenta. Devuelve un resumen de lo importado */
function importMP(list){
  const r={tx:0,mv:0,skip:0,dup:0,from:null,to:null},refs=new Set(P().refs);
  const own=new Set(list.filter(x=>/^Transferencia recibida /i.test(x.t)).map(x=>norm(x.t.replace(/^Transferencia recibida /i,"")).split(" ")[0]));
  let stack=[],day=null;const seen=new Map();
  for(const x of list){
    // Mercado Pago repite la referencia en movimientos distintos: la llave incluye tipo, monto y fecha
    const key=`${x.ref}|${x.d}|${x.t}|${x.a}`;if(seen.has(key))seen.set(key,seen.get(key)+1);else seen.set(key,1);const kk=key+"#"+seen.get(key);
    if(refs.has(kk)){r.dup++;continue}refs.add(kk);P().refs.push(kk);
    if(day!==x.d){stack=[];day=x.d}r.from=r.from&&r.from<x.d?r.from:x.d;r.to=r.to&&r.to>x.d?r.to:x.d;
    const T=x.t,a=Math.abs(x.a);let m;
    if(/^ganancia|^rendimiento/i.test(T)){r.skip++;continue}        // rendimientos de la inversión: se ignoran
    if(m=T.match(/^(Monto apartado|Apartado programado|Apartado por gastos)\s+(.+)$/i)){const k=potEnsure(m[2],x.d);potMv(k,a,x.d,/por gastos/i.test(m[1])?"auto":"dep",{ref:x.ref});r.mv++;continue}
    if(m=T.match(/^Monto retirado\s+(.+)$/i)){const k=potEnsure(m[1],x.d);potMv(k,-a,x.d,"wd",{ref:x.ref});stack.push({k,a});r.mv++;continue}
    const add=o=>{S.tx.push({id:S.nid++,d:x.d,ref:x.ref,src:"mp",...o});r.tx++};
    if(m=T.match(/^Transferencia enviada\s+(.+)$/i)){const who=m[1].trim(),first=norm(who).split(" ")[0];
      if(own.has(first)){addMove({d:x.d,a,acc:"mp",to:/\bnu\b/i.test(who)?"nu":"bbvaa",note:/\bnu\b/i.test(who)?"A Nu":"A BBVA",src:"mp",ref:x.ref},r);continue}
      add({type:"out",cat:"otros",a,acc:"mp",note:"Transferencia a "+nice(who),pot:take(a)});continue}
    if(m=T.match(/^Devoluci[oó]n de transferencia enviada\s+(.+)$/i)){const first=norm(m[1]).split(" ")[0];
      add(own.has(first)?{type:"move",cat:"move",a,acc:/\bnu\b/i.test(m[1])?"nu":"bbvaa",to:"mp",note:"Devolución de transferencia"}:{type:"in",cat:"extra",a,acc:"mp",note:"Devolución de transferencia"});continue}
    // lo que te mandas desde BBVA es una transferencia entre tus cuentas; el ingreso real es la nómina en BBVA
    if(m=T.match(/^Transferencia recibida\s+(.+)$/i)){addMove({d:x.d,a,acc:"bbvaa",to:"mp",note:"De BBVA",src:"mp",ref:x.ref},r);continue}
    if(x.a>0){add({type:"in",cat:"extra",a,acc:"mp",note:/cashback/i.test(T)?"Cashback":/devoluci/i.test(T)?T.replace(/^Devoluci[oó]n de pago\s*/i,"Devolución "):T});continue}
    const note=T.replace(/^Pago\s*/i,"").replace(/^Mercadopago \*/i,"").replace(/^Dlo\*/i,"").replace(/^Bzi\*/i,"").replace(/^Paypal \*/i,"PayPal ").trim()||"Pago";
    add({type:"out",cat:mpCat(T),a,acc:"mp",note:nice(note),pot:take(a)});
  }
  // gasto pagado con lo que acabas de retirar de un apartado ese mismo día (el retiro más reciente primero)
  function take(a){let left=a,k=null;while(left>.009&&stack.length){const top=stack[stack.length-1];k=k||top.k;const u=Math.min(top.a,left);top.a-=u;left-=u;if(top.a<.009)stack.pop()}return k||undefined}
  return r;
}
/* Transferencia entre tus cuentas; si el otro estado de cuenta ya la trajo (mismo monto, mismas cuentas, ±3 días) no se repite */
function addMove(o,r){const d0=parse(o.d);
  const dup=S.tx.find(t=>t.type==="move"&&t.acc===o.acc&&t.to===o.to&&Math.abs(t.a-o.a)<.01&&(t.src||"")!==o.src&&!t.pair&&Math.abs(parse(t.d)-d0)<=3*864e5);
  if(dup){dup.pair=o.src;r.dup++;return}S.tx.push({id:S.nid++,type:"move",cat:"move",...o});r.tx++}
/* Estado de cuenta de BBVA (débito) ya leído del PDF → movimientos */
const BANK_CAT=[[/nayax|snack|comedor|wendy|subway|macaron|bakery|fritanga|ganbare|cafe|tortas?\b|taco|pizza|burger|kfc|carls|domino|chili|starbucks|restaur|sushi/,"comida"],[/cinemex|cinepolis|bowl|boliche|bar\b|antro|concierto|boletos/,"ocio"],[/lime|uber|didi|metro|taxi/,"transporte"]];
const bankCat=t=>{const n=norm(t);for(const [re,c] of BANK_CAT)if(re.test(n))return c;return mpCat(t)};
function importBBVA(res){
  const r={tx:0,mv:0,skip:0,dup:0,from:res.periodo.de,to:res.periodo.a},refs=new Set(P().refs),seen=new Map();
  const L=res.list.map(x=>({...x}));
  // envío y devolución del mismo monto se cancelan
  L.forEach((x,i)=>{if(/DEVUELTO/i.test(x.desc)){const j=L.findIndex((y,k)=>k<i&&!y.skip&&/ENVIADO/i.test(y.desc)&&Math.abs(y.cargo-x.abono)<.01);if(j>=0){L[j].skip=true;x.skip=true}}});
  for(const x of L){
    const key0=`bbva|${x.d}|${x.desc}|${x.cargo}|${x.abono}|${(x.extra[0]||"").slice(0,30)}`;seen.set(key0,(seen.get(key0)||0)+1);const key=key0+"#"+seen.get(key0);
    if(refs.has(key)){r.dup++;continue}refs.add(key);P().refs.push(key);
    if(x.skip){r.skip++;continue}
    const a=x.cargo||x.abono,T=x.desc,E=x.extra.join(" "),add=o=>{S.tx.push({id:S.nid++,d:x.d,src:"bbva",ref:key,...o});r.tx++};
    if(/SPEI RECIBIDO/i.test(T)&&/MERCADO ?\*?PAGO/i.test(T+" "+E)){addMove({d:x.d,a,acc:"mp",to:"bbvaa",note:"De Mercado Pago",src:"bbva",ref:key},r);continue}
    if(/SPEI ENVIADO/i.test(T)&&/MERCADO ?PAGO/i.test(T)){addMove({d:x.d,a,acc:"bbvaa",to:"mp",note:"A Mercado Pago",src:"bbva",ref:key},r);continue}
    if(x.abono){add({type:"in",cat:/NOMINA/i.test(E)||/NOMINA/i.test(T)?"sueldo":"extra",a,acc:"bbvaa",note:/NOMINA/i.test(E+T)?"Nómina":nice(T.replace(/^SPEI RECIBIDO/i,"Depósito "))});continue}
    if(/RETIRO/i.test(T)){addMove({d:x.d,a,acc:"bbvaa",to:"cash",note:"Retiro sin tarjeta",src:"bbva",ref:key},r);continue}
    if(/SPEI ENVIADO|PAGO CUENTA DE TERCERO|TRASPASO/i.test(T)){
      const concept=(x.extra[0]||"").replace(/Referencia.*$/i,"").replace(/^BNET\s+\d+\s*/i,"").replace(/^\d+/,"").trim();
      const who=x.extra.find(l=>/^[A-Za-zÁÉÍÓÚÑáéíóúñ ]{5,}$/.test(l)&&!/mercado pago|libret/i.test(l))||"";
      add({type:"out",cat:catFrom(concept)||bankCat(concept)||"otros",a,acc:"bbvaa",note:[concept,who].filter(Boolean).map(nice).join(" · ")||"Transferencia"});continue}
    const note=T.replace(/^(MERPAGO|STR|NAYAXX1|DLO|BZI|PAYPAL)\*/i,"").replace(/^NAYAX\b.*/i,"Snack Nayax").trim();
    add({type:"out",cat:bankCat(T),a,acc:"bbvaa",note:nice(note)});
  }
  // el saldo de la cuenta cuadra con el saldo final del PDF
  S.meta.bbvaa={...(S.meta.bbvaa||{}),t:"deb",start:0};if(res.saldoFinal!=null){const b=balances(res.periodo.a).bbvaa;S.meta.bbvaa.start=Math.round((res.saldoFinal-b)*100)/100}
  return r;
}
/* Estimación inicial: lo neto que entró a cada apartado en el periodo importado (si salió de más, empezó con dinero antes) */
function potNeeds(){return potList().filter(k=>potBal(k)<0)}

async function importFiles(files){
  if(!files.length)return;let all=[],final=null,lastDate="";
  const banks=[];
  try{for(const f of files){
      if(/\.pdf$/i.test(f.name)||f.type==="application/pdf"){const {readBankPdf}=await import("../shared/bancos.mjs");const res=await readBankPdf(await f.arrayBuffer(),new URL("../shared/",location.href).href);
        if(!res.ok)toast("Ojo: los totales del PDF no cuadraron del todo; revisa los movimientos",3500);banks.push(res);continue}
      const rows=/\.csv$/i.test(f.name)?readCsv(await f.text()):await readXlsx(await f.arrayBuffer());const r=parseMP(rows);
      all=all.concat(r.list);const ld=r.list.map(x=>x.d).sort().pop()||"";if(ld>=lastDate){lastDate=ld;if(r.final!=null)final=r.final}}}
  catch(e){toast("No pude leer el archivo: "+e.message,3500);return}
  // orden cronológico estable (dentro del mismo día se respeta el orden del archivo)
  all=all.map((x,i)=>({...x,i})).sort((a,b)=>a.d.localeCompare(b.d)||a.i-b.i);
  if(S.sample){S.tx=[];S.sample=false;S.nid=1}
  const r=importMP(all);
  for(const b of banks){const rb=importBBVA(b);r.tx+=rb.tx;r.dup+=rb.dup;r.skip+=rb.skip;r.from=r.from&&r.from<rb.from?r.from:rb.from;r.to=r.to&&r.to>rb.to?r.to:rb.to;r.banks=(r.banks||0)+1}
  if(final!=null&&lastDate){S.meta.mp={...(S.meta.mp||{}),start:0};const b=balances(lastDate).mp;S.meta.mp.start=Math.round((final-b)*100)/100}
  save();closeSheet();selCard="mp";go("budget");render();
  const neg=potNeeds();
  openSheet(`<h3>Importado</h3><div class="list"><button>${svg('<path d="M5 12l4 4 10-10"/>')}<span>${r.tx} movimientos y ${r.mv} movimientos de apartados<br><small class="muted">${r.from?fdate(r.from)+" – "+fdate(r.to):""}${r.dup?` · ${r.dup} ya estaban`:""}${r.skip?` · ${r.skip} rendimientos ignorados`:""}</small></span></button></div>
  <p class="lbl" style="margin-top:12px">El estado de cuenta no dice cuánto tenía cada apartado antes${r.from?" del "+fdate(r.from):""}, así que calculé lo que entró menos lo que salió. ${neg.length?`<b>${neg.length} quedaron en negativo</b> (ya tenían dinero antes). `:""}Abre cada apartado y escribe el saldo que ves en Mercado Pago para que quede exacto.</p>
  <div class="btns"><button class="btn dark" data-close>Ver mis apartados</button></div>`);
}

/* --- vistas --- */
function potsCard(compact){
  const ks=potList();
  if(!ks.length)return compact?"":`<div class="card"><div class="ch"><div><div class="ey">Mercado Pago</div><h2>Apartados</h2></div></div>
    <p class="lbl">Importa tu estado de cuenta de Mercado Pago (Tu perfil → Estados de cuenta → descargar Excel) y verás cuánto tienes en cada apartado, cuánto apartas y en qué se va.</p>
    <div class="btns"><label class="btn dark" for="mpFile">Importar estado de cuenta</label></div></div>`;
  const ls=lastSplit(),ms=monthStart(),tot=potTotal();

function applySetup(c){

    if(P().items[f]&&f!==t2){if(!P().items[t2])P().items[t2]={...P().items[f],n:to};P().mv.forEach(m=>{if(m.k===f)m.k=t2});S.tx.forEach(x=>{if(x.pot===f)x.pot=t2});delete P().items[f]}});
  (c.pots||[]).forEach(([n,bal,plan])=>{const k=potKey(n);if(!P().items[k])P().items[k]={n,plan:0,base:0,baseSeq:0,created:d};const it=P().items[k];it.n=n;if(plan!=null){it.plan=plan;it.planSet=true}potSetBal(k,bal,d)});

function suggestPot(cat,note){
  if(!potList().length)return "";const n=norm(note||"");
  if(/\bgas\b|gasolin|petro ?7|pemex/.test(n)&&P().items.gas)return "gas";

function nextPaydays(n){const out=[],day=INC().day;let d=today();while(parse(d).getDay()!==day)d=addDays(d,1);for(let i=0;i<n;i++){out.push(d);d=addDays(d,7)}return out}
/* Gasto típico semanal de un apartado: mediana de lo retirado por semana en las últimas 8 semanas */
function potWeeklyOut(k){const t=today(),w=[];for(let i=1;i<=8;i++){const a=addDays(t,-7*i),b=addDays(t,-7*(i-1)-1);w.push(-sum(P().mv.filter(m=>m.k===k&&m.t==="wd"&&m.d>=a&&m.d<=b),m=>m.a))}
  const hasData=P().mv.some(m=>m.k===k&&m.t==="wd"&&m.d>=addDays(t,-56));if(!hasData)return 0;w.sort((a,b)=>a-b);return (w[3]+w[4])/2}
function potWeeklyAuto(k){const l=P().mv.filter(m=>m.k===k&&m.t==="auto"&&m.d>=addDays(today(),-56));return sum(l,m=>m.a)/8}
function forecast(){
  const ks=potList(),inc=INC().weekly,planOf=k=>P().items[k].plan||0;
  const fixed=sum(ks.filter(k=>k!=="hold"),planOf),rest=inc-fixed,scale=fixed>inc&&inc>0?inc/fixed:1;
  // si el pago no alcanza para todos los repartos, cada uno recibe la misma proporción (más realista que suponer que sí)
  const per=ks.map(k=>{const add=k==="hold"?Math.max(0,rest)+planOf(k):Math.round(planOf(k)*scale),auto=potWeeklyAuto(k),out=potWeeklyOut(k);return {k,n:P().items[k].n,bal:potBal(k),add,auto,out,delta:add+auto-out}});
  return {per,inc,fixed,rest,scale,days:nextPaydays(12)};

    save();closeSheet();render();toast(rec.pot&&P().items[rec.pot]?`Te quedan ${money(potBal(rec.pot))} en ${P().items[rec.pot].n}`:rec.type==="in"?"Ingreso guardado":"Gasto guardado",2600);return}
  if(g("[data-del]")){S.tx=S.tx.filter(x=>x.id!==draft.id);P().mv=P().mv.filter(m=>m.tx!==draft.id);save();closeSheet();render();toast("Movimiento eliminado");return}
  if(g("[data-export]")){const rows=[["fecha","tipo","categoria","cuenta","monto","nota"],...S.tx.slice().sort((a,b)=>a.d.localeCompare(b.d)).map(t=>[t.d,t.type==="in"?"ingreso":"gasto",CATS[t.cat].n,acc(t.acc).n,t.a,`"${(t.note||"").replace(/"/g,'""')}"`])];
    const url=URL.createObjectURL(new Blob(["﻿"+rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"}));const l=document.createElement("a");l.href=url;l.download="mis-finanzas.csv";l.click();setTimeout(()=>URL.revokeObjectURL(url),2000);return}
  if(g("[data-wipe]")){S={tx:[],sample:false,goal:S.goal,nid:1,chat:S.chat.slice(0,1),meta:S.meta};save();closeSheet();render();toast("Listo: empieza a registrar tus movimientos");return}
  if(g("[data-reset]")){const c=S.chat,m=S.meta;S=sample();S.chat=c;S.meta=m;save();closeSheet();render();toast("Datos de ejemplo cargados");return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();if(e.key==="/"&&screen==="home"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();$("#q").focus()}});
$("#chatForm").onsubmit=e=>{e.preventDefault();const i=$("#chatIn");ask(i.value);i.value=""};
["gesturestart","gesturechange"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
// Deslizar entre secciones y arrastrar hojas para cerrar
(()=>{let x0=null,y0,lock;document.addEventListener("touchstart",e=>{if(!$("#sheet").hidden||e.target.closest("#area,.sugs,input,.heat,.minis,.pick")){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY;lock=null},{passive:true});
  document.addEventListener("touchmove",e=>{if(x0==null||lock)return;const dx=e.touches[0].clientX-x0,dy=e.touches[0].clientY-y0;if(Math.abs(dx)>10||Math.abs(dy)>10)lock=Math.abs(dx)>Math.abs(dy)*1.3?"x":"y"},{passive:true});
  document.addEventListener("touchend",e=>{if(x0==null||lock!=="x")return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>70){const i=ORDER.indexOf(screen)+(dx<0?1:-1);if(i>=0&&i<ORDER.length)go(ORDER[i])}x0=null},{passive:true});
  const sh=$("#sheet");let sy=null,dy=0;
  sh.addEventListener("touchstart",e=>{if(sh.scrollTop>0||e.target.closest("input"))return;sy=e.touches[0].clientY;dy=0},{passive:true});
  sh.addEventListener("touchmove",e=>{if(sy==null)return;dy=e.touches[0].clientY-sy;if(dy>0){sh.classList.add("drag");sh.style.transform=`translateY(${dy}px)`;if(e.cancelable)e.preventDefault()}},{passive:false});
  sh.addEventListener("touchend",()=>{if(sy==null)return;sy=null;sh.classList.remove("drag");if(dy>90)closeSheet();else sh.style.transform=""});
})();

if(/#setup=/.test(location.hash)){try{const c=decodeSetup(location.hash);if(confirm(`¿Cargar ${(c.pots||[]).length} apartados con tus saldos reales en este dispositivo?`)){applySetup(c);screen="pots"}}catch(e){}history.replaceState(null,"",location.pathname)}
$("#mpFile").onchange=e=>{const f=[...e.target.files];e.target.value="";importFiles(f)};
save(false);syncThemeColor();render();lockStart();cloudPull();
if("serviceWorker" in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
