<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mis Finanzas</title>
<meta name="description" content="Gastos, presupuesto y ahorro personal">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0B0C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
/* Tablero oscuro monoespaciado: tarjetas con borde fino, velas de saldo, barras rayadas, cuadrícula de puntos, mapa de calor y asistente */
:root{
  --bg:#0B0B0C; --card:#141416; --card2:#1B1B1E; --line:#26262A; --line2:#34343A;
  --ink:#EDEDEE; --ink2:#8A8A91; --ink3:#5C5C63;
  --up:#57E39A; --down:#FF6166; --bubble:#D5DDE0;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button,.nav,.lbl,h2{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{font:inherit;color:inherit}
input,textarea{font-size:16px}
a{color:inherit}
button:focus-visible,input:focus-visible{outline:1.5px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
.app{max-width:440px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top,0px)) 14px calc(104px + env(safe-area-inset-bottom,0px))}
.screen{animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.press{transition:transform .16s cubic-bezier(.2,.8,.2,1)}
.press:active{transform:scale(.95)}

/* encabezado */
.hd{display:flex;align-items:center;gap:10px;padding:8px 2px 12px}
.me{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left}
.ava{width:38px;height:38px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.me b{display:block;font-size:15px;font-weight:600}
.me small{display:block;font-size:11px;color:var(--ink2)}
.ib{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;position:relative}
.ib svg{width:21px;height:21px}
.ib .dot{position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--up)}

/* tarjetas */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.card.flat{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h2{font-size:14px;font-weight:600;margin:0;letter-spacing:-.01em}
.pill{height:28px;padding:0 10px;border:1px solid var(--line2);border-radius:7px;font-size:11.5px;display:inline-flex;align-items:center;gap:6px;color:var(--ink);white-space:nowrap}
.pill svg{width:13px;height:13px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lbl{font-size:11px;color:var(--ink2)}
.muted{color:var(--ink2)}

/* buscador */
.search{display:flex;align-items:center;gap:10px;height:42px;padding:0 6px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.search svg{width:16px;height:16px;color:var(--ink2);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px}
.search input::placeholder{color:var(--ink3)}
.kbd{width:26px;height:26px;border:1px solid var(--line2);border-radius:6px;display:grid;place-items:center;color:var(--ink2);font-size:12px}

/* gráfica de velas */
.tb{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.tb>*{height:40px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-size:12px;border-right:1px solid var(--line)}
.tb>*:last-child{border-right:0}
.tb .sp{flex:1;border-right:1px solid var(--line)}
.tb svg{width:16px;height:16px}
.tb button[aria-pressed="true"]{color:var(--ink);background:var(--card2)}
.tb button[aria-pressed="false"]{color:var(--ink2)}
.tok{display:flex;align-items:center;gap:7px;font-weight:600}
.tok i{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-style:normal;font-size:11px}
.chart{display:block;width:100%;height:auto}
.foot{display:flex;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink2)}

/* estadísticas */
.stats{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;margin-bottom:12px}
.stats .v{font-size:17px;font-weight:600;margin-top:4px;letter-spacing:-.02em;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:10.5px;color:var(--ink2)}
.legend i{display:inline-block;width:8px;height:8px;margin-right:5px;vertical-align:0}

/* movimientos */
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;text-align:left}
.tx+.tx{border-top:1px solid var(--line)}
.ci{width:36px;height:36px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);display:grid;place-items:center;flex:none}
.ci svg{width:17px;height:17px}
.tx .t{flex:1;min-width:0}
.tx b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx small{display:block;font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-size:13.5px;font-weight:600;text-align:right;white-space:nowrap}
.tx .a small{text-align:right}
.empty{padding:22px 14px;text-align:center;color:var(--ink2);font-size:12px}

/* presupuesto */
.periods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.periods .v{font-size:16px;font-weight:600;margin:3px 0 4px;letter-spacing:-.02em}
.chg{display:inline-flex;align-items:center;gap:3px;font-size:10.5px}
.chg svg{width:11px;height:11px}
.grid{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.grid i{aspect-ratio:1;border-radius:1.5px;background:var(--line);animation:pop .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k) * 6ms)}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
.folders{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fold{display:flex;align-items:center;gap:9px;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:left;min-width:0}
.fold svg{width:17px;height:17px;flex:none;color:var(--ink2)}
.fold span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.fold em{font-style:normal;font-size:10.5px}
.fold[aria-pressed="true"]{border-color:var(--ink)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ink);transition:width .8s cubic-bezier(.2,.8,.2,1)}

/* análisis */
.split{display:flex;gap:6px;height:96px}
.split>div{display:flex;flex-direction:column;min-width:0;transition:flex-grow .8s cubic-bezier(.2,.8,.2,1)}
.split .k{font-size:10.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;padding-left:4px;border-left:1px solid var(--line2)}
.split .p{font-size:19px;font-weight:600;padding-left:4px;border-left:1px solid var(--line2);white-space:nowrap}
.split .p small{font-size:12px;margin-left:2px}
.split .st{flex:1;margin-top:6px;background:repeating-linear-gradient(90deg,var(--c) 0 2px,transparent 2px 5px)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:1.5px}
.months{display:flex;justify-content:space-between;margin-top:8px;font-size:10.5px;color:var(--ink2)}
.tip{position:absolute;pointer-events:none;background:#1F1F23;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:10.5px;min-width:150px;transform:translateX(-50%);transition:left .08s}
.tip b{display:block;font-size:11px;margin-bottom:6px}
.tip div{display:flex;justify-content:space-between;gap:10px;margin-top:3px}
.tip i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}

/* asistente */
.chatTop{display:flex;align-items:center;gap:10px;padding:8px 0 10px;border-bottom:1px solid var(--line);margin:0 -14px;padding-inline:14px;position:sticky;top:0;background:var(--bg);z-index:3;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.chatTop h2{flex:1;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.chatTop h2 svg{width:16px;height:16px}
.msgs{display:flex;flex-direction:column;gap:12px;padding:16px 0 8px}
.msg{max-width:84%;padding:11px 13px;border-radius:4px;font-size:12.5px;line-height:1.5;animation:in .3s cubic-bezier(.2,.8,.2,1)}
.msg time{display:block;font-size:10px;margin-top:6px;opacity:.6}
.msg.me{align-self:flex-end;background:var(--card2);border:1px solid var(--line)}
.msg.me time{text-align:right}
.msg.bot{align-self:flex-start;background:var(--bubble);color:#121214}
.msg.bot b{font-weight:700}
.msg.bot ul{margin:6px 0 0;padding-left:16px}
.sugs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:4px -14px 0;padding:0 14px}
.sugs::-webkit-scrollbar{display:none}
.sug{flex:none;height:32px;padding:0 12px;border:1px solid var(--line2);border-radius:99px;font-size:11.5px;color:var(--ink)}
.ins{flex:none;width:150px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px;text-align:left}
.ins .r{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;margin-top:6px}
.ins .ci{width:26px;height:26px}
.ins .ci svg{width:13px;height:13px}
.compose{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.compose form{max-width:412px;margin:0 auto;display:flex;align-items:center;gap:10px}
.compose input{flex:1;min-width:0;height:40px;border:0;background:none;outline:none}
.compose input::placeholder{color:var(--ink3)}
.compose svg{width:20px;height:20px}

/* navegación */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.nav div{max-width:420px;margin:0 auto;display:flex;justify-content:space-around;align-items:center}
.nav button{width:52px;height:44px;display:grid;place-items:center;color:var(--ink3);transition:color .2s,transform .16s}
.nav button:active{transform:scale(.9)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav .add{width:46px;height:46px;border-radius:14px;background:var(--ink);color:var(--bg)}
.nav .add svg{width:22px;height:22px}

/* hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-width:440px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:calc(100dvh - env(safe-area-inset-top,0px) - 20px);overflow:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform .36s cubic-bezier(.2,.9,.25,1)}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.grab{width:36px;height:4px;border-radius:99px;background:var(--line2);margin:0 auto 12px;position:relative}
.grab::before{content:"";position:absolute;inset:-14px -60px}
.sheet h3{font-size:16px;font-weight:600;margin:4px 0 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{height:36px;font-size:12px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.amount{display:flex;align-items:baseline;justify-content:center;gap:4px;margin:16px 0 8px}
.amount span{font-size:26px;color:var(--ink2)}
.amount input{width:100%;max-width:240px;text-align:center;font-size:40px;font-weight:600;background:none;border:0;outline:none;letter-spacing:-.03em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{height:32px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;font-size:11.5px;display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.chips button svg{width:14px;height:14px}
.chips button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--card2)}
.field{margin-top:14px}
.field input{width:100%;height:42px;border:1px solid var(--line2);border-radius:9px;background:var(--bg);padding:0 12px;outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;height:46px;border-radius:10px;border:1px solid var(--line2);font-weight:600;font-size:13px;display:grid;place-items:center;text-decoration:none}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.red{color:var(--down)}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}
.list button,.list a{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;text-align:left;text-decoration:none;font-size:13px}
.list>*+*{border-top:1px solid var(--line)}
.list svg{width:18px;height:18px;color:var(--ink2);flex:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:12px;font-weight:600;opacity:0;transition:.25s;z-index:20;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="app" id="app"></main>
<nav class="nav" id="nav" aria-label="Secciones"><div>
  <button data-go="home" aria-label="Inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20H4z"/><path d="M10 20v-5h4v5"/></svg></button>
  <button data-go="budget" aria-label="Presupuesto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg></button>
  <button class="add" data-add aria-label="Agregar movimiento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-go="stats" aria-label="Análisis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 16v-3M12 16V8M15.5 16v-5"/></svg></button>
  <button data-go="chat" aria-label="Asistente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-8l-5 4v-4H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M9 11h.01M12 11h.01M15 11h.01"/></svg></button>
</div></nav>
<div class="compose" id="compose" hidden><form id="chatForm" autocomplete="off">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--ink2)"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
  <input id="chatIn" placeholder="Pregunta o escribe “gasté 250 en tacos”" enterkeyhint="send">
  <button aria-label="Enviar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4L21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg></button>
</form></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ======================= Datos ======================= */
const CATS={
 comida:{n:"Comida fuera",k:"want",ic:'<path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 3c-2 2-2 6 0 8v10"/>',w:["comida","restaurante","tacos","taco","cafe","café","starbucks","pizza","sushi","hamburguesa","torta","antojo","desayuno","cena","comer"]},
 super:{n:"Súper",k:"need",ic:'<circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2l2.5 11h11L21 8H6.2"/>',w:["super","súper","despensa","mandado","walmart","soriana","costco","oxxo","chedraui","bodega"]},
 auto:{n:"Auto",k:"need",ic:'<path d="M5 16v-4l2-5h10l2 5v4M4 16h16M6 16v2.5M18 16v2.5M7.5 12.5h.01M16.5 12.5h.01"/>',w:["gasolina","gas ","auto","jetta","carro","coche","servicio","aceite","llanta","verificacion","estacionamiento","caseta","lavado"]},
 casa:{n:"Casa",k:"need",ic:'<path d="M4 10.5L12 4l8 6.5V20H4z"/>',w:["renta","luz","agua","internet","casa","cfe","telmex","izzi","gas lp","predial","mantenimiento"]},
 transporte:{n:"Transporte",k:"need",ic:'<rect x="5" y="3" width="14" height="15" rx="3"/><path d="M5 11h14M8 21v-3M16 21v-3"/>',w:["uber","didi","metro","taxi","camion","camión","transporte","metrobus"]},
 salud:{n:"Salud",k:"need",ic:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',w:["salud","doctor","farmacia","medicina","gym","gimnasio","dentista","consulta","seguro"]},
 ocio:{n:"Ocio",k:"want",ic:'<path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/>',w:["ocio","cine","salida","fiesta","bar","antro","concierto","boletos","juego","videojuego","viaje","cerveza","chelas"]},
 subs:{n:"Suscripciones",k:"want",ic:'<path d="M17 2l3 3-3 3M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 0 1-4 4H4"/>',w:["suscripcion","suscripción","netflix","spotify","icloud","youtube","disney","hbo","max","prime","chatgpt","claude","app"]},
 compras:{n:"Compras",k:"want",ic:'<path d="M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2"/>',w:["compras","ropa","amazon","mercado libre","tenis","zapatos","regalo","tienda","liverpool"]},
 otros:{n:"Otros",k:"want",ic:'<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>',w:[]},

/* Datos de ejemplo realistas y reproducibles: 12 meses de quincenas, renta, súper, gasolina, salidas… */
function sample(){
  let seed=20261004;const R=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const pick=a=>a[Math.floor(R()*a.length)],amt=(a,b,r=10)=>Math.round((a+R()*(b-a))/r)*r;
  const tx=[];let id=1;const bal={};for(const k in ACCS)bal[k]=ACCS[k].start;
  const T=(d,type,cat,a,acc,note)=>{tx.push({id:id++,d,type,cat,a,acc,note});bal[acc]+=type==="in"?a:-a};
  const M=(d,a,acc,to,note)=>{if(a<=0)return;tx.push({id:id++,d,type:"move",cat:"move",a,acc,to,note});bal[acc]-=a;bal[to]+=a};
  const end=today();let d=addDays(end,-364);
  while(d<=end){
    const D=parse(d),dom=D.getDate(),dow=D.getDay(),last=new Date(D.getFullYear(),D.getMonth()+1,0).getDate();
    if(dom===15||dom===last){T(d,"in","sueldo",16500,"deb","Quincena");M(d,3500,"deb","save","Ahorro de quincena")}
    if(dom===10)M(d,Math.round(-bal.cred),"deb","cred","Pago de tarjeta");
    if(bal.cash<350)M(d,1500,"deb","cash","Retiro en cajero");
    if(dom===1)T(d,"out","casa",7500,"deb","Renta");
    if(dom===5)T(d,"out","casa",amt(380,620),"deb","Luz CFE");
    if(dom===8)T(d,"out","casa",549,"deb","Internet");
    if(dom===12)T(d,"out","subs",219,"cred","Netflix");
    if(dom===18)T(d,"out","subs",129,"cred","Spotify");
    if(dom===22)T(d,"out","subs",49,"cred","iCloud");
    if(dom===3)T(d,"out","salud",699,"deb","Gimnasio");
    if(dow===6)T(d,"out","super",amt(700,1150),pick(["deb","deb","cred"]),pick(["Walmart","Soriana","Costco","Súper"]));
    if(dow===1)T(d,"out","auto",amt(600,820),"deb","Gasolina Jetta");
    if(R()<.36)T(d,"out","comida",amt(80,360),pick(["cash","deb","cred"]),pick(["Tacos","Café","Comida corrida","Sushi","Pizza","Tortas","Hamburguesa"]));
    if((dow===5||dow===6)&&R()<.45)T(d,"out","ocio",amt(250,950),pick(["cred","cash"]),pick(["Cine","Bar","Salida con amigos","Concierto","Boliche"]));
    if(R()<.12)T(d,"out","transporte",amt(60,180),"deb",pick(["Uber","DiDi"]));
    if(R()<.05)T(d,"out","compras",amt(300,1800,50),"cred",pick(["Ropa","Amazon","Mercado Libre","Tenis"]));
    if(R()<.03)T(d,"out","salud",amt(150,700),"deb",pick(["Farmacia","Consulta"]));
    if(R()<.008)T(d,"out","auto",amt(1800,3200,100),"deb",pick(["Servicio Jetta","Llantas alineación","Afinación"]));
    if(R()<.02)T(d,"in","extra",amt(500,2500,100),"deb",pick(["Venta","Freelance","Reembolso"]));
    d=addDays(d,1);
  }
  return {tx,sample:true,goal:20,nid:id};
}

  while(d<=end){

  for(let k=1;k<6;k++){const x=(W-R)*k/6;g+=`<line y1="${top}" y2="${H-bot}" x1="${x}" x2="${x}" stroke="var(--line)" stroke-width="1"/>`}

    body+=`<g style="animation:in .4s both;animation-delay:${k*12}ms"><line x1="${x}" x2="${x}" y1="${Y(c.h)}" y2="${Y(c.l)}" stroke="var(--ink)" stroke-width="1"/><rect x="${x-bw/2}" y="${y1}" width="${bw}" height="${h}" fill="${up?"var(--ink)":"var(--bg)"}" stroke="var(--ink)" stroke-width="1"/></g>`});
  else{const pts=cs.map((c,k)=>[4+k*cw+cw/2,Y(c.c)]);const p=pts.map((q,k)=>(k?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");

  const last=cs.at(-1).c,yl=Y(last);

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" font-family="JetBrains Mono,monospace"><defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><style>@keyframes draw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}</style>${g}${body}
    <line x1="0" x2="${W-R}" y1="${yl}" y2="${yl}" stroke="var(--ink)" stroke-dasharray="3 3" stroke-width="1"/><rect x="${W-R+2}" y="${yl-9}" width="${R-4}" height="18" rx="3" fill="var(--ink)"/><text x="${W-6}" y="${yl+3.5}" text-anchor="end" fill="var(--bg)" font-size="9.5" font-weight="700">${short(last)}</text>${labs}</svg>`;
}

function renderStats(){
  const ms=monthStart(-3),t=monthEnd(-1),o=outs(ms,t),i=sum(ins(ms,t))||1;

  const vals=Object.values(daily).sort((a,b)=>a-b),qv=p=>vals[Math.floor(p*(vals.length-1))]||0,qs=[qv(.25),qv(.5),qv(.75),qv(.92)];
  const lev=v=>!v?0:v<=qs[0]?1:v<=qs[1]?2:v<=qs[2]?3:4,HC=["#1A1A1D","#2E2E33","#5C5C63","#A9A9AF","#F2F2F3"];

  <div class="card">

    <div class="legend" style="justify-content:space-between"><span>Meta: 50 · 30 · 20</span><span class="${P(sav)>=20?"up":"down"}">${P(sav)>=20?"Vas bien con tu ahorro":"Ahorro por debajo de la meta"}</span></div>
  </div>
  <div class="card">
    <div class="ch"><h2>Mapa de gasto diario</h2><span class="pill">6M</span></div>
    <div class="heat" id="heat">${cells}</div>
    <div class="months">${monthsL.slice(-6).map(m=>`<span>${m}</span>`).join("")}</div>
    <div class="legend" id="heatInfo">${heatPick?dayInfo(heatPick):`<span>Menos</span>${HC.map(c=>`<i style="background:${c};margin:0"></i>`).join("")}<span>Más · toca un día</span>`}</div>
  </div>
  <div class="card" style="position:relative">
    <div class="ch"><h2>Gasto vs tu promedio</h2><span class="pill">30D</span></div>
    <div id="area" style="position:relative;touch-action:pan-y">${areaSVG()}</div>
  </div>`;
}
function dayInfo(d){const l=S.tx.filter(x=>x.d===d&&x.type==="out");return `<span style="color:var(--ink)">${fdate(d)}</span><span>${money(sum(l))} en ${l.length} gasto${l.length===1?"":"s"}</span>${l.slice(0,2).map(x=>`<span>${x.note||CATS[x.cat].n}</span>`).join("")}`}
let areaIdx=null;
function areaData(){const t=today(),days=[];for(let k=29;k>=0;k--){const d=addDays(t,-k);days.push({d,v:sum(outs(d,d))})}
  const avg=sum(outs(addDays(t,-90),addDays(t,-1)))/90;const sm=days.map((x,k)=>{const w=days.slice(Math.max(0,k-2),k+1);return {...x,s:sum(w,y=>y.v)/w.length}});return {sm,avg}}
function areaSVG(){
  const {sm,avg}=areaData(),W=340,H=170,top=12,bot=22,mx=Math.max(avg*2.2,...sm.map(x=>x.s)),Y=v=>top+(1-v/mx)*(H-top-bot),X=k=>k/(sm.length-1)*W;
  const pts=sm.map((x,k)=>[X(k),Y(x.s)]);let p=`M${pts[0][0]} ${pts[0][1]}`;for(let k=1;k<pts.length;k++){const [x0,y0]=pts[k-1],[x1,y1]=pts[k],cx=(x0+x1)/2;p+=` C${cx} ${y0} ${cx} ${y1} ${x1} ${y1}`}
  const yb=Y(avg),i=areaIdx??sm.length-1,sel=sm[i];
  const tipX=Math.min(Math.max(X(i),80),W-80);
  return `<svg class="chart" id="areaSvg" viewBox="0 0 ${W} ${H}" font-family="JetBrains Mono,monospace">
    <defs><clipPath id="ab"><rect x="0" y="0" width="${W}" height="${yb}"/></clipPath><clipPath id="bl"><rect x="0" y="${yb}" width="${W}" height="${H}"/></clipPath></defs>
    <path d="${p} L${W} ${yb} L0 ${yb}Z" fill="#E6E6E8" clip-path="url(#ab)"/><path d="${p} L${W} ${yb} L0 ${yb}Z" fill="#3A3A40" clip-path="url(#bl)"/>
    <path d="${p}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
    <line x1="0" x2="${W}" y1="${yb}" y2="${yb}" stroke="var(--ink2)" stroke-width="1"/>
    <line x1="${X(i)}" x2="${X(i)}" y1="${top}" y2="${H-bot}" stroke="var(--ink2)" stroke-dasharray="3 3"/><circle cx="${X(i)}" cy="${Y(sel.s)}" r="4.5" fill="var(--bg)" stroke="var(--ink)" stroke-width="1.6"/>
    ${[0,10,20,29].map(k=>`<text x="${Math.min(Math.max(X(k),18),W-22)}" y="${H-6}" text-anchor="middle" fill="var(--ink2)" font-size="9.5">${fdate(sm[k].d)}</text>`).join("")}
  </svg><div class="tip" style="left:${tipX/W*100}%;top:4px"><b>${fdate(sel.d)}</b><div><span><i style="background:#E6E6E8"></i>Gasto 3d</span><span class="num">${money(sel.s)}</span></div><div><span><i style="background:var(--ink2)"></i>Promedio</span><span class="num">${money(avg)}</span></div></div>`;
}

function catFrom(s){const n=" "+norm(s)+" ";for(const k of Object.keys(CATS))if(CATS[k].w.some(w=>n.includes(norm(w))))return k;return null}
function answer(raw){
  const s=norm(raw),t=today(),ms=monthStart(),dom=parse(t).getDate(),dim=parse(monthEnd()).getDate();
  const mO=sum(outs(ms,t)),mI=sum(ins(ms,t)),expI=sum(ins(monthStart(-1),monthEnd(-1)))||mI;
  const amtM=raw.replace(/,/g,"").match(/\$?\s*(\d+(?:\.\d+)?)/),amt=amtM?parseFloat(amtM[1]):null;
  // registrar movimiento
  if(amt&&/(gaste|pague|compre|registra|agrega|anota|me gaste|cargue|puse)/.test(s)){const cat=catFrom(raw)||"otros";const note=raw.replace(/\$?\s*\d[\d,\.]*/,"").replace(/(gast[eé]|pagu[eé]|compr[eé]|registra|agrega|anota|cargu[eé]|puse|en|de|me)\b/gi,"").replace(/\s+/g," ").trim().replace(/^./,c=>c.toUpperCase());
    const tx={id:S.nid++,d:t,type:"out",cat,a:amt,acc:/efectivo|cash/.test(s)?"cash":/credito|tarjeta/.test(s)?"cred":"deb",note:note||CATS[cat].n};S.tx.push(tx);
    return `Listo, registré <b>${money(amt)}</b> en <b>${CATS[cat].n}</b> (${ACCS[tx.acc].n}). Este mes llevas ${money(mO+amt)} gastados.`}
  if(amt&&/(me pagaron|cobre|recibi|ingreso|deposito|me depositaron)/.test(s)){const cat=/sueldo|quincena|nomina/.test(s)?"sueldo":"extra";S.tx.push({id:S.nid++,d:t,type:"in",cat,a:amt,acc:"deb",note:CATS[cat].n});return `Anotado: ingreso de <b>${money(amt)}</b> como ${CATS[cat].n}.`}
  // puedo gastar
  if(amt&&/(puedo|alcanza|me conviene|deberia)/.test(s)){const goal=expI*S.goal/100,left=expI-goal-mO,daily=(left-amt)/Math.max(1,dim-dom);
    return left-amt>=0?`Sí. Con tu ingreso de ~${money(expI)} y meta de ahorro de ${S.goal}%, te quedan <b>${money(left)}</b> este mes. Después de gastar ${money(amt)} tendrías <b>${money(daily)} por día</b> hasta fin de mes.`
    :`Mejor no por ahora. Para respetar tu meta de ahorro (${S.goal}%) te quedan <b>${money(Math.max(0,left))}</b> este mes y ${money(amt)} te dejaría <b>${money(left-amt)}</b> abajo. Si es necesario, sale de tu ahorro.`}
  const cat=catFrom(raw);
  if(/gasolina|jetta|carro|auto/.test(s)){const l=outs(monthStart(-2),t).filter(x=>x.cat==="auto"),g=l.filter(x=>/gasolina/i.test(x.note)),mg=outs(ms,t).filter(x=>x.cat==="auto");
    return `En auto llevas <b>${money(sum(mg))}</b> este mes. En los últimos 3 meses: ${money(sum(g))} en gasolina (${g.length} cargas, ~${money(g.length?sum(g)/g.length:0)} c/u) y ${money(sum(l)-sum(g))} en servicio y otros. <br>Tip: registra kilometraje en <a href="../jetta/">Mi Jetta</a> para saber cuánto te cuesta cada km.`}
  if(cat&&CATS[cat].k!=="in"&&/(cuanto|gaste|gasto|llevo|en )/.test(s)){const v=sum(outs(ms,t).filter(x=>x.cat===cat)),pv=sum(outs(monthStart(-1),addDays(monthStart(-1),dom-1)).filter(x=>x.cat===cat)),p=pct(v,pv);
    return `En <b>${CATS[cat].n}</b> llevas <b>${money(v)}</b> este mes${p!=null&&isFinite(p)?`, ${p>0?"<b>"+p.toFixed(0)+"% más</b>":Math.abs(p).toFixed(0)+"% menos"} que a estas alturas del mes pasado (${money(pv)})`:""}.`}
  if(/cerrar|proyeccion|fin de mes|terminar|voy a acabar|como voy/.test(s)){const rest=sum(outs(addDays(monthStart(-1),dom),monthEnd(-1))),proj=mO+rest,sav=expI-proj;
    return `Llevas ${money(mO)}. Si el resto del mes se parece al mes pasado (${money(rest)} del día ${dom+1} en adelante), cerrarías con <b>${money(proj)}</b> de gasto. Con ingresos de ~${money(expI)} ahorrarías <b class="${sav>=0?"":""}">${money(sav)}</b> (${Math.round(sav/expI*100)}%). ${sav/expI*100>=S.goal?"Vas arriba de tu meta 👌":"Para llegar al "+S.goal+"% tendrías que recortar ~"+money((expI*S.goal/100-sav)/Math.max(1,dim-dom))+" por día."}`}
  if(/cuanto (llevo|he|gaste)|total|este mes/.test(s)){const pv=sum(outs(monthStart(-1),addDays(monthStart(-1),dom-1)));
    return `Este mes llevas <b>${money(mO)}</b> en gastos e <b>${money(mI)}</b> en ingresos. A estas alturas del mes pasado ibas en ${money(pv)}.`}
  if(/en que gasto|mas gasto|donde se va|top|categorias/.test(s)){const by={};outs(ms,t).forEach(x=>by[x.cat]=(by[x.cat]||0)+x.a);const l=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,4);
    return `Tus gastos más grandes este mes:<ul>${l.map(([k,v])=>`<li>${CATS[k].n}: <b>${money(v)}</b> (${Math.round(v/mO*100)}%)</li>`).join("")}</ul>`}
  if(/consejo|tip|ahorrar|ayuda|recomienda/.test(s)){const tips=[];const by={},pb={};outs(ms,t).forEach(x=>by[x.cat]=(by[x.cat]||0)+x.a);outs(monthStart(-1),addDays(monthStart(-1),dom-1)).forEach(x=>pb[x.cat]=(pb[x.cat]||0)+x.a);
    const up=Object.keys(by).filter(k=>CATS[k].k==="want"&&pb[k]&&by[k]>pb[k]*1.15).sort((a,b)=>(by[b]-pb[b])-(by[a]-pb[a]));
    if(up[0])tips.push(`<b>${CATS[up[0]].n}</b> subió ${money(by[up[0]]-pb[up[0]])} vs el mes pasado. Ponle un tope semanal.`);
    const subs=sum(outs(monthStart(-1),monthEnd(-1)).filter(x=>x.cat==="subs"));if(subs)tips.push(`Pagas ~<b>${money(subs)}/mes</b> en suscripciones (${money(subs*12)} al año). Revisa cuál no usas.`);

  if(t=g("[data-range]")){range=t.dataset.range;render();return}
  if(t=g("[data-mode]")){mode=t.dataset.mode;render();return}
  if(t=g("[data-tx]")){const x=S.tx.find(y=>y.id===+t.dataset.tx);if(x.type==="move"){draft={...x};openSheet(`<h3>${x.note}</h3><div class="list"><button>${svg(CATS.move.ic)}${ACCS[x.acc].n} → ${ACCS[x.to].n}</button><button>${svg('<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16"/>')}${fdate(x.d)} · ${money(x.a)}</button></div><p class="lbl" style="margin-top:10px">Las transferencias entre tus cuentas no cuentan como gasto ni ingreso.</p><div class="btns"><button class="btn red" data-del>Eliminar</button><button class="btn dark" data-close>Cerrar</button></div>`)}else txSheet(x);return}
  if(t=g("[data-cat]")){q=CATS[t.dataset.cat].n;screen="home";render();scrollTo(0,0);return}
  if(t=g("[data-acc]")){q=ACCS[t.dataset.acc].n;screen="home";render();scrollTo(0,0);return}
  if(t=g("[data-day]")){heatPick=heatPick===t.dataset.day?null:t.dataset.day;render();return}
  if(t=g("[data-ask]")){ask(t.dataset.ask);return}
  if(g("[data-clearchat]")){S.chat=S.chat.slice(0,1);save();render();return}
  if(g("[data-settings]")){settings();return}
  if(g("[data-close]")){closeSheet();return}
  if(t=g("[data-type]")){draft.type=t.dataset.type;draft.a=$("#amt").value;draft.note=$("#note").value;draft.d=$("#date").value;txSheet(null,true);return}
  if(t=g("[data-pc]")){draft.cat=t.dataset.pc;t.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t));return}
  if(t=g("[data-pa]")){draft.acc=t.dataset.pa;t.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t));return}
  if(g("[data-savetx]")){const a=parseFloat(($("#amt").value||"").replace(/[,$\s]/g,""));if(!(a>0)){toast("Escribe un monto");return}
    const rec={...draft,a,note:$("#note").value.trim(),d:$("#date").value||today()};
    if(rec.id){const i=S.tx.findIndex(x=>x.id===rec.id);S.tx[i]=rec}else{rec.id=S.nid++;S.tx.push(rec)}
    save();closeSheet();render();toast(rec.type==="in"?"Ingreso guardado":"Gasto guardado");return}
  if(g("[data-del]")){S.tx=S.tx.filter(x=>x.id!==draft.id);save();closeSheet();render();toast("Movimiento eliminado");return}
  if(g("[data-export]")){const rows=[["fecha","tipo","categoria","cuenta","monto","nota"],...S.tx.slice().sort((a,b)=>a.d.localeCompare(b.d)).map(t=>[t.d,t.type==="in"?"ingreso":"gasto",CATS[t.cat].n,ACCS[t.acc].n,t.a,`"${(t.note||"").replace(/"/g,'""')}"`])];
    const url=URL.createObjectURL(new Blob(["﻿"+rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"}));const l=document.createElement("a");l.href=url;l.download="mis-finanzas.csv";l.click();setTimeout(()=>URL.revokeObjectURL(url),2000);return}
  if(g("[data-wipe]")){S={tx:[],sample:false,goal:S.goal,nid:1,chat:S.chat.slice(0,1)};save();closeSheet();render();toast("Listo: empieza a registrar tus movimientos");return}
  if(g("[data-reset]")){const c=S.chat;S=sample();S.chat=c;save();closeSheet();render();toast("Datos de ejemplo cargados");return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();if(e.key==="/"&&screen==="home"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();$("#q").focus()}});
$("#chatForm").onsubmit=e=>{e.preventDefault();const i=$("#chatIn");ask(i.value);i.value=""};
["gesturestart","gesturechange"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
// Deslizar entre secciones y arrastrar hojas para cerrar
(()=>{let x0=null,y0,lock;document.addEventListener("touchstart",e=>{if(!$("#sheet").hidden||e.target.closest("#area,.sugs,input,.heat")){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY;lock=null},{passive:true});
  document.addEventListener("touchmove",e=>{if(x0==null||lock)return;const dx=e.touches[0].clientX-x0,dy=e.touches[0].clientY-y0;if(Math.abs(dx)>10||Math.abs(dy)>10)lock=Math.abs(dx)>Math.abs(dy)*1.3?"x":"y"},{passive:true});
  document.addEventListener("touchend",e=>{if(x0==null||lock!=="x")return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>70){const i=ORDER.indexOf(screen)+(dx<0?1:-1);if(i>=0&&i<ORDER.length)go(ORDER[i])}x0=null},{passive:true});
  const sh=$("#sheet");let sy=null,dy=0;
  sh.addEventListener("touchstart",e=>{if(sh.scrollTop>0||e.target.closest("input"))return;sy=e.touches[0].clientY;dy=0},{passive:true});
  sh.addEventListener("touchmove",e=>{if(sy==null)return;dy=e.touches[0].clientY-sy;if(dy>0){sh.classList.add("drag");sh.style.transform=`translateY(${dy}px)`;if(e.cancelable)e.preventDefault()}},{passive:false});
  sh.addEventListener("touchend",()=>{if(sy==null)return;sy=null;sh.classList.remove("drag");if(dy>90)closeSheet();else sh.style.transform=""});
})();

save();render();
if("serviceWorker" in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
