<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mis Finanzas</title>
<meta name="description" content="Gastos, presupuesto y ahorro personal">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDEDEF">
<script>
/* Tema compartido entre las apps de Diapps: empieza en claro; el modo oscuro se elige en el menú */
(function(){var t="light";try{t=localStorage.getItem("diapps-theme")||"light"}catch(e){}document.documentElement.dataset.theme=t})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap">
<style>
/* Mismo lenguaje que Mi Jetta y el selector: Urbanist, fondo gris claro, tarjetas blancas redondeadas,
   barra de vidrio con etiquetas y hojas inferiores. Las gráficas usan los tokens, así funcionan en claro y oscuro. */
:root{
  --bg:#EDEDEF; --card:#FFFFFF; --card2:#F4F4F5; --line:#E4E4E7; --line2:#D3D3D8;
  --ink:#111113; --ink2:#85858C; --ink3:#B4B4BA;
  --up:#23A05C; --down:#E5484D; --lime:#C6EE3A;
  --glass:rgba(255,255,255,.62); --glassBorder:rgba(255,255,255,.8); --glassShadow:rgba(30,32,40,.14);
  --scrim:rgba(0,0,0,.32); --tipShadow:0 10px 30px rgba(0,0,0,.12);
  --font:"Urbanist",-apple-system,"SF Pro Text",system-ui,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121214; --card:#1E1E21; --card2:#27272B; --line:#2E2E33; --line2:#3B3B42;
  --ink:#F3F3F4; --ink2:#8E8E96; --ink3:#56565D;
  --up:#57E39A; --down:#FF6166;
  --glass:rgba(40,40,46,.6); --glassBorder:rgba(255,255,255,.1); --glassShadow:rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.55); --tipShadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button,.nav,.lbl,h1,h2,.cc{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;-webkit-touch-callout:none}
input{font:inherit;color:inherit}
input,textarea{font-size:16px}
a{color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
.app{max-width:440px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 18px calc(118px + env(safe-area-inset-bottom,0px))}
.screen{animation:in .38s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.press{transition:transform .16s cubic-bezier(.2,.8,.2,1)}
.press:active{transform:scale(.95)}

/* encabezado (igual que Mi Jetta) */
.bar{display:flex;align-items:center;gap:8px;padding:6px 0 4px}
.bar .sp{flex:1}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;text-align:left}
.brand img{width:36px;height:36px;border-radius:10px;display:block}
.brand small{display:block;font-size:12px;font-weight:500;color:var(--ink2);line-height:1.1}
.rb{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none;position:relative}
.rb svg{width:20px;height:20px}
.rb .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--down);border:2px solid var(--card)}
h1{font-size:40px;font-weight:600;letter-spacing:-.035em;line-height:1.05;margin:16px 0 0}
.subttl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 4px;color:var(--ink2);font-size:14px;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--card);color:var(--ink);font-weight:600;font-size:13.5px}
.chip.ok{background:color-mix(in srgb,var(--lime) 50%,transparent);color:#26300a}
:root[data-theme="dark"] .chip.ok{color:var(--lime)}
.chip.bad{background:color-mix(in srgb,var(--down) 16%,transparent);color:var(--down)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}

/* tarjetas de contenido */
.card{background:var(--card);border-radius:26px;padding:18px;margin-top:14px}
.card.flat{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
h2{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
.ey{font-size:12px;color:var(--ink2);font-weight:500}
.pill{height:32px;padding:0 13px;border-radius:99px;background:var(--card2);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink);white-space:nowrap}
.pill svg{width:14px;height:14px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lbl{font-size:12.5px;color:var(--ink2);font-weight:500}
.muted{color:var(--ink2)}

/* buscador */
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 8px 0 16px;border-radius:99px;background:var(--card);margin-top:16px}
.search svg{width:18px;height:18px;color:var(--ink2);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none}
.search input::placeholder{color:var(--ink3)}
.kbd{width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--ink2);font-size:13px;font-weight:600}

/* gráfica de velas */
.tb{display:flex;align-items:center;gap:6px;padding:14px 14px 4px;flex-wrap:wrap}
.tb .sp{flex:1}
.tok{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;margin-right:4px}
.tok i{width:30px;height:30px;border-radius:10px;background:var(--ink);color:var(--card);display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:700}
.seg2{display:flex;background:var(--card2);border-radius:99px;padding:3px}
.seg2 button{height:28px;min-width:38px;padding:0 10px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--ink2);display:grid;place-items:center;transition:background-color .2s,color .2s}
.seg2 button svg{width:16px;height:16px}
.seg2 button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chart{display:block;width:100%;height:auto}
.foot{display:flex;justify-content:space-between;padding:12px 18px 16px;font-size:13px;color:var(--ink2)}
.foot b{color:var(--ink)}

/* estadísticas */
.stats{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;margin-bottom:14px}
.stats .v{font-size:21px;font-weight:600;margin-top:2px;letter-spacing:-.02em;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12.5px;color:var(--ink2);font-weight:500}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-.5px}

/* movimientos */
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:12px 18px;text-align:left}
.tx+.tx{border-top:1px solid var(--line)}
.ci{width:42px;height:42px;border-radius:14px;background:var(--card2);display:grid;place-items:center;flex:none}
.ci svg{width:20px;height:20px}
.tx .t{flex:1;min-width:0}
.tx b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tx .a{font-size:15.5px;font-weight:600;text-align:right;white-space:nowrap}
.tx .a small{justify-content:flex-end}
.empty{padding:26px 18px;text-align:center;color:var(--ink2);font-size:14px}

/* presupuesto */
.periods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.periods .v{font-size:20px;font-weight:600;margin:2px 0 3px;letter-spacing:-.02em}
.chg{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600}
.chg svg{width:12px;height:12px}
.grid{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.grid i{aspect-ratio:1;border-radius:3px;background:var(--card2);animation:pop .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k) * 6ms)}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
.folders{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fold{display:flex;align-items:center;gap:10px;height:56px;padding:0 14px;border-radius:20px;background:var(--card);text-align:left;min-width:0}
.fold .fi{width:30px;height:30px;border-radius:10px;background:var(--card2);display:grid;place-items:center;flex:none}
.fold svg{width:16px;height:16px}
.fold span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:600}
.fold em{font-style:normal;font-size:12px;font-weight:600}

/* cartera de tarjetas */
.wallet{position:relative;margin-top:4px}
.wallet>button{display:block;width:100%;position:relative;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.wallet>button:not(:last-child){margin-bottom:calc(-63.05% + 50px)}
.wallet>button:not(:last-child):active{transform:translateY(-8px)}
.wallet>button:last-child{animation:lift .5s cubic-bezier(.2,.8,.2,1)}
@keyframes lift{from{transform:translateY(-18px)}}
.cc{position:relative;width:100%;aspect-ratio:1.586;border-radius:18px;overflow:hidden;color:#fff;container-type:inline-size;box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 8px 24px rgba(0,0,0,.16);display:block;text-align:left}
.cc .brandmark{position:absolute;left:7%;top:9%;font-weight:600;font-size:10.5cqw;letter-spacing:.01em;line-height:1}
.cc .digits{position:absolute;left:7%;bottom:9%;font-size:5.6cqw;font-weight:500;letter-spacing:.06em}
.cc .digits span{letter-spacing:.2em;margin-right:.4em}
.cc .kind{position:absolute;right:7%;top:10%;font-size:4.4cqw;font-weight:600;opacity:.85;display:flex;align-items:center;gap:2cqw}
.cc .kind svg{width:5cqw;height:5cqw}
.cc .mc{position:absolute;right:7%;bottom:8%;width:20cqw;height:12.5cqw}
.cc .mc i{position:absolute;top:0;width:12.5cqw;height:12.5cqw;border-radius:50%}
.cc .mc i:first-child{left:0;background:#EB001B}
.cc .mc i:last-child{right:0;background:#F79E1B;mix-blend-mode:normal;opacity:.92}
.cc .visa{position:absolute;right:7%;bottom:7.5%;font-size:11cqw;font-weight:800;font-style:italic;letter-spacing:-.02em;background:linear-gradient(180deg,#fff,#c9ccd3 55%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.cc-bbva{background:linear-gradient(160deg,#2F5597 0%,#1E3F80 45%,#16336C 100%)}
.cc-bbva .peak{position:absolute;left:32%;top:24%;width:34%;height:55%}
.cc-bbvaa{background:linear-gradient(160deg,#A4E3E8 0%,#6CC3CD 50%,#4FA8B5 100%)}
.cc-bbvaa .peak{position:absolute;left:32%;top:24%;width:34%;height:55%;opacity:.7}
.cc-nu{background:radial-gradient(120% 120% at 85% 60%,#B15CFF 0%,#8A3FD8 40%,#5E2B9E 100%)}
.cc-nu .brandmark{font-size:14cqw;font-weight:700;letter-spacing:-.04em;top:11%}
.cc-mp{background:#0F0F10}
.cc-mp .words{position:absolute;left:-1%;top:4%;font-weight:800;font-size:23cqw;line-height:.86;letter-spacing:-.04em;background:linear-gradient(100deg,#4A4A4C 0%,#3A3A3C 35%,#1F1F21 60%,#141416 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.cc-mp .chipx{position:absolute;left:44%;top:13%;width:12cqw;height:9.5cqw;border-radius:1.8cqw;background:linear-gradient(135deg,#6E6E70,#3E3E40);box-shadow:inset 0 0 0 .4cqw rgba(255,255,255,.12)}
.cc-mp .kind{top:auto;bottom:30%;right:7%;color:#bbb}
.cc-mp .wal{position:absolute;left:7%;bottom:30%;font-size:4.4cqw;font-weight:700;color:#6a6a6c}
.cc-cash{background:linear-gradient(160deg,#3B4B3E,#24302A)}
.cc-save{background:linear-gradient(160deg,#C6EE3A,#8FC21A);color:#1c2408}
.cc .bal{position:absolute;left:7%;top:42%;font-size:4.4cqw;opacity:.85}
.cc .bal b{display:block;font-size:9cqw;font-weight:700;opacity:1;letter-spacing:-.02em}
.mini{display:inline-block;width:22px;height:14px;border-radius:3.5px;flex:none;position:relative;overflow:hidden}
.mini::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.cardinfo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cardinfo>div{background:var(--card2);border-radius:18px;padding:12px 14px}
.cardinfo .v{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.pick{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:8px -16px 0;padding:4px 16px 6px}
.pick::-webkit-scrollbar{display:none}
.pick button{flex:none;width:92px;text-align:center;font-size:12px;font-weight:600;color:var(--ink2);transition:transform .16s}
.pick button .cc{border-radius:9px;box-shadow:none;outline:2px solid transparent;outline-offset:2px;transition:outline-color .2s}
.pick button[aria-pressed="true"]{color:var(--ink)}
.pick button[aria-pressed="true"] .cc{outline-color:var(--ink)}
.pick button span{display:block;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* tarjetas chiquitas en el inicio */
.minis{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:16px -18px 0;padding:2px 18px 6px;scroll-snap-type:x mandatory;scroll-padding-inline:18px}
.minis::-webkit-scrollbar{display:none}
.minis button{flex:none;width:112px;scroll-snap-align:start;animation:rise2 .6s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--i) * 60ms)}
.minis .cc{border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.minis .cap{display:flex;flex-direction:column;margin-top:6px;font-size:12px;line-height:1.25;text-align:left;font-weight:600;padding:0 2px}
.minis .cap span:first-child{color:var(--ink2);font-weight:500}
.minis .cap span:last-child{font-size:14.5px}
@keyframes rise2{from{opacity:0;transform:translateX(24px) scale(.96)}}

/* análisis */
.split{display:flex;gap:8px;height:104px}
.split>div{display:flex;flex-direction:column;min-width:0;transition:flex-grow .8s cubic-bezier(.2,.8,.2,1)}
.split .k{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;padding-left:6px;border-left:1.5px solid var(--line2);font-weight:500}
.split .p{font-size:24px;font-weight:600;padding-left:6px;border-left:1.5px solid var(--line2);white-space:nowrap;letter-spacing:-.02em}
.split .p small{font-size:14px;margin-left:2px}
.split .st{flex:1;margin-top:8px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--c) 0 2px,transparent 2px 5px)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px}
.months{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--ink2);font-weight:500}
.tip{position:absolute;pointer-events:none;background:var(--card);box-shadow:var(--tipShadow);border-radius:14px;padding:10px 12px;font-size:12px;min-width:160px;transform:translateX(-50%);transition:left .08s}
.tip b{display:block;font-size:13px;margin-bottom:6px}
.tip div{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* asistente */
.chatTop{display:flex;align-items:center;gap:10px;margin:0 -18px;padding:calc(8px + env(safe-area-inset-top,0px)) 18px 10px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:3}
.chatTop h2{flex:1;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px}
.chatTop h2 img{width:24px;height:24px;border-radius:7px}
.msgs{display:flex;flex-direction:column;gap:10px;padding:14px 0 8px}
.msg{max-width:84%;padding:12px 15px;border-radius:22px;font-size:15px;line-height:1.45;animation:in .3s cubic-bezier(.2,.8,.2,1)}
.msg time{display:block;font-size:11px;margin-top:5px;opacity:.55}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:8px}
.msg.me time{text-align:right}
.msg.bot{align-self:flex-start;background:var(--card);border-bottom-left-radius:8px}
.msg.bot b{font-weight:700}
.msg.bot ul{margin:6px 0 0;padding-left:18px}
.sugs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:6px -18px 0;padding:0 18px}
.sugs::-webkit-scrollbar{display:none}
.sug{flex:none;height:38px;padding:0 15px;border-radius:99px;background:var(--card);font-size:13.5px;font-weight:600}
.ins{flex:none;width:160px;border-radius:20px;background:var(--card);padding:12px;text-align:left}
.ins .r{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;margin-top:6px}
.ins .ci{width:32px;height:32px;border-radius:10px}
.ins .ci svg{width:16px;height:16px}
.compose{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,calc(env(safe-area-inset-bottom,0px) - 8px));z-index:8;width:min(404px,calc(100% - 24px));border-radius:99px;padding:6px 6px 6px 18px}
.compose form{display:flex;align-items:center;gap:10px}
.compose input{flex:1;min-width:0;height:44px;border:0;background:none;outline:none}
.compose input::placeholder{color:var(--ink2)}
.compose button{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.compose svg{width:19px;height:19px}

/* barra de navegación de vidrio (igual que Mi Jetta) */
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glassBorder);box-shadow:inset 0 1px 0 var(--glassBorder),0 12px 30px var(--glassShadow)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,calc(env(safe-area-inset-bottom,0px) - 8px));z-index:8;display:flex;align-items:center;padding:5px;border-radius:99px;width:min(404px,calc(100% - 24px))}
.nav button{flex:1;min-width:0;height:54px;border-radius:99px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:color-mix(in srgb,var(--ink) 72%,transparent);font-size:10px;font-weight:600;transition:color .2s,background-color .25s,transform .16s}
.nav button:active{transform:scale(.92)}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--ink);background:color-mix(in srgb,var(--ink) 9%,transparent)}
.nav .add{flex:none;width:54px;border-radius:50%;background:var(--ink);color:var(--bg);margin:0 4px}
.nav .add svg{width:24px;height:24px}

/* hoja inferior */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:9;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-width:440px;margin:0 auto;background:var(--card);border-radius:30px 30px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:calc(100dvh - env(safe-area-inset-top,0px) - 16px);overflow:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1)}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 12px;position:relative}
.grab::before{content:"";position:absolute;inset:-14px -60px}
.sheet h3{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:6px 0 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card2);border-radius:99px;padding:4px}
.seg button{height:38px;border-radius:99px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.amount{display:flex;align-items:baseline;justify-content:center;gap:4px;margin:18px 0 10px}
.amount span{font-size:30px;color:var(--ink2);font-weight:500}
.amount input{width:100%;max-width:240px;text-align:center;font-size:46px;font-weight:600;background:none;border:0;outline:none;letter-spacing:-.03em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{height:36px;padding:0 12px;border-radius:99px;background:var(--card2);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink2);transition:background-color .2s,color .2s}
.chips button svg{width:15px;height:15px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.field{margin-top:16px}
.field input{width:100%;height:48px;border:0;border-radius:16px;background:var(--card2);padding:0 14px;outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;height:52px;border-radius:99px;border:1.5px solid var(--line2);font-weight:600;font-size:15.5px;display:grid;place-items:center;text-decoration:none}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.red{color:var(--down)}
.list{display:flex;flex-direction:column;background:var(--card2);border-radius:22px;overflow:hidden;margin-top:12px}
.list button,.list a{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;text-align:left;text-decoration:none;font-size:16px;font-weight:500}
.list>*+*{border-top:1px solid var(--line)}
.list svg{width:21px;height:21px;color:var(--ink2);flex:none}
.list .chev{margin-left:auto;width:9px;height:14px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:20;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  <button data-go="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h3"/></svg>Tarjetas</button>

  <button data-go="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M7 16v-4M12 16V7M17 16v-6"/></svg>Análisis</button>
  <button data-go="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-8l-5 4v-4H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>Asistente</button>
</nav>

</form></div>

<div class="toast" id="toast"></div>

<script>
/* ======================= Datos ======================= */
const CATS={
 comida:{n:"Comida fuera",k:"want",ic:'<path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 3c-2 2-2 6 0 8v10"/>',w:["comida","restaurante","tacos","taco","cafe","café","starbucks","pizza","sushi","hamburguesa","torta","antojo","desayuno","cena","comer"]},
 super:{n:"Súper",k:"need",ic:'<circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2l2.5 11h11L21 8H6.2"/>',w:["super","súper","despensa","mandado","walmart","soriana","costco","oxxo","chedraui","bodega"]},
 auto:{n:"Auto",k:"need",ic:'<path d="M5 16v-4l2-5h10l2 5v4M4 16h16M6 16v2.5M18 16v2.5M7.5 12.5h.01M16.5 12.5h.01"/>',w:["gasolina","gas ","auto","jetta","carro","coche","servicio","aceite","llanta","verificacion","estacionamiento","caseta","lavado"]},
 casa:{n:"Casa",k:"need",ic:'<path d="M4 10.5L12 4l8 6.5V20H4z"/>',w:["renta","luz","agua","internet","casa","cfe","telmex","izzi","gas lp","predial","mantenimiento"]},
 transporte:{n:"Transporte",k:"need",ic:'<rect x="5" y="3" width="14" height="15" rx="3"/><path d="M5 11h14M8 21v-3M16 21v-3"/>',w:["uber","didi","metro","taxi","camion","camión","transporte","metrobus"]},
 salud:{n:"Salud",k:"need",ic:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',w:["salud","doctor","farmacia","medicina","gym","gimnasio","dentista","consulta","seguro"]},
 ocio:{n:"Ocio",k:"want",ic:'<path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/>',w:["ocio","cine","salida","fiesta","bar","antro","concierto","boletos","juego","videojuego","viaje","cerveza","chelas"]},
 subs:{n:"Suscripciones",k:"want",ic:'<path d="M17 2l3 3-3 3M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 0 1-4 4H4"/>',w:["suscripcion","suscripción","netflix","spotify","icloud","youtube","disney","hbo","max","prime","chatgpt","claude","app"]},
 compras:{n:"Compras",k:"want",ic:'<path d="M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2"/>',w:["compras","ropa","amazon","mercado libre","tenis","zapatos","regalo","tienda","liverpool"]},
 otros:{n:"Otros",k:"want",ic:'<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>',w:[]},
 sueldo:{n:"Sueldo",k:"in",ic:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',w:["sueldo","quincena","nomina","nómina","pago","salario"]},
 extra:{n:"Ingreso extra",k:"in",ic:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',w:["extra","venta","vendi","vendí","bono","regalo","reembolso","freelance"]}
};
CATS.move={n:"Transferencia",k:"move",ic:'<path d="M4 8h14l-3-3M20 16H6l3 3"/>',w:[]};
const OUT=Object.keys(CATS).filter(k=>k!=="move").filter(k=>CATS[k].k!=="in"),IN=["sueldo","extra"];
/* Tus tarjetas (diseño visual) + efectivo y ahorro. t: deb | cred | cash | save */
const ACCS={
 bbva:{n:"BBVA Azul",t:"deb",net:"visa",last:"3435",start:8200},
 bbvaa:{n:"BBVA Aqua",t:"cred",net:"",last:"",start:-900},
 nu:{n:"Nu",t:"cred",net:"mc",last:"5003",start:-2400},
 mp:{n:"Mercado Pago",t:"deb",net:"mc",last:"",start:900},
 cash:{n:"Efectivo",t:"cash",start:1300},
 save:{n:"Ahorro",t:"save",start:12000}
};
const CARDS=["bbva","bbvaa","nu","mp"];
const acc=k=>({...ACCS[k],...((S&&S.meta&&S.meta[k])||{})});
const KEY="finz2";
const today=()=>{const d=new Date();return iso(d)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};

/* Datos de ejemplo realistas y reproducibles: 12 meses de quincenas, renta, súper, gasolina, salidas… */
function sample(){
  let seed=20261004;const R=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const pick=a=>a[Math.floor(R()*a.length)],amt=(a,b,r=10)=>Math.round((a+R()*(b-a))/r)*r;
  const tx=[];let id=1;const bal={};for(const k in ACCS)bal[k]=ACCS[k].start;
  const T=(d,type,cat,a,acc,note)=>{tx.push({id:id++,d,type,cat,a,acc,note});bal[acc]+=type==="in"?a:-a};
  const M=(d,a,acc,to,note)=>{if(a<=0)return;tx.push({id:id++,d,type:"move",cat:"move",a,acc,to,note});bal[acc]-=a;bal[to]+=a};
  const end=today();let d=addDays(end,-364);
  while(d<=end){
    const D=parse(d),dom=D.getDate(),dow=D.getDay(),last=new Date(D.getFullYear(),D.getMonth()+1,0).getDate();
    if(dom===15||dom===last){T(d,"in","sueldo",16500,"bbva","Quincena");M(d,3500,"bbva","save","Ahorro de quincena")}
    if(dom===10)M(d,Math.round(-bal.nu),"bbva","nu","Pago tarjeta Nu");
    if(dom===20)M(d,Math.round(-bal.bbvaa),"bbva","bbvaa","Pago BBVA Aqua");
    if(dom===2)M(d,1500,"bbva","mp","Recarga Mercado Pago");
    if(bal.cash<350)M(d,1500,"bbva","cash","Retiro en cajero");
    if(dom===1)T(d,"out","casa",7500,"bbva","Renta");
    if(dom===5)T(d,"out","casa",amt(380,620),"bbva","Luz CFE");
    if(dom===8)T(d,"out","casa",549,"bbvaa","Internet");
    if(dom===12)T(d,"out","subs",219,"nu","Netflix");
    if(dom===18)T(d,"out","subs",129,"bbvaa","Spotify");
    if(dom===22)T(d,"out","subs",49,"mp","iCloud");
    if(dom===3)T(d,"out","salud",699,"bbva","Gimnasio");
    if(dow===6)T(d,"out","super",amt(700,1150),pick(["bbva","nu","bbvaa"]),pick(["Walmart","Soriana","Costco","Súper"]));
    if(dow===1)T(d,"out","auto",amt(600,820),pick(["bbva","bbvaa"]),"Gasolina Jetta");
    if(R()<.36)T(d,"out","comida",amt(80,360),pick(["cash","mp","nu","bbva"]),pick(["Tacos","Café","Comida corrida","Sushi","Pizza","Tortas","Hamburguesa"]));
    if((dow===5||dow===6)&&R()<.45)T(d,"out","ocio",amt(250,950),pick(["nu","cash","bbvaa"]),pick(["Cine","Bar","Salida con amigos","Concierto","Boliche"]));
    if(R()<.12)T(d,"out","transporte",amt(60,180),"mp",pick(["Uber","DiDi"]));
    if(R()<.05)T(d,"out","compras",amt(300,1800,50),pick(["mp","nu"]),pick(["Ropa","Amazon","Mercado Libre","Tenis"]));
    if(R()<.03)T(d,"out","salud",amt(150,700),"bbva",pick(["Farmacia","Consulta"]));
    if(R()<.008)T(d,"out","auto",amt(1800,3200,100),"bbvaa",pick(["Servicio Jetta","Llantas alineación","Afinación"]));
    if(R()<.02)T(d,"in","extra",amt(500,2500,100),pick(["bbva","mp"]),pick(["Venta","Freelance","Reembolso"]));
    d=addDays(d,1);
  }
  return {tx,sample:true,goal:20,nid:id};
}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
// Migra datos propios de la versión anterior (débito → BBVA Azul, crédito → Nu)
if(!S){try{const o=JSON.parse(localStorage.getItem("finz1"));if(o&&!o.sample&&Array.isArray(o.tx)){const m={deb:"bbva",cred:"nu"};o.tx.forEach(t=>{t.acc=m[t.acc]||t.acc;if(t.to)t.to=m[t.to]||t.to});S=o}}catch(e){}}
if(!S||!Array.isArray(S.tx))S=sample();
S.meta=S.meta||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("No se pudo guardar")}};

/* ======================= Utilidades ======================= */
const $=s=>document.querySelector(s);
const money=(n,dec)=>(n<0?"-":"")+"$"+Math.abs(n).toLocaleString("es-MX",{minimumFractionDigits:dec?2:0,maximumFractionDigits:dec?2:0});
const short=n=>{const a=Math.abs(n);return (n<0?"-":"")+(a>=1e6?(a/1e6).toFixed(1)+"M":a>=1e4?(a/1e3).toFixed(1)+"k":a>=1e3?(a/1e3).toFixed(1)+"k":Math.round(a))};
const pct=(a,b)=>b?((a-b)/b*100):null;
const svg=(p,w=1.8)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESL=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const fdate=s=>{const d=parse(s);return `${d.getDate()} ${MES[d.getMonth()]}`};
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const sum=(l,f=t=>t.a)=>l.reduce((s,t)=>s+f(t),0);
const outs=(a,b)=>S.tx.filter(t=>t.type==="out"&&t.d>=a&&t.d<=b);
const ins=(a,b)=>S.tx.filter(t=>t.type==="in"&&t.d>=a&&t.d<=b);
const monthStart=(off=0)=>{const d=parse(today());return iso(new Date(d.getFullYear(),d.getMonth()+off,1))};
const monthEnd=(off=0)=>{const d=parse(today());return iso(new Date(d.getFullYear(),d.getMonth()+off+1,0))};
const chgHTML=(v,inverse)=>{if(v==null||!isFinite(v))return `<span class="chg muted">—</span>`;const good=inverse?v<=0:v>=0;return `<span class="chg ${good?"up":"down"}">${svg(v>=0?'<path d="M12 19V5M6 11l6-6 6 6"/>':'<path d="M12 5v14M6 13l6 6 6-6"/>',2.4)}${Math.abs(v).toFixed(1)}%</span>`};
function balances(upTo="9999"){const b={};for(const k in ACCS)b[k]=ACCS[k].start;for(const t of S.tx)if(t.d<=upTo){if(t.type==="move"){b[t.acc]-=t.a;b[t.to]+=t.a}else b[t.acc]+=t.type==="in"?t.a:-t.a}return b}
const liquid=b=>Object.keys(ACCS).filter(k=>acc(k).t!=="save").reduce((s,k)=>s+b[k],0);
/* --- caras de tarjeta (recreaciones visuales) --- */
const MC='<span class="mc"><i></i><i></i></span>',NFC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 8a6 6 0 0 1 0 8M12 5a10 10 0 0 1 0 14M16 2.5a13.5 13.5 0 0 1 0 19"/></svg>';
const PEAK=c=>`<svg class="peak" viewBox="0 0 100 100" fill="none" stroke="${c}" stroke-width="1.6"><path d="M18 96L50 8l32 88M30 96L50 40l20 56"/><path d="M-200 52H38M62 52H300" stroke-width="1"/></svg>`;
function cardFace(k,o={}){const a=acc(k),d=`<span class="digits num"><span>••••</span>${a.last||"····"}</span>`,kind=a.t==="cred"?"crédito":a.t==="deb"?"débito":"";
  const bal=o.bal!=null?`<span class="bal">${a.t==="cred"?"Por pagar":"Saldo"}<b class="num">${money(a.t==="cred"?-o.bal:o.bal)}</b></span>`:"";
  if(k==="bbva")return `<div class="cc cc-bbva">${PEAK("rgba(140,180,255,.35)")}<span class="brandmark">BBVA</span>${bal}${d}<span class="visa">VISA</span></div>`;
  if(k==="bbvaa")return `<div class="cc cc-bbvaa">${PEAK("rgba(255,255,255,.45)")}<span class="brandmark">BBVA</span><span class="kind">${kind}</span>${bal}${d}</div>`;
  if(k==="nu")return `<div class="cc cc-nu"><span class="brandmark">nu</span><span class="kind">${kind} ${NFC}</span>${bal}${d}${MC}</div>`;
  if(k==="mp")return `<div class="cc cc-mp"><span class="words">MER<br>CADO<br>PAGO</span><span class="chipx"></span><span class="kind" style="top:12%;bottom:auto">${NFC}</span><span class="wal">Wallet</span><span class="kind">${kind==="débito"?"debit":kind}</span>${bal}${MC}</div>`;
  return `<div class="cc cc-${k}"><span class="brandmark" style="font-size:8cqw">${a.n}</span>${bal}</div>`}
const miniBG={bbva:"linear-gradient(160deg,#2F5597,#16336C)",bbvaa:"linear-gradient(160deg,#A4E3E8,#4FA8B5)",nu:"linear-gradient(135deg,#5E2B9E,#B15CFF)",mp:"#0F0F10",cash:"linear-gradient(160deg,#3B4B3E,#24302A)",save:"linear-gradient(160deg,#C6EE3A,#8FC21A)"};
const mini=k=>`<i class="mini" style="background:${miniBG[k]}"></i>`;
let tt;function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),1900)}

/* ======================= Pantallas ======================= */
let screen="home",range="1M",mode="candle",q="",binc="all",heatPick=null;
function header(title,sub){
  const h=new Date().getHours(),pend=balances();
  return `<div class="bar"><button class="brand press" data-menu><img src="icons/icon.svg" alt=""><span>Mis Finanzas<small>${h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches"}, Diego</small></span></button><span class="sp"></span>
  <button class="rb press" data-go="chat" aria-label="Asistente">${svg('<path d="M5 5h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-8l-5 4v-4H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>')}</button>
  <button class="rb press" data-menu aria-label="Menú">${svg('<path d="M4 7h16M4 12h16M4 17h16"/>',2)}</button></div>
  <h1>${title}</h1>${sub?`<div class="subttl">${sub}</div>`:""}`;
}
function txRow(t){const c=CATS[t.cat]||CATS.otros,mv=t.type==="move";return `<button class="tx press" data-tx="${t.id}"><span class="ci">${svg(c.ic)}</span><span class="t"><b>${t.note||c.n}</b><small>${mini(t.acc)}${mv?`${acc(t.acc).n} → ${acc(t.to).n}`:`${c.n} · ${acc(t.acc).n}`}</small></span><span class="a num ${t.type==="in"?"up":mv?"muted":""}">${t.type==="in"?"+":mv?"":"-"}${money(t.a)}<small>${fdate(t.d)}</small></span></button>`}

/* --- velas del saldo disponible --- */
function candles(){
  const n={"7D":7,"1M":30,"3M":91}[range],bucket=range==="3M"?7:1,end=today(),start=addDays(end,-n+1);
  let bal=liquid(balances(addDays(start,-1)));
  const byDay={};S.tx.filter(t=>t.d>=start&&t.d<=end).forEach(t=>(byDay[t.d]=byDay[t.d]||[]).push(t));
  const out=[];let cur=null,d=start,i=0;
  while(d<=end){
    if(i%bucket===0){cur={d,o:bal,h:bal,l:bal,c:bal};out.push(cur)}
    for(const t of (byDay[d]||[]).sort((a,b)=>(a.type==="in"?0:1)-(b.type==="in"?0:1))){const dl=t.type==="move"?(t.to==="save"?-t.a:t.acc==="save"?t.a:0):t.type==="in"?t.a:-t.a;if(!dl)continue;bal+=dl;cur.h=Math.max(cur.h,bal);cur.l=Math.min(cur.l,bal)}
    cur.c=bal;d=addDays(d,1);i++;
  }
  return out;
}
function candleSVG(){
  const cs=candles(),W=340,H=190,R=46,top=10,bot=26,cw=(W-R-8)/cs.length;
  let lo=Math.min(...cs.map(c=>c.l)),hi=Math.max(...cs.map(c=>c.h));const pad=(hi-lo)*.08||500;lo-=pad;hi+=pad;
  const Y=v=>top+(hi-v)/(hi-lo)*(H-top-bot);
  let g="";for(let k=0;k<5;k++){const v=lo+(hi-lo)*k/4,y=Y(v);g+=`<line x1="0" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${W-8}" y="${y+3.5}" text-anchor="end" fill="var(--ink2)" font-size="9.5">${short(v)}</text>`}
  for(let k=1;k<6;k++){const x=(W-R)*k/6;g+=`<line y1="${top}" y2="${H-bot}" x1="${x}" x2="${x}" stroke="var(--line)" stroke-width="1"/>`}
  let body="";

  <div class="sugs" style="margin-top:10px;padding-bottom:90px">${ins_.map(x=>`<button class="ins press" data-ask="¿Cuánto gasté en ${CATS[x.k].n.toLowerCase()}?"><span class="ci">${svg(CATS[x.k].ic)}</span>${spark(x.k)}<span class="r"><span class="muted">${CATS[x.k].n}</span><span class="${x.p>0?"down":"up"}">${x.p>0?"+":""}${x.p.toFixed(0)}%</span></span></button>`).join("")}</div>`;

function catFrom(s){const n=" "+norm(s)+" ";for(const k of Object.keys(CATS))if(CATS[k].w.some(w=>n.includes(norm(w))))return k;return null}
function answer(raw){
  const s=norm(raw),t=today(),ms=monthStart(),dom=parse(t).getDate(),dim=parse(monthEnd()).getDate();
  const mO=sum(outs(ms,t)),mI=sum(ins(ms,t)),expI=sum(ins(monthStart(-1),monthEnd(-1)))||mI;
  const amtM=raw.replace(/,/g,"").match(/\$?\s*(\d+(?:\.\d+)?)/),amt=amtM?parseFloat(amtM[1]):null;
  // registrar movimiento
  if(amt&&/(gaste|pague|compre|registra|agrega|anota|me gaste|cargue|puse)/.test(s)){const cat=catFrom(raw)||"otros";const note=raw.replace(/\$?\s*\d[\d,\.]*/,"").replace(/(gast[eé]|pagu[eé]|compr[eé]|registra|agrega|anota|cargu[eé]|puse|en|de|me)\b/gi,"").replace(/\s+/g," ").trim().replace(/^./,c=>c.toUpperCase());
    const tx={id:S.nid++,d:t,type:"out",cat,a:amt,acc:/efectivo|cash/.test(s)?"cash":/\bnu\b/.test(s)?"nu":/mercado ?pago|\bmp\b/.test(s)?"mp":/aqua/.test(s)?"bbvaa":"bbva",note:note||CATS[cat].n};S.tx.push(tx);
    return `Listo, registré <b>${money(amt)}</b> en <b>${CATS[cat].n}</b> (${acc(tx.acc).n}). Este mes llevas ${money(mO+amt)} gastados.`}
  if(amt&&/(me pagaron|cobre|recibi|ingreso|deposito|me depositaron)/.test(s)){const cat=/sueldo|quincena|nomina/.test(s)?"sueldo":"extra";S.tx.push({id:S.nid++,d:t,type:"in",cat,a:amt,acc:/mercado ?pago/.test(s)?"mp":"bbva",note:CATS[cat].n});return `Anotado: ingreso de <b>${money(amt)}</b> como ${CATS[cat].n}.`}
  // puedo gastar
  if(amt&&/(puedo|alcanza|me conviene|deberia)/.test(s)){const goal=expI*S.goal/100,left=expI-goal-mO,daily=(left-amt)/Math.max(1,dim-dom);
    return left-amt>=0?`Sí. Con tu ingreso de ~${money(expI)} y meta de ahorro de ${S.goal}%, te quedan <b>${money(left)}</b> este mes. Después de gastar ${money(amt)} tendrías <b>${money(daily)} por día</b> hasta fin de mes.`
    :`Mejor no por ahora. Para respetar tu meta de ahorro (${S.goal}%) te quedan <b>${money(Math.max(0,left))}</b> este mes y ${money(amt)} te dejaría <b>${money(left-amt)}</b> abajo. Si es necesario, sale de tu ahorro.`}
  const cat=catFrom(raw);
  if(/gasolina|jetta|carro|auto/.test(s)){const l=outs(monthStart(-2),t).filter(x=>x.cat==="auto"),g=l.filter(x=>/gasolina/i.test(x.note)),mg=outs(ms,t).filter(x=>x.cat==="auto");
    return `En auto llevas <b>${money(sum(mg))}</b> este mes. En los últimos 3 meses: ${money(sum(g))} en gasolina (${g.length} cargas, ~${money(g.length?sum(g)/g.length:0)} c/u) y ${money(sum(l)-sum(g))} en servicio y otros. <br>Tip: registra kilometraje en <a href="../jetta/">Mi Jetta</a> para saber cuánto te cuesta cada km.`}
  if(cat&&CATS[cat].k!=="in"&&/(cuanto|gaste|gasto|llevo|en )/.test(s)){const v=sum(outs(ms,t).filter(x=>x.cat===cat)),pv=sum(outs(monthStart(-1),addDays(monthStart(-1),dom-1)).filter(x=>x.cat===cat)),p=pct(v,pv);
    return `En <b>${CATS[cat].n}</b> llevas <b>${money(v)}</b> este mes${p!=null&&isFinite(p)?`, ${p>0?"<b>"+p.toFixed(0)+"% más</b>":Math.abs(p).toFixed(0)+"% menos"} que a estas alturas del mes pasado (${money(pv)})`:""}.`}
  if(/cerrar|proyeccion|fin de mes|terminar|voy a acabar|como voy/.test(s)){const rest=sum(outs(addDays(monthStart(-1),dom),monthEnd(-1))),proj=mO+rest,sav=expI-proj;
    return `Llevas ${money(mO)}. Si el resto del mes se parece al mes pasado (${money(rest)} del día ${dom+1} en adelante), cerrarías con <b>${money(proj)}</b> de gasto. Con ingresos de ~${money(expI)} ahorrarías <b class="${sav>=0?"":""}">${money(sav)}</b> (${Math.round(sav/expI*100)}%). ${sav/expI*100>=S.goal?"Vas arriba de tu meta 👌":"Para llegar al "+S.goal+"% tendrías que recortar ~"+money((expI*S.goal/100-sav)/Math.max(1,dim-dom))+" por día."}`}
  if(/cuanto (llevo|he|gaste)|total|este mes/.test(s)){const pv=sum(outs(monthStart(-1),addDays(monthStart(-1),dom-1)));
    return `Este mes llevas <b>${money(mO)}</b> en gastos e <b>${money(mI)}</b> en ingresos. A estas alturas del mes pasado ibas en ${money(pv)}.`}
  if(/en que gasto|mas gasto|donde se va|top|categorias/.test(s)){const by={};outs(ms,t).forEach(x=>by[x.cat]=(by[x.cat]||0)+x.a);const l=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,4);
    return `Tus gastos más grandes este mes:<ul>${l.map(([k,v])=>`<li>${CATS[k].n}: <b>${money(v)}</b> (${Math.round(v/mO*100)}%)</li>`).join("")}</ul>`}
  if(/consejo|tip|ahorrar|ayuda|recomienda/.test(s)){const tips=[];const by={},pb={};outs(ms,t).forEach(x=>by[x.cat]=(by[x.cat]||0)+x.a);outs(monthStart(-1),addDays(monthStart(-1),dom-1)).forEach(x=>pb[x.cat]=(pb[x.cat]||0)+x.a);
    const up=Object.keys(by).filter(k=>CATS[k].k==="want"&&pb[k]&&by[k]>pb[k]*1.15).sort((a,b)=>(by[b]-pb[b])-(by[a]-pb[a]));
    if(up[0])tips.push(`<b>${CATS[up[0]].n}</b> subió ${money(by[up[0]]-pb[up[0]])} vs el mes pasado. Ponle un tope semanal.`);
    const subs=sum(outs(monthStart(-1),monthEnd(-1)).filter(x=>x.cat==="subs"));if(subs)tips.push(`Pagas ~<b>${money(subs)}/mes</b> en suscripciones (${money(subs*12)} al año). Revisa cuál no usas.`);
    const bl=balances();CARDS.filter(k=>acc(k).t==="cred"&&bl[k]<0).forEach(k=>tips.push(`Tu tarjeta <b>${acc(k).n}</b> debe <b>${money(-bl[k])}</b>. Págala completa antes de la fecha límite para no pagar intereses.`));
    const em=sum(outs(monthStart(-3),monthEnd(-1)))/3*3;tips.push(`Fondo de emergencia ideal: 3 meses de gastos ≈ <b>${money(em)}</b>. Tienes ${money(balances().save)} en ahorro (${Math.round(balances().save/em*100)}%).`);
    tips.push(`Automatiza: aparta el ${S.goal}% el día de quincena, antes de gastar.`);
    return `Algunas ideas con tus números:<ul>${tips.map(x=>`<li>${x}</li>`).join("")}</ul>`}
  if(/hola|buenas|que tal/.test(s))return `¡Hola! Pregúntame cuánto llevas gastado, cómo vas a cerrar el mes, si te alcanza para algo, o dime “gasté 300 en súper” y lo registro.`;
  return `No entendí del todo. Prueba con:<ul><li>“¿Cuánto gasté en comida?”</li><li>“¿Puedo gastar $2,000?”</li><li>“gasté 450 en gasolina”</li><li>“Dame un consejo”</li></ul>`;
}

  const sh=$("#sheet");let sy=null,dy=0;
  sh.addEventListener("touchstart",e=>{if(sh.scrollTop>0||e.target.closest("input"))return;sy=e.touches[0].clientY;dy=0},{passive:true});
  sh.addEventListener("touchmove",e=>{if(sy==null)return;dy=e.touches[0].clientY-sy;if(dy>0){sh.classList.add("drag");sh.style.transform=`translateY(${dy}px)`;if(e.cancelable)e.preventDefault()}},{passive:false});
  sh.addEventListener("touchend",()=>{if(sy==null)return;sy=null;sh.classList.remove("drag");if(dy>90)closeSheet();else sh.style.transform=""});
})();

save();syncThemeColor();render();
if("serviceWorker" in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
